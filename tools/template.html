<div class="app">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar" id="sidebar" aria-label="课程目录">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Py</div>
      <div class="brand-txt">
        <strong>学习工作台</strong>
        <span>24 L / 4 STAGE</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="timer" id="timer" data-run="0" title="专注计时 · 点击开始 / 暂停">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
        <span id="timerTxt">25:00</span>
      </div>
      <button class="icon-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="icon-btn" id="printBtn" title="打印 / 导出 PDF" aria-label="打印或导出为 PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4v-6h16v6h-2M6 14h12v8H6z"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" data-open="0"></div>

  <!-- ========== 主区 ========== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="打开课程目录" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <button class="search-trigger" id="searchBtn" aria-label="搜索课程内容">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>搜索知识点、例题、作业…</span>
        <kbd class="kbd" id="kbdHint">Ctrl K</kbd>
      </button>
      <div class="topbar-spacer"></div>
      <div class="prog-ring" id="progRing" title="总进度">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle class="bg" cx="22" cy="22" r="18"/>
          <circle class="fg" id="ringFg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"/>
        </svg>
        <b id="ringTxt">0%</b>
      </div>
    </header>
    <div class="scrollbar" aria-hidden="true"><i id="scrollBar"></i></div>

    <main class="content" id="contentRoot" tabindex="-1"></main>
  </div>
</div>

<!-- ========== 搜索面板 ========== -->
<div class="overlay" id="overlay" data-open="0" role="dialog" aria-modal="true" aria-label="搜索课程内容">
  <div class="palette">
    <div class="palette-in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="输入关键词，如「装饰器」「闭包」「json」" autocomplete="off" spellcheck="false">
    </div>
    <ul class="palette-res" id="searchRes"></ul>
    <div class="palette-foot">
      <span>↑↓ 选择</span><span>Enter 跳转</span><span>Esc 关闭</span>
      <span style="margin-left:auto" id="searchCount"></span>
    </div>
  </div>
</div>

<!-- ========== 快捷键面板 ========== -->
<div class="overlay" id="helpOverlay" data-open="0" role="dialog" aria-modal="true" aria-label="键盘快捷键">
  <div class="palette">
    <div class="palette-in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      <b style="font-size:17px">键盘快捷键</b>
    </div>
    <ul class="keys" id="helpKeys"></ul>
    <div class="palette-foot">
      <span>Esc 关闭</span>
      <span>在输入框内不会触发</span>
      <span style="margin-left:auto">按 ? 随时唤出</span>
    </div>
  </div>
</div>

<button class="to-top" id="toTop" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="rv-bar" id="rvBar" data-show="0" aria-label="复习进度">
  <b class="rv-bar-n" id="rvBarN">1 / 1</b>
  <span class="rv-bar-t" id="rvBarT"></span>
  <button class="btn btn-sm" id="rvSkip" type="button">跳过</button>
  <button class="btn btn-sm" id="rvQuit" type="button">结束</button>
</div>

<script>
const COURSE = /*__COURSE_DATA__*/null;

/* ============================================================
   数据整理
   ============================================================ */
const ITEMS = [];        // 所有可学习条目（含阶段项目）
const ITEM_BY_ID = {};
const STAGE_BY_ID = {};

COURSE.stages.forEach(st => {
  STAGE_BY_ID[st.id] = st;
  st.lessons.forEach(l => { l.stageId = st.id; l.accent = st.accent; ITEMS.push(l); ITEM_BY_ID[l.id] = l; });
  if (st.project) {
    st.project.stageId = st.id; st.project.accent = st.accent;
    ITEMS.push(st.project); ITEM_BY_ID[st.project.id] = st.project;
  }
});
const TOTAL = ITEMS.length;

/* ============================================================
   状态（localStorage）
   ============================================================ */
const KEY = 'py-path-v3';
const KEY_V2 = 'py-path-v2';
const KEY_V1 = 'py-path-v1';
// rev：复习档期表，id → { l: 已连对次数, due: 下次该复习的日期, n: 一共练过几次 }
const STATE_DEFAULT = () => ({ done: {}, hw: {}, miles: {}, ex: {}, rev: {}, time: {}, theme: null, last: null });
const STATE_MAPS = ['done', 'hw', 'miles', 'ex', 'rev', 'time'];

let state = STATE_DEFAULT();
let saveTimer = null, dirty = false;

(function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* 隐私模式等场景静默降级 */ }
  let migrated = false;
  if (!raw) {
    // 从 v2 / v1 平滑迁移：进度、作业勾选、里程碑、错题、时长、主题都不能丢
    try { raw = localStorage.getItem(KEY_V2); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY_V1); } catch (e) {} }
    migrated = !!raw;
  }
  if (!raw) return;
  try {
    state = Object.assign(STATE_DEFAULT(), JSON.parse(raw));
    STATE_MAPS.forEach(k => {
      if (!state[k] || typeof state[k] !== 'object' || Array.isArray(state[k])) state[k] = {};
    });
    sweepRev();
    if (migrated) saveNow();
  } catch (e) { state = STATE_DEFAULT(); }
})();

/* 练习项有两族 id，共住在同一张复习档期表里：
   · 例题  ex-<课时 id>-<页内第几个答案块>
   · 作业  <课时 id>:<第几题>            ← 就靠这个冒号判别
   所以「这个 id 的标记该记在哪张表」是一个必须统一的判断，不能各写一遍。 */
function isHwKey(id) { return String(id).indexOf(':') >= 0; }
function markMap(id) { return isHwKey(id) ? state.hw : state.ex; }

/* 两张表的取值刻意保持一致：1 = 我搞定了，-1 = 我没搞定、要回头再来，缺省 = 还没表态。
   例题的 -1 叫「没写出来」，作业的 -1 叫「卡住」——同一件事的两种说法。
   值域统一的直接好处：复习引擎、错题本、统计口径全都不用再分叉。 */
function markGet(id) { return +(markMap(id)[id] || 0); }
function markSet(id, v) { const M = markMap(id); if (v) M[id] = v; else delete M[id]; return v || 0; }

/* 把档期表和标记对齐，三件事：
   ① 两张标记表都体检一遍：值不是 1 / -1 的一律清掉（老版本给作业存过 0，代表"没勾"）；
   ② 已经标成"欠着"、却还没有档期的，今天就到期——升级上来的老错题（含老作业勾错）立刻进队列；
   ③ 标记被取消、或值不合法的，档期记录一并清掉，免得导出里留一堆对不上的垃圾。 */
function sweepRev() {
  const t = dayKey();
  [state.ex, state.hw].forEach(M => {
    Object.keys(M).forEach(id => {
      const v = +M[id];
      if (v !== 1 && v !== -1) { delete M[id]; return; }
      M[id] = v;
      if (v === -1 && !state.rev[id]) state.rev[id] = { l: 0, due: t, n: 0 };
    });
  });
  Object.keys(state.rev).forEach(id => { if (markGet(id) !== -1) delete state.rev[id]; });
}

function saveNow() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(state)); dirty = false; } catch (e) {}
}
function save() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 120);
}
// 关页前落盘，别把最后几秒的学习时长丢了
addEventListener('beforeunload', () => { if (dirty) saveNow(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) saveNow();
});

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================================================
   主题
   ============================================================ */
(function initTheme() {
  const pref = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = pref;
})();
const sunPath = '<path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
const moonPath = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
function paintThemeIcon() {
  $('#themeIcon').innerHTML = document.documentElement.dataset.theme === 'dark' ? sunPath : moonPath;
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  state.theme = next; save(); paintThemeIcon();
  toast(next === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
  return next;
}
$('#themeBtn').addEventListener('click', toggleTheme);

/* ============================================================
   进度
   ============================================================ */
function isDone(id) { return !!state.done[id]; }
function doneCount() { return ITEMS.filter(i => isDone(i.id)).length; }
function stageDone(st) {
  const all = st.lessons.concat(st.project ? [st.project] : []);
  return { n: all.filter(i => isDone(i.id)).length, t: all.length };
}
function refreshProgress() {
  const n = doneCount(), pct = Math.round(n / TOTAL * 100);
  const C = 2 * Math.PI * 18;
  const ring = $('#ringFg');
  ring.setAttribute('stroke-dasharray', C.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (C * (1 - n / TOTAL)).toFixed(1));
  $('#ringTxt').textContent = pct + '%';
  $('#progRing').title = `总进度 ${n} / ${TOTAL} 项（${pct}%）`;
  $$('.nav-item').forEach(el => { el.dataset.done = isDone(el.dataset.id) ? '1' : '0'; });
  $$('.nav-bar[data-stage]').forEach(el => {
    const st = STAGE_BY_ID[el.dataset.stage];
    const p = stageDone(st);
    $('i', el).style.width = (p.t ? p.n / p.t * 100 : 0) + '%';
  });
  // ⚠️ `.stage-card` 这个类被两处复用：首页的阶段卡（带 data-stage），
  // 以及**阶段页里的课时卡**（只有 data-id，它自己的进度条在 renderStage 里就写好了）。
  // 早先这里没做筛选，阶段页就会拿到 STAGE_BY_ID[undefined] → stageDone(undefined)
  // 抛 TypeError，把整个 refreshProgress 连同其后的 refreshReviewBadge / paintRvBar /
  // 焦点归位一起中断——而验收套件的 17 个场景从不访问 #/s1…#/s4，所以一直没被发现。
  // 用 [data-stage] 筛选而不是 return 兜底：不筛选的话，即使不抛错也会把
  // 「阶段进度」写到课时卡上，是错的数。
  $$('.stage-card[data-stage]').forEach(el => {
    const st = STAGE_BY_ID[el.dataset.stage];
    const p = stageDone(st);
    $('.sc-bar i', el).style.width = (p.t ? p.n / p.t * 100 : 0) + '%';
    $('.sc-pct', el).textContent = `${p.n}/${p.t}`;
  });
}

/* ============================================================
   侧边栏
   ============================================================ */
const TICK = '<svg class="nav-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

const NAV_ICON = {
  home: '<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>',
  review: '<path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3.2L7 20V6a2 2 0 0 1 2-2Z"/><path d="m9.6 9.4 1.5 1.5 3-3"/>',
  quiz: '<path d="M9 3h6v3H9z"/><path d="M6 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1"/><path d="m9 14 2 2 4-4"/>',
  records: '<path d="M3 20V10M9 20V4M15 20v-7M21 20V7"/>'
};
function navLink(route, key, label, extra) {
  const href = route === 'home' ? '#/' : '#/' + route;
  return `<a class="nav-home" href="${href}" data-nav="${route}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON[key]}</svg>
      <span>${esc(label)}</span>${extra || ''}</a>`;
}

function buildNav() {
  const nav = $('#nav');
  let html = navLink('home', 'home', '课程总览')
    + navLink('review', 'review', '错题本', '<i class="nav-badge" id="reviewBadge" data-zero="1">0</i>')
    + navLink('quiz', 'quiz', '抽题自测')
    + navLink('records', 'records', '学习记录');

  COURSE.stages.forEach(st => {
    html += `<div class="nav-stage" data-accent="${st.accent}">
      <button class="nav-stage-head" data-nav="${st.id}">
        <span class="nav-stage-label"><b>${esc(st.label)}</b><em>${esc(st.name)}</em></span>
        <span class="nav-stage-num">${esc(st.range)}</span>
      </button>
      <div class="nav-bar" data-stage="${st.id}"><i></i></div>
      <ul class="nav-list">`;
    st.lessons.forEach(l => {
      const no = l.kind === 'lesson' ? String(l.no).padStart(2, '0') : (l.no || '·');
      html += `<li><a class="nav-item" href="#/${l.id}" data-id="${l.id}" data-nav="${l.id}">
        <span class="nav-no">${esc(no)}</span>
        <span class="nav-title" title="${esc(l.title)}">${esc(l.title)}</span>${TICK}</a></li>`;
    });
    if (st.project) {
      const p = st.project;
      html += `<li><a class="nav-item" href="#/${p.id}" data-id="${p.id}" data-nav="${p.id}">
        <span class="nav-no">🏁</span>
        <span class="nav-title" title="${esc(p.title)}">${esc(p.title)}</span>${TICK}</a></li>`;
    }
    html += `</ul></div>`;
  });
  nav.innerHTML = html;
}

function syncNav() {
  const route = getRoute();
  $$('[data-nav]').forEach(el => {
    const on = el.dataset.nav === route;
    if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
}

/* ============================================================
   路由
   ============================================================ */
function getRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')).trim();
  return h || 'home';
}
function go(route) {
  if (getRoute() === route) { render(); return; }
  location.hash = '#/' + route;
  closeDrawer();
}

/* ============================================================
   渲染：首页
   ============================================================ */
function renderHome() {
  const n = doneCount(), pct = Math.round(n / TOTAL * 100);
  const rvN = reviewCount();
  const stk = streak();
  const last = state.last && ITEM_BY_ID[state.last] ? ITEM_BY_ID[state.last] : null;
  const nextTodo = ITEMS.find(i => !isDone(i.id));

  // ⚠️ 每节的标题必须一起渲染出来。早先这里只拼了 s.html、把 s.title 扔掉，
  // 于是 README 的 7 个 `##` 标题（这是什么 / 工作台里有什么 / 课程大纲 …）
  // 在首页**完全没有标题**，它们的 `###` 子节就以 h3 直接挂在「四个阶段」底下——
  // 标题大纲对读屏不成立（按标题跳读的人会以为「课程规模」属于「四个阶段」）。
  // 而 `.doc h2{…}` 那条带分隔线的段标题样式一直没被命中过，就是在等这一行。
  const readme = COURSE.home.map(s =>
    (s.title ? `<h2>${esc(s.title)}</h2>` : '') + s.html
  ).join('\n');

  $('#contentRoot').className = 'content wide';
  $('#contentRoot').innerHTML = `
  <section class="hero">
    <span class="eyebrow">PYTHON · LEARING PATH · 2026</span>
    <h1>把 Python 学成<br>一项<span class="hl-word">真本事</span></h1>
    <p class="hero-lede">24 节正课、3 个阶段项目、5 条方向主线，再加一个毕业作品。每课固定结构：知识点 → 例题（参考答案直接展开，想自测可以点标题收起）→ 分层作业。例题可以自评「写对了 / 没写出来」，没写出来的自动进错题本——进度、时长、记录都留在这台工作台里。</p>
    <div class="hero-stats">
      <div class="stat"><b>24</b><span>节正课</span></div>
      <div class="stat"><b>4</b><span>个阶段</span></div>
      <div class="stat"><b>${pct}%</b><span>当前进度 ${n}/${TOTAL}</span></div>
      <a class="stat" href="#/review"><b>${rvN}</b><span>道题今天该复习</span></a>
      <a class="stat" href="#/records"><b>${stk}</b><span>天连续学习</span></a>
    </div>

    ${renderToday()}

    <div class="hero-grid">
      <div>
        ${last || nextTodo ? `
        <div class="resume">
          <div class="resume-txt">
            <span>${last ? '继续上次' : '建议从这里开始'}</span>
            <b>${esc((last || nextTodo).title)}</b>
          </div>
          <a class="btn btn-primary" href="#/${(last || nextTodo).id}">
            开始学习
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>` : `
        <div class="resume">
          <div class="resume-txt"><span>全部完成</span><b>24 节课 + 3 个项目已全部标记完成 🎉</b></div>
          <a class="btn" href="#/s4">去看毕业项目</a>
        </div>`}
        <div class="gauge" style="margin-top:12px">
          <span>总进度</span>
          <div class="gauge-bar"><i style="width:${pct}%"></i></div>
          <span>${n} / ${TOTAL}</span>
        </div>
      </div>
      <div class="terminal">
        <div class="terminal-bar">
          <i class="dot r"></i><i class="dot y"></i><i class="dot g"></i>
          <span>path.py — 你的学习脚本</span>
        </div>
        <div class="terminal-body" id="heroTerm" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <div class="section-head"><h2>四个阶段</h2><p>按顺序推进，每个阶段末尾都有一个必须动手做的项目</p></div>
  <div class="stage-grid" id="stageGrid"></div>

  <div class="doc" style="margin-top:8px">${readme}</div>
  `;
  renderStageCards();

  // 里程碑清单
  const miles = [
    ['阶段一', '不查资料写出「猜数字游戏」（循环 + 判断 + 随机数 + 输入处理）'],
    ['阶段二', '独立写出「带 JSON 文件存储的命令行待办事项管理器」（函数 + 类 + 文件 + 异常）'],
    ['阶段三', '会写测试、会用装饰器、会请求 API 并入库，代码通过 mypy / ruff 检查'],
    ['阶段四', '完成一个可展示、放 GitHub 的毕业项目']
  ];
  const box = document.createElement('div');
  box.className = 'doc';
  box.innerHTML = `<div class="section-head" style="margin-top:44px"><h2>里程碑自测</h2><p>学完每个阶段，勾掉对应的一项</p></div>
    <ul class="mile">${miles.map(([k, v], i) => `
      <li data-mile="${i}" data-on="${state.miles[i] ? 1 : 0}">
        <label class="hw-tick"><input type="checkbox" data-milebox="${i}" ${state.miles[i] ? 'checked' : ''}><span></span></label>
        <div><b>${k}</b><p>${v}</p></div>
      </li>`).join('')}</ul>`;
  $('#contentRoot').appendChild(box);
  box.addEventListener('change', e => {
    const cb = e.target.closest('[data-milebox]');
    if (!cb) return;
    const i = cb.dataset.milebox;
    state.miles[i] = cb.checked ? 1 : 0; save();
    $('[data-mile="' + i + '"]', box).dataset.on = cb.checked ? '1' : '0';
    toast(cb.checked ? '里程碑达成，继续！' : '已取消勾选');
  });

  startHeroTyping();
}

/* ============================================================
   今日计划——首页从「回顾型」变「行动型」的那一层
   ------------------------------------------------------------
   首页原本只回答"我学到哪了"（进度环、统计、阶段卡），答完就没下文了：
   知道该复习的人得自己想到去点错题本。这一块把四处散着的可动手项收成
   一张清单——到期欠债、下一步内容、该复核的"会了"、今天的节奏。

   全部由现有状态推出，不新增任何 localStorage 表：
     · 到期复习 / 已掌握例题数 —— revStats()（单一计数出口）
     · 下一个知识点            —— done 表里第一个没勾的条目
     · 今日已学 / 连续天数      —— time 表
   顺序即优先级，不随数据变：先清欠债，再往前走。 */

function todayLabel() {
  const d = new Date();
  const p = dayKey(d).split('-');
  return (+p[1]) + ' 月 ' + (+p[2]) + ' 日 · ' + ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
}

/* 「毕业项目做到哪了」——纯函数，从全局作业索引里挑出毕业页那几项。
   ------------------------------------------------------------------
   不去 DOM 里读芯片：芯片是"渲染出来的样子"，而这里要的是"数据本身"。
   首页、今日计划、验收探针共用这一个出口，三处不会各数一遍。

   三组验收标准是并排的（三选一），所以这里报的是**整页口径**：
   9 项里做完几项。不替用户判定"你选了哪个项目"——他没勾就是还没选，
   硬猜一个反而会跟实际勾选对不上（毕业芯片那边也是同一个取舍）。

   口径与 HW_TOTAL 的关系：这 9 项**已经在** 169 里了，
   所以它是子集而不是额外的一层，不会让任何计数翻倍。 */
function gradProgress() {
  const rows = buildHwIndex().filter(h => {
    const it = ITEM_BY_ID[h.itemId];
    return it && it.kind === 'grad';
  });
  const t = rows.length;
  const n = rows.filter(h => markGet(h.id) === 1).length;
  const stuck = rows.filter(h => markGet(h.id) === -1).length;
  // 「动手了但没做完」也算已经开始：勾过任何一项就说明在做了
  const started = rows.some(h => markGet(h.id) === 1 || markGet(h.id) === -1);
  /* 什么时候才该把这张卡摆出来？
     ① 正课与阶段项目全部走完，或 ② 已经在做毕业项目了（含做完全部）。
     这条**必须**留着：否则一个刚学第 3 课的人，首页会一直挂着一张
     "该做毕业项目了"，把前面那几张真正该做的事挤到后面去。

     判定用「课时 + 阶段项目」而不是"全部条目"：附录和"怎么选方向"这类
     拓展页不该成为毕业的前置条件——它们永远可以不勾，那这张卡就永远不出现。 */
  const courseDone = !ITEMS.some(i =>
    !isDone(i.id) && (i.kind === 'lesson' || i.kind === 'project'));
  return {
    n, t, stuck, started,
    show: t > 0 && (courseDone || started),
    courseDone,
    left: t - n,
    pct: t ? Math.round(n / t * 100) : 0,
    full: t > 0 && n === t,
    id: (Object.keys(ITEM_BY_ID).find(k => ITEM_BY_ID[k].kind === 'grad')) || 's4'
  };
}

function todayPlan() {
  const s = revStats();
  const next = ITEMS.find(i => !isDone(i.id)) || null;
  const dueHw = s.rows.due.filter(r => r.kind === 'hw').length;
  const poolLearned = quizPool('learned', 'mix').length;
  const todaySec = state.time[dayKey()] || 0;
  const stk = streak();
  const soon = s.rows.later.length ? s.rows.later[0].due : null;
  const g = gradProgress();

  const items = [
    {
      k: 'due', n: s.due, unit: '道', href: '#/review',
      label: '今天该复习',
      note: s.due
        ? (dueHw ? '其中作业卡住 ' + dueHw + ' 项' : '间隔复习到期，趁热重做一遍')
        : (soon ? '今天没有到期的，下一道排在 ' + fmtDue(soon) : '错题本空着，没有欠债'),
      on: s.due > 0
    },
    {
      k: 'next', n: next ? (next.kind === 'lesson' ? next.no : '★') : '✓',
      unit: next && next.kind === 'lesson' ? '课' : '',
      href: next ? '#/' + next.id : '#/s4',
      label: next ? next.title : '全部课程已完成',
      note: next
        ? ((ITEM_BY_ID[next.stageId] ? '' : (STAGE_BY_ID[next.stageId] ? STAGE_BY_ID[next.stageId].label + ' · ' : '')) +
           (next.kind === 'lesson' ? '还没开始，接上就好' : '阶段项目，动手做'))
        : '去挑一个毕业项目',
      on: !!next
    },
    /* 毕业进度只在"确实该关心它"的时候出现——课程全部走完、或已经动手做了。
       否则它会一直挂在那儿催一个还轮不到的人，把前面四项的优先级搅浑。 */
    ...(g.show ? [{
      k: 'grad', n: g.n + '/' + g.t, unit: '项', href: '#/' + g.id,
      label: g.full ? '毕业项目已达成' : (g.started ? '毕业项目进行中' : '该做毕业项目了'),
      note: g.full
        ? '三组验收全部通过，可以收工了'
        : (g.started
          ? '还差 ' + g.left + ' 项验收' + (g.stuck ? ' · 有 ' + g.stuck + ' 项卡住' : '')
          : '课程已走完，挑一个方向开工吧'),
      on: true,
      done: g.full
    }] : []),
    {
      k: 'quiz', n: s.doneEx, unit: '道', href: '#/quiz',
      label: '标了「已掌握」',
      note: poolLearned
        ? '可抽 ' + poolLearned + ' 个已学过的练习项复核'
        : '先把课时标记完成，就有题可抽了',
      on: s.doneEx > 0
    },
    {
      k: 'time', n: stk, unit: '天', href: '#/records',
      label: '连续学习',
      note: todaySec ? '今天已学 ' + fmtDur(todaySec) : '今天还没开始，学 5 分钟也算',
      on: stk > 0 || todaySec > 0
    }
  ];

  let lead;
  if (s.due) lead = '今天有 ' + s.due + ' 道到期的题，先把欠债清了，再往前走。';
  else if (soon) lead = '今天没有到期的题，下一道排在 ' + fmtDue(soon) + '。';
  else if (next) lead = '错题本空着，正好推进《' + next.title + '》。';
  else if (g.full) lead = '24 节课、3 个项目和毕业作品都完成了——这套路径你走完了。';
  else lead = '24 节课和 3 个项目都完成了，接下来该做毕业项目了。';

  return { date: todayLabel(), lead, items, due: s.due, later: s.later,
           doneEx: s.doneEx, streak: stk, todaySec, grad: g };
}

/* ============================================================
   渲染：阶段页
   ============================================================ */
/* 页面类型的统一叫法。阶段卡片、课时页眉、搜索结果三处都要用，
   所以只留一个出口——以前三处各写一遍 `kind === 'xxx' ? ... : ...`，
   加一种 kind 就得记着改三处。 */
function kindTag(it) {
  if (it.kind === 'lesson') return '第 ' + it.no + ' 课';
  if (it.kind === 'direction') return '方向 ' + it.no;
  return { project: '阶段项目', grad: '毕业项目', picker: '选方向' }[it.kind] || '拓展';
}

/* 「作业 / 任务 / 验收」和量词也是同一件事的三种说法：三态机制完全一样，
   只是页面语义不同。集中在这里，免得文案改一处漏一处。 */
function hwNoun(it) {
  return it.kind === 'project' ? '任务' : it.kind === 'grad' ? '验收' : '作业';
}
function hwUnitOf(it) {
  return (it.kind === 'lesson' || it.kind === 'direction') ? '题' : '项';
}

function describeCounts(it) {
  const c = it.counts || {};
  const bits = [];
  if (c.kp) bits.push('知识点 ' + c.kp + ' 条');

  if (c.ex) bits.push('例题 ' + c.ex + ' 个');
  if (c.codes && !c.ex) bits.push('代码 ' + c.codes + ' 段');
  if (c.hw) bits.push(hwNoun(it) + ' ' + c.hw + ' ' + hwUnitOf(it));
  return bits.length ? bits.join(' · ') : '含完整讲解与示例';
}
/* ============================================================
   渲染：课程页

  afterHwPaint = it.kind === 'picker' ? paintPickProg : () => {};

/* 从错题本跳回来时，展开并高亮那道题 */
function focusPendingEx() {
  if (!pendingEx) return;
  const el = document.getElementById(pendingEx);
  pendingEx = null;
  if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  setTimeout(() => {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('is-flash');
    setTimeout(() => el.classList.remove('is-flash'), 1600);
  }, 80);
}

/* --- 代码块：语言标签 + 复制 --- */
const LANG_NAME = { python: 'Python', py: 'Python', bash: 'Shell', sh: 'Shell', shell: 'Shell', text: '文本', json: 'JSON', sql: 'SQL', html: 'HTML' };
/* root 可传：就地展开出来的克隆节点不在文档序里，得单独扫一遍 */
function decorateCode(root) {
  $$('.hl', root).forEach(box => {
    if (box.dataset.deco) return;
    box.dataset.deco = '1';
    const raw = box.dataset.lang || 'python';
    const bar = document.createElement('div');
    bar.className = 'hl-bar';
    bar.innerHTML = `<span class="hl-lang">${esc(LANG_NAME[raw] || raw.toUpperCase())}</span>
      <button class="hl-copy" type="button" aria-label="复制这段代码">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>复制</span>
      </button>`;
    box.prepend(bar);
    $('.hl-copy', bar).addEventListener('click', async e => {
      const btn = e.currentTarget;
      const code = $('code', box).textContent;
      const ok = await copyText(code);
      btn.dataset.ok = ok ? '1' : '0';
      $('span', btn).textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => { btn.dataset.ok = '0'; $('span', btn).textContent = '复制'; }, 1600);
    });
  });
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* --- 作业 / 任务：三态（未做 / 卡住 / 已做） ---

   一页可能有**多张**清单：毕业项目页就是三个项目各自的验收标准并排。所以这里
   遍历页面里每一张 ol.hw-list，而不是只取第一张。

   两套序号刻意分开，混用一定会出 bug：
     · gid = 全局序号 → 进 id（<课时 id>:<第几项>）。必须全页唯一，否则三组清单
             的第 1 项会挤在同一个 id 上，勾一组等于勾三组。
     · k   = 清单内序号 → 只用于文案。视觉上的号由 CSS counter 数，每张清单各自
             从 01 起，恰好就是 k。
   单清单页（24 节课 + 5 个方向页）里两者数值相同，行为与以前完全一致。 */
function decorateHomework(it) {
  decorateHomeworkLists($('#lessonBody'), it);
  refreshHw(it);
}

/* 上面那套装饰的**单根版本**，供「选方向」页就地展开的三块勾复用。
   it 只用来取 id 前缀与量词，所以展开区可以拿方向页的 it 传进来。 */
function decorateHomeworkLists(root, it) {
  const groups = hwListsBySection(root);
  if (!groups.length) return 0;
  const noun = (it.kind === 'lesson' || it.kind === 'direction') ? '题' : '项';
  const multi = groups.length > 1;
  let gid = 0;

  groups.forEach(({ sec, list }) => {
    const base = multi && sec ? shortSec(sec) + ' · ' : '';
    $$(':scope > li', list).forEach((li, k) => {
      const id = it.id + ':' + (gid++);
      const where = base + '第 ' + (k + 1) + ' ' + noun;

      li.id = id;                 // 错题本里的「去复习」靠它跳过来并高亮
      li.dataset.hw = id;

      const lab = document.createElement('label');
      lab.className = 'hw-tick';
      lab.innerHTML = `<input type="checkbox" aria-label="标记${where}已完成"><span></span>`;
      li.prepend(lab);

      const act = document.createElement('div');
      act.className = 'hw-act';
      act.innerHTML = `<button class="hw-stuck" type="button" aria-pressed="false"
        title="标记为「卡住」：进入错题本，按 1 → 3 → 7 → 21 天的节奏提醒你回来重做">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 2.6 17A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"/></svg>卡住</button>`;
      li.appendChild(act);
      paintHw(li, id);            // 两个控件都进了 DOM 才上色，否则 aria-pressed 会停在初始值

      $('input', lab).addEventListener('change', e => {
        if (e.target.checked) {
          // 复习会话里点＝判定；平时在课文里翻着看，点下去是记录，再点可撤销
          const r = rateEx(id, 1, isSessionItem(id));
          toast(where + ' · ' + (r.msg || '已完成'));
        } else {
          markSet(id, 0); delete state.rev[id];
          toast(where + ' · 已取消标记');
        }
        paintHw(li, id); save(); refreshHw(it); afterHwPaint(id);
      });

      $('.hw-stuck', act).addEventListener('click', () => {
        const r = rateEx(id, -1, isSessionItem(id));   // 会话中＝判定，平时＝开关
        paintHw(li, id); refreshHw(it);
        afterRate(id, r);                              // 落盘 + 提示，并在会话里推进下一道
        afterHwPaint(id);
      });
    });
  });
  return gid;
}

/* 勾选之后除了刷新本页仪表，还有别的东西要跟着变。
   用钩子而不是在这里直接调 paintPickProg()：装饰逻辑不该认识"选方向页"这个特例。 */
let afterHwPaint = () => {};

/* 小节名太长会在提示条里折行，截短一个够辨认的长度就好 */
function shortSec(s) { return s.length > 12 ? s.slice(0, 12) + '…' : s; }

/* 按文档序把每张 ol.hw-list 归到它所属的那一节（最近的 h3）。
   装饰、计数、毕业进度芯片都走这一个出口——否则三处各遍历一遍 DOM，
   迟早有一处忘了改，于是"数据"和"由数据推出来的样子"就对不上。 */
function hwListsBySection(root) {
  const pairs = [];
  let sec = '', h3 = null;
  $$('h3, ol.hw-list', root).forEach(n => {
    if (n.tagName === 'H3') { h3 = n; sec = n.textContent.trim(); return; }
    pairs.push({ sec, h3, list: n });
  });
  return pairs;
}

/* li 的外观完全由标记推出来，DOM 不自己再记一份状态——
   否则改一处忘一处，样式迟早和数据对不上。 */
function paintHw(li, id) {
  const mark = markGet(id);
  li.dataset.state = mark === 1 ? 'done' : mark === -1 ? 'stuck' : 'todo';
  const box = $('.hw-tick input', li);
  if (box) box.checked = mark === 1;
  const st = $('.hw-stuck', li);
  if (st) st.setAttribute('aria-pressed', String(mark === -1));
  return mark;
}

function refreshHw(it) {
  const groups = hwListsBySection($('#lessonBody'));
  if (!groups.length) return;
  const items = groups.reduce((a, g) => a.concat($$(':scope > li', g.list)), []);
  const n = items.filter(li => li.dataset.state === 'done').length;
  const stuck = items.filter(li => li.dataset.state === 'stuck').length;
  const bar = $('#hwBar'), txt = $('#hwTxt');
  if (bar) bar.style.width = (items.length ? n / items.length * 100 : 0) + '%';
  if (txt) txt.textContent = n + '/' + items.length;
  const sc = $('#hwStuck');
  if (sc) { sc.textContent = String(stuck); sc.dataset.zero = stuck ? '0' : '1'; }
  paintGrad();
}

/* --- 毕业项目：三选一的闭环 ---

   三个项目各带一组验收标准（各 3 条），三组都进同一张 hw 表。这里只做一件事：
   在每组所属的项目标题旁挂一个「已达成几条」的芯片——翻到这一页就知道还差什么。

   一个刻意的取舍：**不强制"选定"某一个项目**。用户勾了哪组，哪组就是他在做的；
   多存一个"我选了哪个"的状态，就多一处可能与实际勾选对不上的地方。 */
function decorateGrad(it) {
  if (it.kind !== 'grad') return;
  hwListsBySection($('#lessonBody')).forEach(({ h3, list }, i) => {
    if (!h3) return;
    const g = 'g' + i;
    list.dataset.gradGroup = g;
    const pill = document.createElement('span');
    pill.className = 'grad-pill';
    pill.dataset.group = g;
    h3.appendChild(pill);
    paintGradPill(pill, list);
  });
}
function paintGradPill(pill, list) {
  const items = $$(':scope > li', list);
  const n = items.filter(li => li.dataset.state === 'done').length;
  pill.dataset.n = String(n);
  pill.dataset.t = String(items.length);
  pill.dataset.full = (items.length && n === items.length) ? '1' : '0';
  pill.textContent = pill.dataset.full === '1' ? '🎓 已达成' : n + ' / ' + items.length;
}
/* 芯片由标记推出来，所以每次勾选都得重算——不能只在初次渲染时算一遍。 */
function paintGrad() {
  const body = $('#lessonBody');
  $$('.grad-pill', body).forEach(p => {
    const list = $('ol.hw-list[data-grad-group="' + p.dataset.group + '"]', body);
    if (list) paintGradPill(p, list);
  });
}

/* --- 「按目标选方向」：静态对照表 → 可点的卡片 ---

   卡片内容**全部从表格 DOM 派生**（目标 / 方向 / 理由），一条都不在这里硬编码，
   否则内容源就不再是唯一真相，改一处漏一处。
   找不到表格就让它原样留着——这是渐进增强，不是替换掉内容。 */
function decoratePicker(it) {
  if (it.kind !== 'picker') return;
  const body = $('#lessonBody');
  /* 只认顶层表格（`#lessonBody > table`）。用 `$('table', body)` 会连带扫到
     嵌套在小节里的表格——那份内容一被替换掉就永久消失，而且再也长不回来。 */
  const table = $(':scope > table', body);
  if (!table) return;
  const tbody = $$('tbody tr', table);
  const trs = tbody.length ? tbody : $$('tr', table).slice(1);
  const dirs = ITEMS.filter(x => x.kind === 'direction');

  const grid = document.createElement('div');
  grid.className = 'pick-grid';
  let n = 0;
  trs.forEach(tr => {
    const td = $$('td', tr);
    if (td.length < 3) return;
    const goal = td[0].textContent.trim();
    // 「A 数据分析」→ 字母认方向、其余是名字
    const m = td[1].textContent.trim().match(/^([A-Ea-e])\s*[·・]?\s*(.*)$/);
    const letter = m ? m[1].toLowerCase() : '';
    const name = m ? m[2].trim() : td[1].textContent.trim();
    const why = td[2].textContent.trim();
    // 按 kind+no 反查方向页，不写死 id 前缀——slug 变了也不会断
    const dir = dirs.filter(x => String(x.no).toLowerCase() === letter)[0];

    /* 每张卡用 <a href="#/<方向页>">。**这是刻意的**：它同时是三条路径的兜底——
       键盘 Tab 直接可达（不用引入第三套方向键）、没有 JS 也能跳转、
       点标题旁边的箭头 `#dir_<字母>` 则由后面的 hashchange 兜住。
       想要的就地展开挂在「看知识点」这颗按钮上，和跳转各管一边。 */
    const item = document.createElement('div');
    item.className = 'pick-item';
    item.dataset.dir = letter;
    item.innerHTML = `<a class="pick-card" href="#/${dir ? dir.id : 's4'}" data-open="0"
        data-dir="${esc(letter)}" aria-expanded="false">
      <span class="pick-goal">${esc(goal)}</span>
      <span class="pick-dir"><b>${esc(letter.toUpperCase())}</b><span class="pick-name">${esc(name)}</span></span>
      <span class="pick-why">${esc(why)}</span>
      <span class="pick-go"><span class="pick-go-t">去看这个方向 →</span>${
        dir && hasExpand(dir) ? '<span class="pick-more">看知识点</span>' : ''}</span>
    </a>`;

    // 展开后「看知识点」会盖掉提示文字，得把原来的话留着，收起时还原
    const gt = $('.pick-go-t', item);
    gt.dataset.collapsed = gt.textContent;

    if (dir && hasExpand(dir)) {
      const mount = document.createElement('div');
      mount.className = 'pick-x';
      mount.hidden = true;                 // hidden 必须与内容同步落地，别留个空壳给人读
      // 展开后把焦点交到这里，所以它必须可聚焦；用它自己的 Esc 收起
      mount.tabIndex = -1;
      item.appendChild(mount);
      setupPickExpand(item, dir, mount);
    }
    grid.appendChild(item);
    n++;
  });
  if (!n) return;
  /* 表格是**移走**不是删掉：一旦被替换出文档，就再也回不来（它已经不在文档里，
     谁也找不到它）。收着是为了万一出问题还能人工还原。 */
  table.remove();
  body.insertBefore(grid, body.firstChild);
}

/* 有可展开的内容吗？——路线 / 核心知识点 / 示例 / 练习题 里任意一条就算。 */
function hasExpand(dir) {
  const h = document.createElement('div');
  h.innerHTML = dir.html;
  return $$('h4.mini-title', h).some(x => /路线|核心知识点|示例|练习题/.test(x.textContent));
}

/* 展开区是**克隆**课文节点拼出来的。
   直接搬原节点会把文章顺序打乱（展开后正文里少了三块），克隆留原件不动。

   「示例」也在收录范围内：抽掉它，展开区就从"核心知识点"直接跳到"练习题"，
   中间那道可运行的示范没了——而这个示范恰恰是判断"这方向我感不感兴趣"最省事的依据。 */
function pickExpandNodes(dir) {
  const src = document.createElement('div');
  src.innerHTML = dir.html;
  const keeps = /路线|核心知识点|示例|练习题/;
  const nodes = [];
  let on = false;
  $$(':scope > *', src).forEach(el => {
    if (el.tagName === 'H4') on = keeps.test(el.textContent);
    if (on) nodes.push(el.cloneNode(true));
  });
  return nodes;
}

/* 展开区里那三颗勾用的是**同一张 hw 表**，所以 id 必须与课时页逐字一致：
   `hwListsBySection` 数到的是「本页第几个 ol.hw-list」，这里只有一个 ol，
   所以全局序号必然从 0 起——照同一个公式拼即可，不需要另建索引。 */
function pickHwMap(dir, root) {
  const map = new Map();
  const lists = $$('ol.hw-list', root);
  if (!lists.length) return map;
  const items = $$(':scope > li', lists[0]);
  items.forEach((li, g) => map.set(li, dir.id + ':' + g));
  return map;
}

function setupPickExpand(item, dir, mount) {
  const card = $('.pick-card', item);
  const gt = $('.pick-go-t', item);
  let built = false;

  // 第一次展开才建内容：默认路径（直接点卡片跳走）不付这块开销
  const build = () => {
    if (built) return;
    built = true;
    pickExpandNodes(dir).forEach(nd => mount.appendChild(nd));

    const h = document.createElement('div');
    h.className = 'pick-x-h';
    const dn = dir.no ? String(dir.no).toUpperCase() : '';
    h.innerHTML = `<h3><b>${esc(dn)}</b>${esc(dir.title)}</h3>
      <span class="pick-x-prog" id="pxProg"></span>
      <a class="pick-x-link" id="pxOpen" href="#/${dir.id}">打开完整方向页 →</a>`;
    mount.insertBefore(h, mount.firstChild);

    decorateCode(mount);
    const hm = pickHwMap(dir, mount);
    buildHwIndexFrom(mount, hm, dir);
    decorateHomeworkLists(mount, dir);
    // 代码高亮、题面、勾选芯片都挂完之后再上色——顺序错了会漏掉后进的子节点
    hm.forEach((id, li) => paintHw(li, id));
    const n = hm.size;
    if (n) {
      const p = $('#pxProg', mount);
      if (p) { p.dataset.t = String(n); paintPickProg(); }
    }
  };

  const toggle = () => {
    const open = item.dataset.open !== '1';
    build();
    item.dataset.open = open ? '1' : '0';
    card.dataset.open = item.dataset.open;
    card.setAttribute('aria-expanded', String(open));
    mount.hidden = !open;
    if (open && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      mount.classList.remove('mv-enter');
      void mount.offsetWidth;          // 强制重排，否则同一个类加第二次不重放动画
      mount.classList.add('mv-enter');
    }
    const t = $('.pick-go-t', item);
    if (t) t.textContent = open ? '收起 ↑' : (t.dataset.collapsed || '去看这个方向 →');
    if (open) mount.focus({ preventScroll: true });
  };

  // 直接点卡片 = 展开/收起；点右上角箭头 = 仍然跳去完整页（那是它的字面承诺）
  card.addEventListener('click', e => {
    if (e.target.closest('.pick-x-link')) return;
    e.preventDefault();
    toggle();
  });
  // 回车和方向键一样是开合，跳完整页留给右上角那颗链接（它才是真的 <a>）
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowDown' && item.dataset.open !== '1') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowUp' && item.dataset.open === '1') { e.preventDefault(); toggle(); }
  });
  mount.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); toggle(); card.focus(); }
  });
  /* 从完整方向页返回（浏览器后退 / 页内箭头回跳）要还原展开态。
     这一条必须排在最后：前面所有监听都绑完了才回头补账。 */
  if (pendingDir === dir.id) {
    pendingDir = null;
    toggle();
  }
}

let pendingDir = null;
/* `#dir_a` 这种"带目标"的跳转：切页 + 落地后展开那一格。
   1 是给路由留出渲染时间——渲染没跑完，方向卡片在 DOM 里还不存在。 */
function goDir(letter) {
  const dir = ITEMS.filter(x => x.kind === 'direction' &&
    String(x.no).toLowerCase() === String(letter).toLowerCase())[0];

    if (card) { card.click(); return; }

  pendingDir = dir.id;
  go('s4-怎么选方向');
  setTimeout(() => { if (pendingDir) { pendingDir = null; } }, 1200);
}

/* 「已做 x / n」跟着勾选走，和毕业页的芯片一样，每次勾选都要重算 */
function paintPickProg() {
  const body = $('#lessonBody');
  if (!body) return;
  $$('.pick-x', body).forEach(m => {
    const p = $('#pxProg', m);

    p.dataset.n = String(n);
    p.dataset.full = li.length && n === li.length ? '1' : '0';
  });
}

/* ============================================================
   打字机（首页记忆点）
   ============================================================ */
const HERO_LINES = [
  [{ c: 'c', v: '# 你的 Python 学习工作台' }],
  [{ c: 'k', v: 'print' }, { c: 'p', v: '(' }, { c: 's', v: '"Hello, World!"' }, { c: 'p', v: ')' }],
  [{ c: 'n', v: 'goal' }, { c: 'p', v: ' = ' }, { c: 's', v: '"24 节课后写出能跑的程序"' }],
  [{ c: 'k', v: 'for' }, { c: 'n', v: ' week' }, { c: 'k', v: ' in' }, { c: 'b', v: 'range' }, { c: 'p', v: '(1, 25):' }],
  [{ c: 'p', v: '    ' }, { c: 'b', v: 'print' }, { c: 'p', v: '(' }, { c: 's', v: 'f"第 {week} 周 · 慢慢来，比较快"' }, { c: 'p', v: ')' }],
  [{ c: 'n', v: 'progress' }, { c: 'p', v: ' → ' }, { c: 's', v: '"持续 > 强度"' }]
];
let heroTimer = null;
function startHeroTyping() {
  const host = $('#heroTerm');
  if (!host) return;
  clearTimeout(heroTimer);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const paint = (li, ci, tokens) => tokens.map((t, i) =>
    `<span class="tk-${t.c}">${esc(t.v)}</span>`).join('');

  if (reduce) {
    host.innerHTML = HERO_LINES.map(l => `<div class="ln">${l.map(t => `<span class="tk-${t.c}">${esc(t.v)}</span>`).join('')}</div>`).join('');
    return;
  }

  let li = 0, ci = 0;
  host.innerHTML = HERO_LINES.map(() => '<div class="ln"></div>').join('');
  const lines = $$('.ln', host);

  const step = () => {
    if (li >= HERO_LINES.length) {
      lines[lines.length - 1].innerHTML += '<span class="caret"></span>';
      return;
    }
    const tokens = HERO_LINES[li];
    const flat = tokens.map(t => t.v).join('');
    ci++;
    const shown = flat.slice(0, ci);
    let acc = '', rest = shown;
    for (const t of tokens) {
      const take = Math.min(t.v.length, rest.length);
      acc += `<span class="tk-${t.c}">${esc(rest.slice(0, take))}</span>`;
      rest = rest.slice(take);
      if (!rest.length) break;
    }
    lines[li].innerHTML = acc + (ci < flat.length ? '<span class="caret"></span>' : '');
    if (ci >= flat.length) { li++; ci = 0; heroTimer = setTimeout(step, 300); }
    else heroTimer = setTimeout(step, 34);
  };
  heroTimer = setTimeout(step, 420);
}

/* ============================================================
   搜索
   ============================================================ */
let searchIdx = null, resList = [], resSel = 0;
function buildIndex() {
  if (searchIdx) return searchIdx;
  searchIdx = ITEMS.map(it => {
    const st = STAGE_BY_ID[it.stageId];
    const parts = [];
    parts.push(it.title);
    // 从 HTML 中抽取小标题与正文，作为检索语料
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    tmp.querySelectorAll('h3,h4,p,li').forEach(el => parts.push(el.textContent));
    const text = parts.join(' · ').replace(/\s+/g, ' ');
    return { id: it.id, title: it.title, stage: st.label + ' · ' + st.name, kind: it.kind, no: it.no, text };
  });
  return searchIdx;
}
function runSearch(q) {
  q = q.trim();
  const ul = $('#searchRes');
  if (!q) {
    resList = ITEMS.slice(0, 8).map(it => ({ it, snippet: '' }));
    resSel = 0;
    $('#searchCount').textContent = '共 ' + TOTAL + ' 项';
    paintResults([], true);
    return;
  }
  const idx = buildIndex();
  const needle = q.toLowerCase();
  const scored = [];
  idx.forEach(rec => {
    const title = rec.title.toLowerCase();
    const body = rec.text.toLowerCase();
    let score = 0;
    let first = -1;
    if (title.includes(needle)) score += 100 - title.indexOf(needle);
    let hits = 0, pos = body.indexOf(needle);
    if (pos >= 0) first = pos;
    while (pos !== -1 && hits < 40) { hits++; pos = body.indexOf(needle, pos + needle.length); }
    if (hits) score += Math.min(hits, 20) * 4 + 20;
    if (!score && needle.length >= 2) {
      // 逐字兜底：支持「装饰 缓存」这类记不全的查询。
      // 但要求命中字符彼此靠近（跨度 ≤30），否则「闭包」会误命中只含「包」的课。
      let cur = 0, ok = true, span0 = -1, span1 = -1;
      for (const ch of needle) {
        const q = body.indexOf(ch, cur);
        if (q === -1) { ok = false; break; }
        if (span0 === -1) span0 = q;
        span1 = q; cur = q + 1;
      }
      if (ok && span1 - span0 <= 30) { score = 8; first = span0; }
    }
    if (score > 0) scored.push({ rec, score, first, hits });
  });
  scored.sort((a, b) => b.score - a.score || a.rec.title.length - b.rec.title.length);
  resList = scored.slice(0, 14).map(s => ({ it: ITEM_BY_ID[s.rec.id], snippet: makeSnippet(s.rec.text, needle, s.first), hits: s.hits }));
  resSel = 0;
  $('#searchCount').textContent = scored.length ? scored.length + ' 项匹配' : '无结果';
  paintResults();
}
function makeSnippet(text, needle, pos) {
  if (pos < 0) return text.slice(0, 110);
  const start = Math.max(0, pos - 34);
  return (start > 0 ? '…' : '') + text.slice(start, start + 120) + '…';
}
function hlWords(s, q) {
  const safe = esc(s);
  if (!q) return safe;
  try {
    // 先按同一套规则转义查询词，保证转义后的实体也能被命中
    const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp('(' + needle + ')', 'gi'), '<mark>$1</mark>');
  } catch (e) { return safe; }
}
function paintResults(emptyMode) {
  const ul = $('#searchRes');
  const q = $('#searchInput').value;
  if (!resList.length) {
    ul.innerHTML = `<li style="padding:34px 20px;text-align:center;color:var(--ink-3);font-size:14.5px">
      没有找到匹配内容，换个关键词试试<br><span style="font-size:13px">例如：装饰器 / 闭包 / 生成器 / json / 正则</span></li>`;
    return;
  }
  ul.innerHTML = resList.map((r, i) => `
    <li><a class="res" href="#/${r.it.id}" data-i="${i}" data-sel="${i === resSel ? 1 : 0}">
      <div class="res-top">
        <span class="res-kind">${esc(kindTag(r.it))}</span>
        <b>${hlWords(r.it.title, q)}</b>
      </div>
      <p>${hlWords(r.snippet || (STAGE_BY_ID[r.it.stageId].label + ' · ' + STAGE_BY_ID[r.it.stageId].name), q)}</p>
    </a></li>`).join('');
}
function moveSel(d) {
  if (!resList.length) return;
  resSel = (resSel + d + resList.length) % resList.length;
  $$('.res').forEach((el, i) => el.dataset.sel = i === resSel ? '1' : '0');
  const cur = $('.res[data-sel="1"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}
let searchTimer = null;
function openSearch() {
  $('#overlay').dataset.open = '1';
  const inp = $('#searchInput');
  inp.value = ''; runSearch('');
  setTimeout(() => inp.focus(), 40);
  syncScrollLock();
}
function closeSearch() {
  const inside = $('#overlay').contains(document.activeElement);
  $('#overlay').dataset.open = '0';
  syncScrollLock();

  if (inside) $('#searchBtn').focus({ preventScroll: true });
}

$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSearch(); });

addEventListener('keydown', e => {
  const sOpen = $('#overlay').dataset.open === '1';
  const hOpen = $('#helpOverlay').dataset.open === '1';

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    sOpen ? closeSearch() : openSearch();
    return;
  }
  if (e.key === 'Escape') {
    if (hOpen) closeHelp();
    if (sOpen) closeSearch();
    closeDrawer();
    return;
  }

  if (sOpen) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const r = resList[resSel];
      if (r) { closeSearch(); go(r.it.id); }
    }
    return;
  }

  // 单键快捷键：输入中或以修饰键组合时一律不抢
  const ae = document.activeElement || {};
  const tag = ae.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ae.isContentEditable) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const route = getRoute();
  const jump = d => {
    const i = ITEMS.findIndex(x => x.id === route);
    if (i === -1) return;
    const t = ITEMS[i + d];
    if (t) { e.preventDefault(); go(t.id); }
  };

  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key === '?') { e.preventDefault(); hOpen ? closeHelp() : openHelp(); return; }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleTheme(); return; }
  if (e.key === 'm' || e.key === 'M') {
    if (ITEM_BY_ID[route]) { e.preventDefault(); toggleDone(ITEM_BY_ID[route]); }
    return;
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startReview(); return; }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); startQuiz(); return; }
  if (e.key === '[') jump(-1);
  else if (e.key === ']') jump(1);
});

/* ============================================================
   错题本：例题自评
   ============================================================ */
let pendingEx = null;   // 从错题本跳回时要点亮的那道题
let exIndex = null;     // 全站例题索引（懒构建）

/* 从课程数据里抽出每一道例题，不依赖用户是否访问过那一页 */
function buildExIndex() {
  if (exIndex) return exIndex;
  exIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    let lastEx = '', lastHead = '', n = 0;
    tmp.querySelectorAll('h3,h4.ex-title,details.answer').forEach(el => {
      if (el.tagName === 'H3') {
        lastHead = el.textContent.replace(/^[^\u4e00-\u9fffA-Za-z0-9]+/, '').trim();
      } else if (el.tagName === 'H4') {
        lastEx = el.textContent.trim();
      } else {
        const id = 'ex-' + it.id + '-' + (n++);
        // 「运行效果」只是题面，不是一道题；序号仍要递增，否则这里的 id
        // 会和 decorateAnswers 写进 DOM 的对不上。
        if (el.classList.contains('out')) return;
        // 答案前的最近一个「例题 N：」标题就是它的题面，退而求其次用所在小节名
        exIndex.push({ id, itemId: it.id, kind: 'ex', title: lastEx || lastHead || it.title });
      }
    });
  });
  return exIndex;
}

/* 作业索引：和例题同一个口径——从课程数据里直接抽，不依赖用户有没有打开过那一页。
   id 的形状必须和 decorateHomework() 写进 DOM 的完全一致（<课时 id>:<第几项>），
   否则错题本里的「去复习」会跳过去却找不到目标。

   **一页可能有多张清单**（毕业项目页就是三组验收标准并排），所以这里遍历全部，
   序号跨清单连续。只取第一张的话，第二组之后的项会整个从错题本、自测题库和
   进度统计里消失——数还是那个数，但数的是错的东西。 */
let hwIndex = null;
function buildHwIndex() {
  if (hwIndex) return hwIndex;
  hwIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    buildHwIndexFrom(tmp, null, it);
  });
  return hwIndex;
}

/* 往已有索引里补一棵子树的作业项。map 给出「li → 完整 id」的替换映射——
   就地展开的那三块勾不在 it.html 的文章序里（它们是克隆出来的），
   靠全局计数推不出它们的 id，只能由调用方把算好的 id 交进来。 */
function buildHwIndexFrom(root, map, it) {
  let gid = 0;
  $$('ol.hw-list', root).forEach(list => {
    $$(':scope > li', list).forEach(li => {
      const i = gid++;
      const id = map && map.get(li) ? map.get(li) : (it.id + ':' + i);
      if (hwIndex.some(x => x.id === id)) return;    // 同一页重复展开不重复登记
      const txt = String(li.textContent || '').replace(/\s+/g, ' ').trim();
      hwIndex.push({
        id: id, itemId: it.id, kind: 'hw', no: i + 1,
        title: hwNoun(it) + ' ' + (i + 1) + ' · '
          + (txt.length > 44 ? txt.slice(0, 44) + '…' : txt),
        full: txt                      // 错题本用截断的 title，自测要完整题面
      });
    });
  });
}

/* 两个索引都建好之后，任何一个练习项 id 都能查到它的归属 */
function pracRow(id) {
  return buildExIndex().find(e => e.id === id) || buildHwIndex().find(h => h.id === id) || null;
}

/* 抽题索引：把例题拆成「题面」与「参考答案」两块，供自测遮住答案用。
   ------------------------------------------------------------------
   编号规则必须和 buildExIndex() 一字不差——同样按 details.answer 的文档序
   计数、「运行效果」块也照常占号——否则自测里判的错落不到错题本上。

   分段的单位是**答案块**，不是例题标题：有一节课（模块与包）是一个标题配
   utils.py / main.py 两个答案块，按标题分段会少抽出一道。

   题面 = 例题标题 + 到这一个答案为止的全部散文（含「运行效果」——
          "打印出如下效果"指的就是它）
   答案 = 这一个答案块（脱掉 <details> 外壳）+ 紧随其后到下一个答案之间的
          说明段（「解析」就落在这里） */
let quizIndex = null;
function buildQuizIndex() {
  if (quizIndex) return quizIndex;
  quizIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    const segs = [];
    let cur = null, n = 0;

    Array.prototype.forEach.call(tmp.children, el => {
      if (el.tagName === 'H3') { cur = null; return; }
      if (el.tagName === 'H4' && el.classList.contains('ex-title')) {
        cur = { title: el.textContent.trim(), nodes: [] };
        segs.push(cur);
        cur.nodes.push({ el });
        return;
      }
      if (el.tagName === 'DETAILS' && el.classList.contains('answer')) {
        const id = 'ex-' + it.id + '-' + (n++);   // .out 也占号，与 buildExIndex 同序
        if (!cur) return;                          // 例题区之外的块（当前数据没有，防御而已）
        cur.nodes.push({ el, id, isOut: el.classList.contains('out') });
        return;
      }
      if (cur) cur.nodes.push({ el });
    });

    segs.forEach(sec => {
      const as = sec.nodes.filter(x => x.id && !x.isOut);
      if (!as.length) return;
      as.forEach((a, k) => {
        const at = sec.nodes.indexOf(a);
        const stop = as[k + 1] ? sec.nodes.indexOf(as[k + 1]) : sec.nodes.length;
        // 题面只收散文和「运行效果」——同一例题里的**其它答案**必须挡在外面，
        // 否则第二题的题面里就印着第一题的答案
        const qs = sec.nodes.slice(0, at).filter(x => !x.id || x.isOut);
        /* 有些例题的标题后面直接就是代码，题面等于只有一行标题
           （"九九乘法表"这种标题本身就是完整题目，成立；
           "找出隐藏的 bug"那种代码才是题目，就不够了）。
           结构上区分不了这两种，所以不猜——如实告诉用户，并给一个回课文的出口。 */
        const hasProse = qs.some(x => x.el.tagName !== 'H4'
          && String(x.el.textContent || '').trim().length > 0);
        quizIndex.push({
          id: a.id, itemId: it.id, kind: 'ex', bare: !hasProse,
          // 一个标题配多个答案时标上 (1/2)，否则两道的标题完全一样
          title: sec.title + (as.length > 1 ? `（${k + 1}/${as.length}）` : ''),
          q: qs.map(x => x.el.outerHTML).join(''),
          a: a.el.innerHTML.replace(/<summary[\s\S]*?<\/summary>/, '')
            + sec.nodes.slice(at + 1, stop).map(x => x.el.outerHTML).join('')
        });
      });
    });
  });
  return quizIndex;
}

const RATE_HTML = `
  <span class="rate-q">自己写出来了吗？</span>
  <button class="rate-btn" type="button" data-m="1" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>写对了</button>
  <button class="rate-btn" type="button" data-m="-1" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>没写出来</button>`;

function decorateAnswers(it) {
  const host = $('#lessonBody');
  if (!host) return;
  $$('details.answer', host).forEach((d, i) => {
    const id = 'ex-' + it.id + '-' + i;

    // 保证 id 口径与编译期写出的顺序、与 buildExIndex 完全一致。
    if (d.classList.contains('out')) return;

        const r = rateEx(id, +b.dataset.m, isSessionItem(id));
        paintAnswerMark(d, r.next);
        refreshExGauge();
        refreshReviewBadge();
        afterRate(id, r);
      });
    }
    paintAnswerMark(d, markGet(id));
  });

}

function paintAnswerMark(d, mark) {
  d.dataset.mark = String(mark || 0);
  $$('.rate-btn', d).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === mark)));
  const st = $('.ans-state', d);
  if (!st) return;
  if (mark === 1) { st.textContent = '已掌握'; return; }
  if (mark !== -1) { st.textContent = ''; return; }
  // 挂在摘要行上的这块小字，顺手告诉你下次什么时候再来碰它
  const r = state.rev[d.dataset.ex];
  st.textContent = (r && r.due) ? (r.due <= dayKey() ? '待复习' : fmtDue(r.due)) : '待复习';
}

function refreshExGauge() {
  const bar = $('#exBar'), txt = $('#exTxt');
  if (!bar || !txt) return;
  const all = $$('details.answer', $('#lessonBody')).filter(d => !d.classList.contains('out'));
  if (!all.length) return;
  const rated = all.filter(d => d.dataset.mark === '1' || d.dataset.mark === '-1').length;
  bar.style.width = (rated / all.length * 100) + '%';
  txt.textContent = rated + '/' + all.length;
}

/* ============================================================
   复习档期（间隔复习）
   ------------------------------------------------------------
   只做一件事：把"这道题我还没真会"变成"哪天该再看一眼"。
   连对第 k 次之后隔 REV_STEPS[k-1] 天再来一次，走完全部阶梯就毕业，
   从错题本转入已掌握；复习失手则退回第一档，明天重来。
   ============================================================ */
const REV_STEPS = [1, 3, 7, 21];
const REV_GRAD = REV_STEPS.length + 1;      // 连对 5 次（含 21 天那一关）＝ 毕业
const REV_LABEL = ['今天重做', '1 天后', '3 天后', '7 天后', '21 天后'];

function parseDay(k) {
  const p = String(k || '').split('-').map(Number);
  return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1);
}
function dayAdd(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}
function dayDiff(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function fmtDue(d) {
  const n = dayDiff(dayKey(), d);
  if (n <= 0) return '今天';
  if (n === 1) return '明天';
  if (n === 2) return '后天';
  if (n <= 30) return n + ' 天后';
  const p = String(d).split('-');
  return (+p[1]) + ' 月 ' + (+p[2]) + ' 日';
}

/* 一次复习的结果记账。ok=true 升一档，false 回第一档。
   firstMiss=true 表示这是"刚发现不会"，当下就回头重做，所以今天仍到期。 */
function gradeRev(id, ok, firstMiss) {
  const t = dayKey();
  const r = state.rev[id] || { l: 0, due: t, n: 0 };
  r.n = (r.n || 0) + 1;
  if (ok) {
    r.l = (r.l || 0) + 1;
    if (r.l >= REV_GRAD) {            // 最后一关也过了，移出错题本
      delete state.rev[id];
      markSet(id, 1);
      return { kind: 'grad', n: r.n, due: null, l: 0 };
    }
    r.due = dayAdd(REV_STEPS[r.l - 1]);
  } else {
    r.l = 0;
    r.due = firstMiss ? t : dayAdd(1);   // 复习失手：明天再来
  }
  state.rev[id] = r;
  markSet(id, -1);
  return { kind: ok ? 'up' : 'reset', due: r.due, l: r.l, n: r.n };
}

/* 自评的唯一入口——课文页那排按钮和错题本里那排都走这里。
   两处各写一套的话，档期迟早跟标记对不上。

   两种口气，由 graded 决定：
   · 课文页（graded=false）是「记录」：写对了＝从错题本拿走，再点一次＝改主意取消；
     不推进复习档期——档期只在真正的复习里走，不然随手点两下就毕业了。
   · 错题本与复习会话（graded=true）是「判定」：点下去永远记一次结果，
     不会因为再点一下就把这道题从错题本里抹掉。 */
function rateEx(id, m, graded) {
  const hw = isHwKey(id);        // 作业的 -1 叫「卡住」，例题的 -1 叫「没写出来」
  const cur = markGet(id);
  const doneMsg = hw ? '已标记：做完了' : '已标记：写对了';
  if (!graded) {
    if (cur === m) {                             // 再点一次＝改主意
      markSet(id, 0); delete state.rev[id];
      return { next: 0, msg: '已取消标记' };
    }
    if (m === 1) {
      markSet(id, 1);
      delete state.rev[id];                      // 直接判为会做，就不必再排复习了
      return { next: 1, msg: doneMsg };
    }
    gradeRev(id, false, true);                   // 头一回发现不会做：今天就可以回头重做
    return {
      next: -1,
      msg: hw ? '已记下：这题卡住 · 现在就可以回头再写一遍'
        : '已加入错题本 · 现在就可以回头重做一遍'
    };
  }
  if (m === 1) {
    if (cur === 1) return { next: 1, msg: hw ? '这道作业已经标过做完了' : '这道已经在「已掌握」里了' };
    if (!state.rev[id]) {                        // 没有档期在跑，就是单纯的"我搞定了"
      markSet(id, 1);
      return { next: 1, msg: doneMsg };
    }
    const g = gradeRev(id, true);
    return {
      next: g.kind === 'grad' ? 1 : -1, kind: g.kind,
      // g.n 是"练过多少次"（含失手的那些），不是连对次数——写成"连对 N 次"会骗人
      msg: g.kind === 'grad' ? '练了 ' + g.n + ' 次 · 这道题毕业了，已移出错题本'
        : '过关 · ' + fmtDue(g.due) + '再练一次'
    };
  }
  const first = !state.rev[id];
  const g = gradeRev(id, false, first);
  return {
    next: -1, kind: g.kind,
    msg: first ? (hw ? '已记下：这题卡住' : '已加入错题本')
      : '没关系 · ' + fmtDue(g.due) + '再来一次'
  };
}

/* 练习项计数的唯一出口。徽章、页签、汇总卡、复习队列全从这儿取数——
   各算一遍迟早显示成两个数字。行和计数在同一趟里产出，天然对得上；
   也顺带把"导入残留的幽灵 id"挡在外面，只数能对上课程内容的题。

   作业和例题在错题本里的待遇刻意不同：
   · 例题——没表态的进「未评价」、搞定的进「已掌握」，是一本自评台账；
   · 作业——只有「卡住」才进错题本。没做的作业属于课时页的清单，不是欠债；
            做完的作业随即离开，因为它从来没当过错题。
   于是两条守恒式各自成立，都能拿来做断言：
     例题：poolEx + fresh + doneEx  === exTotal (45)
     作业：poolHw + hwDone + hwTodo === hwTotal (142) */
function revStats() {
  const t = dayKey();
  const rows = { due: [], later: [], fresh: [], done: [] };
  const s = {
    rows, due: 0, later: 0, fresh: 0, done: 0,
    pool: 0, overdue: 0, buckets: [0, 0, 0, 0, 0],
    exTotal: 0, hwTotal: 0, total: 0,
    poolEx: 0, poolHw: 0, doneEx: 0, hwDone: 0, hwTodo: 0
  };
  buildExIndex().concat(buildHwIndex()).forEach(x => {
    const isHw = x.kind === 'hw';
    if (isHw) s.hwTotal++; else s.exTotal++;
    s.total++;
    const m = markGet(x.id);
    const base = { id: x.id, itemId: x.itemId, title: x.title, kind: x.kind, due: null, lvl: 0, n: 0 };
    if (m === 1) {
      if (isHw) { s.hwDone++; return; }
      rows.done.push(Object.assign(base, { mark: 1 }));
      s.doneEx++;
      return;
    }
    if (m !== -1) {
      if (isHw) { s.hwTodo++; return; }
      rows.fresh.push(Object.assign(base, { mark: 0 }));
      return;
    }
    const r = state.rev[x.id] || {};
    const due = r.due || t;                     // 兜底：没有档期记录的错题，今天就到期
    const row = Object.assign(base, { mark: -1, due, lvl: r.l || 0, n: r.n || 0 });
    s.pool++;
    if (isHw) s.poolHw++; else s.poolEx++;
    s.buckets[Math.min(row.lvl, REV_LABEL.length - 1)]++;
    if (due <= t) { rows.due.push(row); if (due < t) s.overdue++; }
    else rows.later.push(row);
  });
  rows.due.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.lvl - b.lvl));
  rows.later.sort((a, b) => (a.due < b.due ? -1 : 1));
  s.due = rows.due.length; s.later = rows.later.length;
  s.fresh = rows.fresh.length; s.done = rows.done.length;
  return s;
}

/* ============================================================
   复习会话：把"今天该复习 3 道"变成一条走得到底的路
   ------------------------------------------------------------
   不另开一个页面——题要回到它所在的那一课去做。前面那几个知识点、
   同一节的其它例题，本来就是复习材料的一部分。
   ============================================================ */
let rvSession = null;   // { ids: 还欠着的例题 id, done: 这一轮过了几道 }

/* 这道题是不是正在复习会话里？——决定课文页那排按钮是"判定"还是"开关" */
function isSessionItem(id) { return !!(rvSession && rvSession.ids.indexOf(id) >= 0); }

function startReview() {
  if (rvSession) { rvStep(); return; }
  const ids = revStats().rows.due.map(x => x.id);
  if (!ids.length) { toast('今天没有到期的错题'); return; }
  rvSession = { ids, done: 0 };
  rvStep();
}
function rvStep() {
  if (!rvSession) return;
  if (!rvSession.ids.length) { endReview(); return; }
  paintRvBar();
  const id = rvSession.ids[0];
  const row = pracRow(id);
  if (!row) { rvSession.ids.shift(); rvStep(); return; }
  pendingEx = id;
  go(row.itemId);
}
function rvSkip() {
  if (!rvSession) return;
  rvSession.ids.shift();          // 只是略过，不动档期，下次它还在队列里
  rvStep();
}
function endReview() {
  const done = rvSession ? rvSession.done : 0;
  const left = rvSession ? rvSession.ids.length : 0;
  rvSession = null;
  paintRvBar();
  toast(done ? `这轮过了 ${done} 道${left ? ` · 还剩 ${left} 道没做` : ' · 全部清完'}` : '复习结束');
}

/* 自评之后统一走这里：落盘、提示，以及在复习会话里顺势推进下一道 */
function afterRate(id, r) {
  save();
  toast(r.msg);
  if (!rvSession) return;
  const k = rvSession.ids.indexOf(id);
  if (k < 0) return;              // 评的不是会话里这一道，别乱推进
  rvSession.ids.splice(k, 1);
  rvSession.done++;
  setTimeout(rvStep, 700);        // 留一拍，让人看清刚才那道的变化
}

function paintRvBar() {
  const bar = $('#rvBar');
  if (!bar) return;
  const on = !!(rvSession && rvSession.ids.length);
  bar.dataset.show = on ? '1' : '0';
  document.body.dataset.session = on ? '1' : '0';
  if (!on) return;
  const id = rvSession.ids[0];
  const row = pracRow(id), item = row ? ITEM_BY_ID[row.itemId] : null;
  $('#rvBarN').textContent = (rvSession.done + 1) + ' / ' + (rvSession.done + rvSession.ids.length);
  $('#rvBarT').textContent = item
    ? (item.kind === 'lesson' ? `第 ${item.no} 课 · ${item.title}` : item.title) + ' — ' + row.title
    : '';
}

/* ============================================================
   抽题自测：把"我以为我会了"变成一次真的检验
   ------------------------------------------------------------
   复习做的是你已经知道不会的题，防的是遗忘；自测问的是你以为自己会了的
   题，防的是错觉。错题本只装得下你亲手判过的否定判断——那些标了
   「已掌握」的题从此没人回头看过。这里就是那个回头的机制。
   ============================================================ */
let qzSession = null;      // { rows, idx, results }
let qzRevealed = false;    // 这一题的答案是不是已经揭开了
let qzSetup = { scope: 'learned', size: 10, source: 'mix' };

const QZ_SIZES = [5, 10, 20];
const QZ_SOURCES = [['mix', '混合'], ['ex', '只例题'], ['hw', '只作业']];
const QZ_SCOPE = { learned: '已学过的课', all: '全部课程' };

/* 这道题有多久没被检验过？数字越小越该被抽中。
   T0 你自己说过"会了/做完了"——最久没人复核的一群，错觉最容易藏这儿
   T1 你从没表过态——不知道会不会，正好问一问
   T2 已经在错题本循环里——不急着靠自测来碰它 */
function quizTier(id) {
  const m = markGet(id);
  return m === -1 ? 2 : m === 1 ? 0 : 1;
}

function quizScopeName(scope) {
  return QZ_SCOPE[scope] || (STAGE_BY_ID[scope] ? STAGE_BY_ID[scope].label + ' · ' + STAGE_BY_ID[scope].name : scope);
}

function quizPool(scope, source) {
  const keep = it => {
    if (!it) return false;
    if (scope === 'all') return true;
    if (scope === 'learned') return isDone(it.id);
    return it.stageId === scope;
  };
  const pool = [];
  if (source !== 'hw') buildQuizIndex().forEach(x => { if (keep(ITEM_BY_ID[x.itemId])) pool.push(x); });
  if (source !== 'ex') buildHwIndex().forEach(x => { if (keep(ITEM_BY_ID[x.itemId])) pool.push(x); });
  return pool;
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 分层抽样：先按"多久没被检验过"分三层，层内打乱，再从 T0 往 T2 取满 */
function drawQuiz(pool, n) {
  const tiers = [[], [], []];
  shuffleArr(pool.slice()).forEach(r => tiers[quizTier(r.id)].push(r));
  const out = [];
  for (let t = 0; t < tiers.length && out.length < n; t++) {
    for (const r of tiers[t]) { if (out.length >= n) break; out.push(r); }
  }
  return out;
}

function startQuiz() {
  let scope = qzSetup.scope;
  let pool = quizPool(scope, qzSetup.source);
  if (!pool.length && scope === 'learned') { scope = 'all'; pool = quizPool(scope, qzSetup.source); }
  if (!pool.length) { toast('这个范围里还没有可抽的题'); return; }
  if (rvSession) { rvSession = null; paintRvBar(); }   // 复习会话和自测不会同时进行
  qzSession = { rows: drawQuiz(pool, qzSetup.size), idx: 0, results: [], scope };
  qzRevealed = false;
  go('quiz');
}

  setAccent('teal');

function qzReveal() {

function qzRate(ok) {
  const S = qzSession;
  if (!S) return;
  const row = S.rows[S.idx];
  const was = markGet(row.id);
  const r = rateEx(row.id, ok ? 1 : -1, true);   // 判定，不是开关——见 rateEx 注释
  // 自测独有的两句话：只有这里才知道这道题刚才是不是"已掌握"
  const msg = (!ok && was === 1) ? '本来在「已掌握」里 · 已退回错题本，今天就重做'
    : (ok && was === 1) ? '复核通过 · 确实会了'
      : r.msg;
  S.results.push({ id: row.id, ok: !!ok, msg });
  save();
  toast(msg);
  refreshReviewBadge();
  const box = $('#qzRate');
  if (box) box.dataset.done = '1';
  setTimeout(() => {
    if (qzSession !== S) return;      // 中间"结束"或重开了，别乱推进
    S.idx++; qzRevealed = false; renderQuiz();
  }, 650);
}

function qzSkip() {
  if (!qzSession) return;
  qzSession.results.push({ id: qzSession.rows[qzSession.idx].id, ok: null, msg: '跳过' });
  qzSession.idx++; qzRevealed = false; renderQuiz();
}

function qzQuit() {
  if (!qzSession) return;
  qzSession.idx = qzSession.rows.length; qzRevealed = false; renderQuiz();
}

/* ============================================================
   学习记录：时长统计 + 热力图
   ============================================================ */
const IDLE_MS = 5 * 60 * 1000;   // 超过 5 分钟没操作就不算在学
const TICK_MS = 10000;
let lastActive = Date.now();
['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(ev =>
  addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));

function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addTime(sec) {
  if (!(sec > 0)) return;
  const k = dayKey();
  state.time[k] = (state.time[k] || 0) + sec;
  save();
}
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastActive > IDLE_MS) return;
  addTime(TICK_MS / 1000);
  refreshRecordsLive();
}, TICK_MS);

function sumBack(n) {
  let s = 0, d = new Date();
  for (let i = 0; i < n; i++) { s += state.time[dayKey(d)] || 0; d.setDate(d.getDate() - 1); }
  return s;
}
function sumThisWeek() {
  let s = 0, d = new Date();
  const dow = (d.getDay() + 6) % 7;   // 0 = 周一
  for (let i = 0; i <= dow; i++) { s += state.time[dayKey(d)] || 0; d.setDate(d.getDate() - 1); }
  return s;
}
function totalTime() { return Object.keys(state.time).reduce((a, k) => a + (+state.time[k] || 0), 0); }
function studyDays() { return Object.keys(state.time).filter(k => state.time[k] > 0).length; }
function streak() {
  let n = 0, d = new Date();
  if (!(state.time[dayKey(d)] > 0)) d.setDate(d.getDate() - 1);   // 今天还没学不打断连续记录
  while (n < 400 && state.time[dayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec <= 0) return '0';
  if (sec < 60) return '不到 1 分';
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  if (h && m) return h + ' 时 ' + m + ' 分';
  if (h) return h + ' 小时';
  return m + ' 分';
}
function level(sec) {
  if (!sec) return 0;
  if (sec < 900) return 1;
  if (sec < 1800) return 2;
  if (sec < 3600) return 3;
  return 4;
}

const HM_WEEKS = 18;
function heatCells() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dow = (today.getDay() + 6) % 7;
  const start = new Date(today);
  start.setDate(today.getDate() - dow - (HM_WEEKS - 1) * 7);   // 从 18 周前的周一起
  const tkey = dayKey(today), out = [];
  for (let w = 0; w < HM_WEEKS; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(start.getDate() + w * 7 + d);
      const key = dayKey(day);
      out.push({ key, sec: state.time[key] || 0, isToday: key === tkey, future: day > today });
    }
  }
  return out;
}
function heatmapHTML() {
  return `<div class="hm">${heatCells().map(c =>
    `<i class="hm-c" data-l="${c.future ? 0 : level(c.sec)}"${c.isToday ? ' data-today="1"' : ''} title="${c.key} · ${c.sec ? fmtDur(c.sec) : '没有记录'}"></i>`
  ).join('')}</div>`;
}
function recStatsHTML() {
  const st = streak();
  return `
    <div class="rec-card"><b>${esc(fmtDur(state.time[dayKey()] || 0))}</b><span>今日学习</span></div>
    <div class="rec-card"><b>${esc(fmtDur(sumThisWeek()))}</b><span>本周累计</span></div>
    <div class="rec-card"><b>${esc(fmtDur(totalTime()))}</b><span>总计 · ${studyDays()} 天有记录</span></div>
    <div class="rec-card"><b>${st}<small>天</small></b><span>连续学习</span></div>`;
}
function refreshRecordsLive() {
  const host = $('#recStats');
  if (!host) return;
  host.innerHTML = recStatsHTML();
  const cell = $('.hm-c[data-today="1"]');
  if (cell) cell.dataset.l = String(level(state.time[dayKey()] || 0));
}

    <em>连对一次往后挪一档，走完全程就毕业</em></div>` : ''}

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>导入并合并</button>

  refreshReviewBadge();

/* ============================================================
   数据的导出 / 导入 / 清空
   ============================================================ */
function exportData() {
  const payload = {
    app: 'python-learning-path',
    version: 4,
    exportedAt: new Date().toISOString(),
    state: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'python学习记录-' + dayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('学习记录已导出');
}

/* 导入用合并语义：进度取并集，同一天时长取较大值，复习档期取"走得更远"的那份，
   免得重复导入把已经排到 21 天后的题又拉回今天。 */
function mergeState(inc) {
  const asMap = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  let added = 0;
  ['done', 'miles'].forEach(k => {
    const m = asMap(inc[k]);
    Object.keys(m).forEach(x => { if (m[x] && !state[k][x]) { state[k][x] = 1; added++; } });
  });
  // 标记表的合并一律「取值更高者胜」：1（已完成）> -1（还欠着）> 缺省。
  // 不能只判断真值——-1 也是真值，那样一份「卡住」的备份会把「已完成」覆盖掉。
  const rank = v => { const n = +v; return n === 1 ? 2 : n === -1 ? 1 : 0; };
  ['ex', 'hw'].forEach(k => {
    const m = asMap(inc[k]);
    Object.keys(m).forEach(x => {
      const r = rank(m[x]);
      if (!r) return;
      if (rank(state[k][x]) < r) { state[k][x] = +m[x]; added++; }
    });
  });
  const tm = asMap(inc.time);
  Object.keys(tm).forEach(x => { const v = +tm[x] || 0; if (v > (state.time[x] || 0)) state.time[x] = v; });
  // 档期只并进"两边都还欠着"的题：本地已经毕业转入已掌握的，不因为一份旧备份又被拉回复习池。
  const rv = asMap(inc.rev);
  Object.keys(rv).forEach(x => {
    if (markGet(x) !== -1) return;
    const a = asMap(rv[x]);
    const came = { l: +a.l || 0, due: String(a.due || ''), n: +a.n || 0 };
    if (!came.due) return;
    const cur = state.rev[x];
    if (!cur) { state.rev[x] = came; added++; return; }
    // 取档位更高的；档位相同时取更晚的到期日——复习进度是"走得远"的那份更可信
    if (came.l > (+cur.l || 0) || (came.l === (+cur.l || 0) && came.due > String(cur.due || ''))) {
      state.rev[x] = { l: came.l, due: came.due, n: Math.max(came.n, +cur.n || 0) };
    } else {
      cur.n = Math.max(came.n, +cur.n || 0);
    }
  });
  if (!state.theme && inc.theme) state.theme = inc.theme;
  return added;
}

function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let inc = null;
    try {
      const obj = JSON.parse(String(fr.result));
      inc = (obj && obj.state) ? obj.state : obj;   // 兼容裸 state 的旧文件
      if (!inc || typeof inc !== 'object' || Array.isArray(inc)) throw new Error('shape');
    } catch (e) { toast('导入失败：这个文件不是学习记录'); return; }
    const added = mergeState(inc);
    sweepRev();                                     // 并进来的错题若没有档期，就地补齐
    saveNow();
    render();
    refreshProgress();
    refreshReviewBadge();
    toast(added ? `导入完成 · 合并新增 ${added} 项进度` : '导入完成 · 没有新内容需要合并');
  };
  fr.onerror = () => toast('导入失败：文件读不出来');
  fr.readAsText(file, 'utf-8');
}

function clearAll() {
  const theme = state.theme;
  state = STATE_DEFAULT();
  state.theme = theme;
  rvSession = null;                 // 正在走的复习也一并结束，别留个指向空数据的会话
  try { localStorage.removeItem(KEY); } catch (e) {}
  saveNow();
  render();
  refreshProgress();
  refreshReviewBadge();
  toast('已清空全部学习记录');
}

let clrArmId = null;
function bindData() {
  clearTimeout(clrArmId);
  const exp = $('#expBtn'), imp = $('#impBtn'), clr = $('#clrBtn'), file = $('#impFile');
  if (exp) exp.addEventListener('click', exportData);
  if (imp && file) {
    imp.addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (f) importData(f);
      file.value = '';
    });
  }
  if (clr) {
    const orig = clr.innerHTML;
    clr.addEventListener('click', () => {
      // 清空不可撤销，做成两段式：第一次只是「上膛」，第二次才真的执行
      if (clr.dataset.arm !== '1') {
        clr.dataset.arm = '1';
        clr.innerHTML = '再点一次确认清空';
        toast('这会删掉全部进度与学习记录');
        clrArmId = setTimeout(() => {
          const b = $('#clrBtn');
          if (b) { b.dataset.arm = '0'; b.innerHTML = orig; }
        }, 5000);
        return;
      }
      clearTimeout(clrArmId);
      clearAll();
    });
  }
}

/* 错题本的页签、开复习、自评，以及自测的各种动作：统一在容器上代理，
   避免每次重渲染都要重新绑一遍事件 */
$('#contentRoot').addEventListener('click', e => {
  /* ---- 自测 ---- */
  const seg = e.target.closest('.qz-seg-b');
  if (seg) {
    if (seg.dataset.qzSize) qzSetup.size = +seg.dataset.qzSize;
    if (seg.dataset.qzSrc) qzSetup.source = seg.dataset.qzSrc;
    renderQuiz();
    return;
  }
  if (e.target.closest('#qzStart') || e.target.closest('#qzAgain')) { startQuiz(); return; }
  if (e.target.closest('#qzReveal')) { qzReveal(); return; }
  const qr = e.target.closest('[data-qz-rate]');
  if (qr) { qzRate(+qr.dataset.qzRate === 1); return; }
  if (e.target.closest('#qzSkip')) { qzSkip(); return; }
  if (e.target.closest('#qzQuit')) { qzQuit(); return; }
  const quit = e.target.closest('[data-qz-quit]');
  if (quit) {
    // 收起本轮，回到设置页；已经站在 #/quiz 上时 hash 不会变，得手动重渲染
    qzSession = null; qzRevealed = false;
    const to = (quit.getAttribute('href') || '').replace(/^#\/?/, '');
    if (to === getRoute()) { e.preventDefault(); render(); }
    return;
  }

  /* ---- 选方向页：`#dir_a` 这种"跳到某方向并就地展开"的一次性口令 ---- */
  const dirj = e.target.closest('[data-dirjump], a[href^="#dir_"]');
  if (dirj) {
    const letter = dirj.dataset.dirjump ||
      String(dirj.getAttribute('href')).replace(/^#dir_/, '');
    if (letter) { e.preventDefault(); goDir(letter); return; }
  }

  /* ---- 错题本 ---- */
  const tab = e.target.closest('.tab[data-tab]');
  if (tab) { rvTab = tab.dataset.tab; renderReview(); return; }
  if (e.target.closest('#rvStart')) { startReview(); return; }
  const jump = e.target.closest('[data-jump]');
  if (jump) { pendingEx = jump.dataset.jump; return; }   // 让默认的 hash 跳转继续
  const rb = e.target.closest('.rate-btn[data-ex]');
  if (!rb) return;
  const id = rb.dataset.ex;
  // 错题本里的按钮是判定，不是开关——见 rateEx 的注释
  const r = rateEx(id, +rb.dataset.m, true);
  renderReview();
  afterRate(id, r);
});
/* 自测设置里的范围是原生 select，用 change 而不是 click */
$('#contentRoot').addEventListener('change', e => {
  if (e.target.id === 'qzScope') qzSetup.scope = e.target.value;
});
$('#rvSkip').addEventListener('click', rvSkip);
$('#rvQuit').addEventListener('click', endReview);

   ============================================================ */

};
