/* ============================================================
   复习档期（间隔复习）
   ------------------------------------------------------------
   只做一件事：把"这道题我还没真会"变成"哪天该再看一眼"。
   连对第 k 次之后隔 REV_STEPS[k-1] 天再来一次，走完全部阶梯就毕业，
   从错题本转入已掌握；复习失手则退回第一档，明天重来。
   ============================================================ */
const REV_STEPS = [1, 3, 7, 21];
const REV_GRAD = REV_STEPS.length + 1;      // 连对 5 次（含 21 天那一关）＝ 毕业
const REV_LABEL = ['今天重做', '1 天后', '3 天后', '7 天后', '21 天后'];

function parseDay(k) {
  const p = String(k || '').split('-').map(Number);
  return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1);
}
function dayAdd(n) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}
function dayDiff(a, b) { return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function fmtDue(d) {
  const n = dayDiff(dayKey(), d);
  if (n <= 0) return '今天';
  if (n === 1) return '明天';
  if (n === 2) return '后天';
  if (n <= 30) return n + ' 天后';
  const p = String(d).split('-');
  return (+p[1]) + ' 月 ' + (+p[2]) + ' 日';
}

/* 一次复习的结果记账。ok=true 升一档，false 回第一档。
   firstMiss=true 表示这是"刚发现不会"，当下就回头重做，所以今天仍到期。 */
function gradeRev(id, ok, firstMiss) {
  const t = dayKey();
  const r = state.rev[id] || { l: 0, due: t, n: 0 };
  r.n = (r.n || 0) + 1;
  if (ok) {
    r.l = (r.l || 0) + 1;
    if (r.l >= REV_GRAD) {            // 最后一关也过了，移出错题本
      delete state.rev[id];
      markSet(id, 1);
      return { kind: 'grad', n: r.n, due: null, l: 0 };
    }
    r.due = dayAdd(REV_STEPS[r.l - 1]);
  } else {
    r.l = 0;
    r.due = firstMiss ? t : dayAdd(1);   // 复习失手：明天再来
  }
  state.rev[id] = r;
  markSet(id, -1);
  return { kind: ok ? 'up' : 'reset', due: r.due, l: r.l, n: r.n };
}

/* 自评的唯一入口——课文页那排按钮和错题本里那排都走这里。
   两处各写一套的话，档期迟早跟标记对不上。

   两种口气，由 graded 决定：
   · 课文页（graded=false）是「记录」：写对了＝从错题本拿走，再点一次＝改主意取消；
     不推进复习档期——档期只在真正的复习里走，不然随手点两下就毕业了。
   · 错题本与复习会话（graded=true）是「判定」：点下去永远记一次结果，
     不会因为再点一下就把这道题从错题本里抹掉。 */
function rateEx(id, m, graded) {
  const hw = isHwKey(id);        // 作业的 -1 叫「卡住」，例题的 -1 叫「没写出来」
  const cur = markGet(id);
  const doneMsg = hw ? '已标记：做完了' : '已标记：写对了';
  if (!graded) {
    if (cur === m) {                             // 再点一次＝改主意
      markSet(id, 0); delete state.rev[id];
      return { next: 0, msg: '已取消标记' };
    }
    if (m === 1) {
      markSet(id, 1);
      delete state.rev[id];                      // 直接判为会做，就不必再排复习了
      return { next: 1, msg: doneMsg };
    }
    gradeRev(id, false, true);                   // 头一回发现不会做：今天就可以回头重做
    return {
      next: -1,
      msg: hw ? '已记下：这题卡住 · 现在就可以回头再写一遍'
        : '已加入错题本 · 现在就可以回头重做一遍'
    };
  }
  if (m === 1) {
    if (cur === 1) return { next: 1, msg: hw ? '这道作业已经标过做完了' : '这道已经在「已掌握」里了' };
    if (!state.rev[id]) {                        // 没有档期在跑，就是单纯的"我搞定了"
      markSet(id, 1);
      return { next: 1, msg: doneMsg };
    }
    const g = gradeRev(id, true);
    return {
      next: g.kind === 'grad' ? 1 : -1, kind: g.kind,
      // g.n 是"练过多少次"（含失手的那些），不是连对次数——写成"连对 N 次"会骗人
      msg: g.kind === 'grad' ? '练了 ' + g.n + ' 次 · 这道题毕业了，已移出错题本'
        : '过关 · ' + fmtDue(g.due) + '再练一次'
    };
  }
  const first = !state.rev[id];
  const g = gradeRev(id, false, first);
  return {
    next: -1, kind: g.kind,
    msg: first ? (hw ? '已记下：这题卡住' : '已加入错题本')
      : '没关系 · ' + fmtDue(g.due) + '再来一次'
  };
}

/* 练习项计数的唯一出口。徽章、页签、汇总卡、复习队列全从这儿取数——
   各算一遍迟早显示成两个数字。行和计数在同一趟里产出，天然对得上；
   也顺带把"导入残留的幽灵 id"挡在外面，只数能对上课程内容的题。

   作业和例题在错题本里的待遇刻意不同：
   · 例题——没表态的进「未评价」、搞定的进「已掌握」，是一本自评台账；
   · 作业——只有「卡住」才进错题本。没做的作业属于课时页的清单，不是欠债；
            做完的作业随即离开，因为它从来没当过错题。
   于是两条守恒式各自成立，都能拿来做断言：
     例题：poolEx + fresh + doneEx  === exTotal (45)
     作业：poolHw + hwDone + hwTodo === hwTotal (142) */
function revStats() {
  const t = dayKey();
  const rows = { due: [], later: [], fresh: [], done: [] };
  const s = {
    rows, due: 0, later: 0, fresh: 0, done: 0,
    pool: 0, overdue: 0, buckets: [0, 0, 0, 0, 0],
    exTotal: 0, hwTotal: 0, total: 0,
    poolEx: 0, poolHw: 0, doneEx: 0, hwDone: 0, hwTodo: 0
  };
  buildExIndex().concat(buildHwIndex()).forEach(x => {
    const isHw = x.kind === 'hw';
    if (isHw) s.hwTotal++; else s.exTotal++;
    s.total++;
    const m = markGet(x.id);
    const base = { id: x.id, itemId: x.itemId, title: x.title, kind: x.kind, due: null, lvl: 0, n: 0 };
    if (m === 1) {
      if (isHw) { s.hwDone++; return; }
      rows.done.push(Object.assign(base, { mark: 1 }));
      s.doneEx++;
      return;
    }
    if (m !== -1) {
      if (isHw) { s.hwTodo++; return; }
      rows.fresh.push(Object.assign(base, { mark: 0 }));
      return;
    }
    const r = state.rev[x.id] || {};
    const due = r.due || t;                     // 兜底：没有档期记录的错题，今天就到期
    const row = Object.assign(base, { mark: -1, due, lvl: r.l || 0, n: r.n || 0 });
    s.pool++;
    if (isHw) s.poolHw++; else s.poolEx++;
    s.buckets[Math.min(row.lvl, REV_LABEL.length - 1)]++;
    if (due <= t) { rows.due.push(row); if (due < t) s.overdue++; }
    else rows.later.push(row);
  });
  rows.due.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.lvl - b.lvl));
  rows.later.sort((a, b) => (a.due < b.due ? -1 : 1));
  s.due = rows.due.length; s.later = rows.later.length;
  s.fresh = rows.fresh.length; s.done = rows.done.length;
  return s;
}

/* 徽章数的是"今天该复习"——动得了手的那个数。
   数错题总数的话，明明今天没事可做还挂着一个 6，就成了噪音。 */
function reviewCount() { return revStats().due; }
function refreshReviewBadge() {
  const n = reviewCount();
  const b = $('#reviewBadge');
  if (b) { b.textContent = String(n); b.dataset.zero = n ? '0' : '1'; }
  return n;
}
/* 作业的计数不在这里另算一份——revStats() 已经把 hwDone / poolHw / hwTodo 一起产出了，
   学习记录页直接用 s.hwDone 那三个数。 */


/* ============================================================
   错题本页面
   ============================================================ */
let rvTab = null;

function renderReview() {
  setAccent('teal');
  const s = revStats();
  const R = s.rows;
  // 第一次进来优先落在「该复习」；还没到期就看排队中的，都没有就去评价例题
  if (rvTab === null) rvTab = s.due ? 'due' : s.pool ? 'later' : 'fresh';

  const TABS = [['due', '该复习', s.due], ['later', '稍后', s.later],
                ['fresh', '未评价', s.fresh], ['done', '已掌握', s.done]];
  const list = R[rvTab] || R.fresh;

  $('#contentRoot').className = 'content';
  $('#contentRoot').innerHTML = `
  <div class="crumbs"><a href="#/">课程总览</a><i>/</i><span>错题本</span></div>
  <header class="lesson-head">
    <h1>错题本</h1>
    <p class="hero-lede" style="margin-bottom:18px">没写出来的例题、以及标了「卡住」的作业，都会排进复习档期：连对一次往后挪一档，间隔 1 → 3 → 7 → 21 天；走完全程就毕业。复习失手退回第一档，明天再来——隔段时间重逢，比当天连做十遍管用。</p>
    <div class="chips">
      <span class="chip">🔁 今天该复习 <b>${s.due}</b></span>
      <span class="chip">📅 排队中 <b>${s.later}</b></span>
      <span class="chip">🕐 例题未评价 <b>${s.fresh}</b></span>
      <span class="chip">✅ 例题已掌握 <b>${s.done}</b></span>
      ${s.poolHw ? `<span class="chip">📌 其中作业卡住 <b>${s.poolHw}</b></span>` : ''}
    </div>
  </header>

  ${s.pool ? `<div class="rv-ladder">
    <div class="rv-lad-h"><b>复习节奏</b><span>连对一次往后挪一档，走完 21 天那一关就毕业</span></div>
    <ol class="rv-lad">${s.buckets.map((n, i) =>
      `<li data-on="${n ? 1 : 0}"><b>${n}</b><span>${REV_LABEL[i]}</span></li>`).join('')}</ol>
  </div>` : ''}

  <div class="tabs" role="tablist" aria-label="错题本分类">
    ${TABS.map(([k, label, n]) => `<button class="tab" role="tab" id="rvTab-${k}" aria-controls="rvPanel" data-tab="${k}" aria-selected="${k === rvTab}">${label}<i>${n}</i></button>`).join('')}
  </div>

  ${rvTab === 'due' && s.due ? `<div class="rv-start">
    <button class="btn btn-primary" id="rvStart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 19 12 6 20.5V3.5Z"/></svg>开始复习 ${s.due} 道</button>
    <span>按到期先后一道道来，答完自动跳到下一道${s.overdue ? ` · 有 ${s.overdue} 道已经欠着了` : ''}</span>
  </div>` : ''}

  ${list.length
      ? `<div id="rvPanel" role="tabpanel" aria-labelledby="rvTab-${rvTab}"><ul class="rv-list">${list.map(rvCard).join('')}</ul></div>`
      : rvEmpty(rvTab, s)}
  `;
  refreshReviewBadge();
  paintRvBar();
}

function rvCard(x) {
  const it = ITEM_BY_ID[x.itemId];
  const label = it.kind === 'lesson' ? `第 ${it.no} 课 · ${it.title}` : it.title;
  const hw = x.kind === 'hw';
  let tag = '';
  if (x.mark === -1 && x.due) {
    const n = dayDiff(dayKey(), x.due);
    tag = n < 0 ? `<i class="rv-due" data-late="1">欠了 ${-n} 天</i>`
      : n === 0 ? '<i class="rv-due" data-now="1">今天到期</i>'
        : `<i class="rv-due">${esc(fmtDue(x.due))}到期</i>`;
  }
  // 同一次点击，在例题里叫"写对了"，在作业里叫"做出来了"——同一个动作的两种说法
  const yes = hw ? '做出来了' : '写对了';
  const no = hw ? '还是卡住' : '没写出来';
  return `<li class="rv-card" data-mark="${x.mark}" data-kind="${hw ? 'hw' : 'ex'}">
    <div class="rv-txt">
      <span class="rv-meta"><i class="rv-kind">${hw ? '作业' : '例题'}</i><span class="rv-src">${esc(label)}</span>${tag}</span>
      <b>${esc(x.title)}</b>
    </div>
    <div class="rv-act">
      <button class="rate-btn" type="button" data-ex="${x.id}" data-m="1" aria-pressed="${x.mark === 1}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>${yes}</button>
      <button class="rate-btn" type="button" data-ex="${x.id}" data-m="-1" aria-pressed="${x.mark === -1}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>${no}</button>
      <a class="rv-go" href="#/${it.id}" data-goto="${it.id}" data-jump="${x.id}">去${hw ? '重做' : '复习'}
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </li>`;
}

function rvEmpty(tab, s) {
  s = s || revStats();
  const M = {
    due: ['今天的复习做完了', s.pool ? `还有 ${s.later} 道排在后面，到日子它们会自己浮上来。` : '错题本里没有欠着的题。', '#/', '回到课程总览'],
    later: ['还没有排上队的题', '标了「没写出来」的题会先落到这里，到了复习日自动浮到「该复习」。', '#/', '回到课程总览'],
    fresh: ['所有例题都评价过了', '每一道题你都给出了判断——这本身就是进度。', null, ''],
    done: ['还没有标记为已掌握的题', '自己写出答案、和参考答案对完、确认写对了，再回来标记。这一步不能省。', '#/', '回到课程总览']
  };
  const [t, p, href, btn] = M[tab] || M.due;
  return `<div class="empty"><b>${t}</b><p>${p}</p>${href ? `<a class="btn btn-primary" href="${href}">${btn}</a>` : ''}</div>`;
}

/* ============================================================
   复习会话：把"今天该复习 3 道"变成一条走得到底的路
   ------------------------------------------------------------
   不另开一个页面——题要回到它所在的那一课去做。前面那几个知识点、
   同一节的其它例题，本来就是复习材料的一部分。
   ============================================================ */
let rvSession = null;   // { ids: 还欠着的例题 id, done: 这一轮过了几道 }

/* 这道题是不是正在复习会话里？——决定课文页那排按钮是"判定"还是"开关" */
function isSessionItem(id) { return !!(rvSession && rvSession.ids.indexOf(id) >= 0); }

function startReview() {
  if (rvSession) { rvStep(); return; }
  const ids = revStats().rows.due.map(x => x.id);
  if (!ids.length) { toast('今天没有到期的错题'); return; }
  rvSession = { ids, done: 0 };
  rvStep();
}
function rvStep() {
  if (!rvSession) return;
  if (!rvSession.ids.length) { endReview(); return; }
  paintRvBar();
  const id = rvSession.ids[0];
  const row = pracRow(id);
  if (!row) { rvSession.ids.shift(); rvStep(); return; }
  pendingEx = id;
  go(row.itemId);
}
function rvSkip() {
  if (!rvSession) return;
  rvSession.ids.shift();          // 只是略过，不动档期，下次它还在队列里
  rvStep();
}
function endReview() {
  const done = rvSession ? rvSession.done : 0;
  const left = rvSession ? rvSession.ids.length : 0;
  rvSession = null;
  paintRvBar();
  toast(done ? `这轮过了 ${done} 道${left ? ` · 还剩 ${left} 道没做` : ' · 全部清完'}` : '复习结束');
}

/* 自评之后统一走这里：落盘、提示，以及在复习会话里顺势推进下一道 */
function afterRate(id, r) {
  save();
  toast(r.msg);
  if (!rvSession) return;
  const k = rvSession.ids.indexOf(id);
  if (k < 0) return;              // 评的不是会话里这一道，别乱推进
  rvSession.ids.splice(k, 1);
  rvSession.done++;
  setTimeout(rvStep, 700);        // 留一拍，让人看清刚才那道的变化
}

function paintRvBar() {
  const bar = $('#rvBar');
  if (!bar) return;
  const on = !!(rvSession && rvSession.ids.length);
  bar.dataset.show = on ? '1' : '0';
  document.body.dataset.session = on ? '1' : '0';
  if (!on) return;
  const id = rvSession.ids[0];
  const row = pracRow(id), item = row ? ITEM_BY_ID[row.itemId] : null;
  $('#rvBarN').textContent = (rvSession.done + 1) + ' / ' + (rvSession.done + rvSession.ids.length);
  $('#rvBarT').textContent = item
    ? (item.kind === 'lesson' ? `第 ${item.no} 课 · ${item.title}` : item.title) + ' — ' + row.title
    : '';
}

/* ============================================================
   抽题自测：把"我以为我会了"变成一次真的检验
   ------------------------------------------------------------
   复习做的是你已经知道不会的题，防的是遗忘；自测问的是你以为自己会了的
   题，防的是错觉。错题本只装得下你亲手判过的否定判断——那些标了
   「已掌握」的题从此没人回头看过。这里就是那个回头的机制。
   ============================================================ */
let qzSession = null;      // { rows, idx, results }
let qzRevealed = false;    // 这一题的答案是不是已经揭开了
let qzSetup = { scope: 'learned', size: 10, source: 'mix' };

const QZ_SIZES = [5, 10, 20];
const QZ_SOURCES = [['mix', '混合'], ['ex', '只例题'], ['hw', '只作业']];
const QZ_SCOPE = { learned: '已学过的课', all: '全部课程' };

/* 这道题有多久没被检验过？数字越小越该被抽中。
   T0 你自己说过"会了/做完了"——最久没人复核的一群，错觉最容易藏这儿
   T1 你从没表过态——不知道会不会，正好问一问
   T2 已经在错题本循环里——不急着靠自测来碰它 */
function quizTier(id) {
  const m = markGet(id);
  return m === -1 ? 2 : m === 1 ? 0 : 1;
}

function quizScopeName(scope) {
  return QZ_SCOPE[scope] || (STAGE_BY_ID[scope] ? STAGE_BY_ID[scope].label + ' · ' + STAGE_BY_ID[scope].name : scope);
}

function quizPool(scope, source) {
  const keep = it => {
    if (!it) return false;
    if (scope === 'all') return true;
    if (scope === 'learned') return isDone(it.id);
    return it.stageId === scope;
  };
  const pool = [];
  if (source !== 'hw') buildQuizIndex().forEach(x => { if (keep(ITEM_BY_ID[x.itemId])) pool.push(x); });
  if (source !== 'ex') buildHwIndex().forEach(x => { if (keep(ITEM_BY_ID[x.itemId])) pool.push(x); });
  return pool;
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 分层抽样：先按"多久没被检验过"分三层，层内打乱，再从 T0 往 T2 取满 */
function drawQuiz(pool, n) {
  const tiers = [[], [], []];
  shuffleArr(pool.slice()).forEach(r => tiers[quizTier(r.id)].push(r));
  const out = [];
  for (let t = 0; t < tiers.length && out.length < n; t++) {
    for (const r of tiers[t]) { if (out.length >= n) break; out.push(r); }
  }
  return out;
}

function startQuiz() {
  let scope = qzSetup.scope;
  let pool = quizPool(scope, qzSetup.source);
  if (!pool.length && scope === 'learned') { scope = 'all'; pool = quizPool(scope, qzSetup.source); }
  if (!pool.length) { toast('这个范围里还没有可抽的题'); return; }
  if (rvSession) { rvSession = null; paintRvBar(); }   // 复习会话和自测不会同时进行
  qzSession = { rows: drawQuiz(pool, qzSetup.size), idx: 0, results: [], scope };
  qzRevealed = false;
  go('quiz');
}

function renderQuiz() {
  setAccent('teal');
  $('#contentRoot').className = 'content';
  if (!qzSession) return renderQuizSetup();
  if (qzSession.idx >= qzSession.rows.length) return renderQuizResult();
  renderQuizQuestion();
}

function renderQuizSetup() {
  const exN = buildQuizIndex().length, hwN = buildHwIndex().length;
  const cold = buildQuizIndex().concat(buildHwIndex()).filter(r => markGet(r.id) === 1).length;
  const scopeOpts = [['learned', '已学过的课'], ['all', '全部课程']]
    .concat(COURSE.stages.map(st => [st.id, st.label + ' · ' + st.name]));
  $('#contentRoot').innerHTML = `
  <div class="crumbs"><a href="#/">课程总览</a><i>/</i><span>抽题自测</span></div>
  <header class="lesson-head">
    <h1>抽题自测</h1>
    <p class="hero-lede" style="margin-bottom:18px">错题本问的是你<b>已经知道不会</b>的题。这里反过来——优先抽你以为自己会了的：答案先遮住，你先写，写完再对。答错的自动进错题本，抽中「已掌握」却答错的会被退回去。</p>
    <div class="chips">
      <span class="chip">🧪 可抽例题 <b>${exN}</b></span>
      <span class="chip">✏️ 可抽作业 <b>${hwN}</b></span>
      <span class="chip">🔍 自评过「会了」却没复核 <b>${cold}</b></span>
    </div>
  </header>

  <div class="qz-setup">
    <label class="qz-field">
      <span class="qz-lab">范围</span>
      <select id="qzScope">${scopeOpts.map(([v, t]) =>
        `<option value="${v}"${v === qzSetup.scope ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
    </label>
    <div class="qz-field">
      <span class="qz-lab" id="qzSizeLab">题量</span>
      <div class="qz-seg" role="group" aria-labelledby="qzSizeLab">
        ${QZ_SIZES.map(n => `<button type="button" class="qz-seg-b" data-qz-size="${n}" aria-pressed="${n === qzSetup.size}">${n} 题</button>`).join('')}
      </div>
    </div>
    <div class="qz-field">
      <span class="qz-lab" id="qzSrcLab">题源</span>
      <div class="qz-seg" role="group" aria-labelledby="qzSrcLab">
        ${QZ_SOURCES.map(([v, t]) => `<button type="button" class="qz-seg-b" data-qz-src="${v}" aria-pressed="${v === qzSetup.source}">${t}</button>`).join('')}
      </div>
    </div>
  </div>

  <div class="qz-go-row">
    <button class="btn btn-primary" id="qzStart" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 19 12 6 20.5V3.5Z"/></svg>开始自测</button>
    <span class="qz-hint">出题按「多久没被检验过」排：标过「已掌握」却从没回头复核的排最前，然后是没表过态的，最后才是错题本里已经在复习的。</span>
  </div>
  <p class="qz-note"><b>两点如实说明。</b>作业没有参考答案——142 项作业都是开放题，抽到它们时按钮会换成「我写完了，自查」，回那一课自己核一遍。<br>例题的题面取自标题和说明文字；有一小部分例题的题干本身就是代码（比如「找出隐藏的 bug」），结构上区分不出来，所以那种题卡片上会明确提示你回课文看原题。</p>
  `;
  refreshReviewBadge();
}

function renderQuizQuestion() {
  const S = qzSession, row = S.rows[S.idx];
  const it = ITEM_BY_ID[row.itemId];
  const hw = row.kind === 'hw';
  const label = it.kind === 'lesson' ? `第 ${it.no} 课 · ${it.title}` : it.title;
  const wasDone = markGet(row.id) === 1;
  const pct = Math.round(S.idx / S.rows.length * 100);
  $('#contentRoot').innerHTML = `
  <div class="crumbs"><a href="#/" >课程总览</a><i>/</i><a href="#/quiz" data-qz-quit="1">抽题自测</a><i>/</i><span>第 ${S.idx + 1} 题</span></div>

  <div class="qz-top">
    <b class="qz-count"><b>${S.idx + 1}</b> / ${S.rows.length}</b>
    <span class="qz-scope">${esc(quizScopeName(S.scope))}</span>
    <span class="qz-top-act">
      <button class="btn btn-sm" id="qzSkip" type="button">跳过</button>
      <button class="btn btn-sm" id="qzQuit" type="button">结束</button>
    </span>
  </div>
  <div class="qz-prog" aria-hidden="true"><i style="width:${pct}%"></i></div>

  <article class="qz-card" data-kind="${hw ? 'hw' : 'ex'}">
    <div class="qz-meta">
      <i class="rv-kind" data-kind="${hw ? 'hw' : 'ex'}">${hw ? '作业' : '例题'}</i>
      <span class="rv-src">${esc(label)}</span>
      ${wasDone ? '<i class="qz-badge">你标过「会了」</i>' : ''}
    </div>
    <div class="qz-body">${hw ? `<p class="qz-task">${esc(row.full || row.title)}</p>` : row.q}</div>
    ${(!hw && row.bare) ? `<p class="qz-bare">这一题只给了标题——自己先写一遍再看答案；如果不知从哪下手，先回课文看原题（下面有链接）。</p>` : ''}
    <div class="qz-foot">
      <a class="rv-go" href="#/${it.id}">回课文看原题<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </article>

  <div class="qz-act" id="qzAct"${qzRevealed ? ' hidden' : ''}>
    <button class="btn btn-primary" id="qzReveal" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>${hw ? '我写完了，自查' : '看参考答案'}</button>
    <span class="qz-tip">先在编辑器或纸上写一遍再看——直接翻答案等于没测。</span>
  </div>

  <div class="qz-ans" id="qzAns"${qzRevealed ? '' : ' hidden'}>
    <div class="qz-ans-h"><b>${hw ? '自查' : '参考答案'}</b><span>${hw ? '这道是动手题，没有标准答案' : '对上思路即可，不必逐字一致'}</span></div>
    ${hw
      ? `<p class="qz-note">回到第 ${it.no || ''} 课，对着「知识点」自己核一遍：能跑通、结果对、没有报错，就算过。</p>
         <a class="btn btn-sm" href="#/${it.id}">去第 ${it.no || ''} 课对照</a>`
      : row.a}
  </div>

  <div class="qz-rate" id="qzRate"${qzRevealed ? '' : ' hidden'}>
    <span class="rate-q">${hw ? '这道你写出来了吗？' : '和参考答案对上了吗？'}</span>
    <button class="btn btn-done" type="button" data-qz-rate="1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>${hw ? '写出来了' : '答对了'}</button>
    <button class="btn qz-no" type="button" data-qz-rate="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>${hw ? '还是卡住' : '没答对'}</button>
  </div>
  `;
  refreshReviewBadge();
}

function qzReveal() {
  qzRevealed = true;
  const a = $('#qzAns'), act = $('#qzAct'), rate = $('#qzRate');
  if (act) act.hidden = true;
  if (a) { a.hidden = false; const f = a.querySelector('.hl') || a; f.tabIndex = -1; f.focus({ preventScroll: true }); }
  if (rate) rate.hidden = false;
}

function qzRate(ok) {
  const S = qzSession;
  if (!S) return;
  const row = S.rows[S.idx];
  const was = markGet(row.id);
  const r = rateEx(row.id, ok ? 1 : -1, true);   // 判定，不是开关——见 rateEx 注释
  // 自测独有的两句话：只有这里才知道这道题刚才是不是"已掌握"
  const msg = (!ok && was === 1) ? '本来在「已掌握」里 · 已退回错题本，今天就重做'
    : (ok && was === 1) ? '复核通过 · 确实会了'
      : r.msg;
  S.results.push({ id: row.id, ok: !!ok, msg });
  save();
  toast(msg);
  refreshReviewBadge();
  const box = $('#qzRate');
  if (box) box.dataset.done = '1';
  setTimeout(() => {
    if (qzSession !== S) return;      // 中间"结束"或重开了，别乱推进
    S.idx++; qzRevealed = false; renderQuiz();
  }, 650);
}

function qzSkip() {
  if (!qzSession) return;
  qzSession.results.push({ id: qzSession.rows[qzSession.idx].id, ok: null, msg: '跳过' });
  qzSession.idx++; qzRevealed = false; renderQuiz();
}

function qzQuit() {
  if (!qzSession) return;
  qzSession.idx = qzSession.rows.length; qzRevealed = false; renderQuiz();
}

function renderQuizResult() {
  const S = qzSession;
  const ans = S.results.filter(r => r.ok !== null);
  const right = ans.filter(r => r.ok).length;
  const bad = ans.filter(r => !r.ok).length;
  const pct = ans.length ? Math.round(right / ans.length * 100) : 0;
  $('#contentRoot').innerHTML = `

/* ============================================================
   学习记录：时长统计 + 热力图
   ============================================================ */
const IDLE_MS = 5 * 60 * 1000;   // 超过 5 分钟没操作就不算在学
const TICK_MS = 10000;
let lastActive = Date.now();
['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(ev =>
  addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));

function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addTime(sec) {
  if (!(sec > 0)) return;
  const k = dayKey();
  state.time[k] = (state.time[k] || 0) + sec;
  save();
}
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastActive > IDLE_MS) return;
  addTime(TICK_MS / 1000);
  refreshRecordsLive();
}, TICK_MS);

function sumBack(n) {
  let s = 0, d = new Date();
  for (let i = 0; i < n; i++) { s += state.time[dayKey(d)] || 0; d.setDate(d.getDate() - 1); }
  return s;
}
function sumThisWeek() {
  let s = 0, d = new Date();
  const dow = (d.getDay() + 6) % 7;   // 0 = 周一
  for (let i = 0; i <= dow; i++) { s += state.time[dayKey(d)] || 0; d.setDate(d.getDate() - 1); }
  return s;
}
function totalTime() { return Object.keys(state.time).reduce((a, k) => a + (+state.time[k] || 0), 0); }
function studyDays() { return Object.keys(state.time).filter(k => state.time[k] > 0).length; }
function streak() {
  let n = 0, d = new Date();
  if (!(state.time[dayKey(d)] > 0)) d.setDate(d.getDate() - 1);   // 今天还没学不打断连续记录
  while (n < 400 && state.time[dayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec <= 0) return '0';
  if (sec < 60) return '不到 1 分';
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  if (h && m) return h + ' 时 ' + m + ' 分';
  if (h) return h + ' 小时';
  return m + ' 分';
}
function level(sec) {
  if (!sec) return 0;
  if (sec < 900) return 1;
  if (sec < 1800) return 2;
  if (sec < 3600) return 3;
  return 4;
}

const HM_WEEKS = 18;
function heatCells() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dow = (today.getDay() + 6) % 7;
  const start = new Date(today);
  start.setDate(today.getDate() - dow - (HM_WEEKS - 1) * 7);   // 从 18 周前的周一起
  const tkey = dayKey(today), out = [];
  for (let w = 0; w < HM_WEEKS; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(start.getDate() + w * 7 + d);
      const key = dayKey(day);
      out.push({ key, sec: state.time[key] || 0, isToday: key === tkey, future: day > today });
    }
  }
  return out;
}
function heatmapHTML() {
  return `<div class="hm">${heatCells().map(c =>
    `<i class="hm-c" data-l="${c.future ? 0 : level(c.sec)}"${c.isToday ? ' data-today="1"' : ''} title="${c.key} · ${c.sec ? fmtDur(c.sec) : '没有记录'}"></i>`
  ).join('')}</div>`;
}
function recStatsHTML() {
  const st = streak();
  return `
    <div class="rec-card"><b>${esc(fmtDur(state.time[dayKey()] || 0))}</b><span>今日学习</span></div>
    <div class="rec-card"><b>${esc(fmtDur(sumThisWeek()))}</b><span>本周累计</span></div>
    <div class="rec-card"><b>${esc(fmtDur(totalTime()))}</b><span>总计 · ${studyDays()} 天有记录</span></div>
    <div class="rec-card"><b>${st}<small>天</small></b><span>连续学习</span></div>`;
}
function refreshRecordsLive() {
  const host = $('#recStats');

  host.innerHTML = recStatsHTML();
  const cell = $('.hm-c[data-today="1"]');
  if (cell) cell.dataset.l = String(level(state.time[dayKey()] || 0));
}

/* ============================================================
   数据的导出 / 导入 / 清空
   ============================================================ */
function exportData() {
  const payload = {
    app: 'python-learning-path',
    version: 4,
    exportedAt: new Date().toISOString(),
    state: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'python学习记录-' + dayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('学习记录已导出');
}

/* 导入用合并语义：进度取并集，同一天时长取较大值，复习档期取"走得更远"的那份，
   免得重复导入把已经排到 21 天后的题又拉回今天。 */
function mergeState(inc) {
  const asMap = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  let added = 0;
  ['done', 'miles'].forEach(k => {
    const m = asMap(inc[k]);
    Object.keys(m).forEach(x => { if (m[x] && !state[k][x]) { state[k][x] = 1; added++; } });
  });
  // 标记表的合并一律「取值更高者胜」：1（已完成）> -1（还欠着）> 缺省。
  // 不能只判断真值——-1 也是真值，那样一份「卡住」的备份会把「已完成」覆盖掉。
  const rank = v => { const n = +v; return n === 1 ? 2 : n === -1 ? 1 : 0; };
  ['ex', 'hw'].forEach(k => {
    const m = asMap(inc[k]);
    Object.keys(m).forEach(x => {
      const r = rank(m[x]);
      if (!r) return;
      if (rank(state[k][x]) < r) { state[k][x] = +m[x]; added++; }
    });
  });
  const tm = asMap(inc.time);
  Object.keys(tm).forEach(x => { const v = +tm[x] || 0; if (v > (state.time[x] || 0)) state.time[x] = v; });
  // 档期只并进"两边都还欠着"的题：本地已经毕业转入已掌握的，不因为一份旧备份又被拉回复习池。
  const rv = asMap(inc.rev);
  Object.keys(rv).forEach(x => {
    if (markGet(x) !== -1) return;
    const a = asMap(rv[x]);
    const came = { l: +a.l || 0, due: String(a.due || ''), n: +a.n || 0 };
    if (!came.due) return;
    const cur = state.rev[x];
    if (!cur) { state.rev[x] = came; added++; return; }
    // 取档位更高的；档位相同时取更晚的到期日——复习进度是"走得远"的那份更可信
    if (came.l > (+cur.l || 0) || (came.l === (+cur.l || 0) && came.due > String(cur.due || ''))) {
      state.rev[x] = { l: came.l, due: came.due, n: Math.max(came.n, +cur.n || 0) };
    } else {
      cur.n = Math.max(came.n, +cur.n || 0);
    }
  });
  if (!state.theme && inc.theme) state.theme = inc.theme;
  return added;
}

function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let inc = null;
    try {
      const obj = JSON.parse(String(fr.result));
      inc = (obj && obj.state) ? obj.state : obj;   // 兼容裸 state 的旧文件
      if (!inc || typeof inc !== 'object' || Array.isArray(inc)) throw new Error('shape');
    } catch (e) { toast('导入失败：这个文件不是学习记录'); return; }
    const added = mergeState(inc);
    sweepRev();                                     // 并进来的错题若没有档期，就地补齐
    saveNow();
    render();
    refreshProgress();
    refreshReviewBadge();
    toast(added ? `导入完成 · 合并新增 ${added} 项进度` : '导入完成 · 没有新内容需要合并');
  };
  fr.onerror = () => toast('导入失败：文件读不出来');
  fr.readAsText(file, 'utf-8');
}

function clearAll() {
  const theme = state.theme;
  state = STATE_DEFAULT();
  state.theme = theme;
  rvSession = null;                 // 正在走的复习也一并结束，别留个指向空数据的会话
  try { localStorage.removeItem(KEY); } catch (e) {}
  saveNow();
  render();
  refreshProgress();
  refreshReviewBadge();
  toast('已清空全部学习记录');
}

let clrArmId = null;
function bindData() {
  clearTimeout(clrArmId);
  const exp = $('#expBtn'), imp = $('#impBtn'), clr = $('#clrBtn'), file = $('#impFile');
  if (exp) exp.addEventListener('click', exportData);
  if (imp && file) {
    imp.addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (f) importData(f);
      file.value = '';
    });
  }
  if (clr) {
    const orig = clr.innerHTML;
    clr.addEventListener('click', () => {
      // 清空不可撤销，做成两段式：第一次只是「上膛」，第二次才真的执行
      if (clr.dataset.arm !== '1') {
        clr.dataset.arm = '1';
        clr.innerHTML = '再点一次确认清空';
        toast('这会删掉全部进度与学习记录');
        clrArmId = setTimeout(() => {
          const b = $('#clrBtn');
          if (b) { b.dataset.arm = '0'; b.innerHTML = orig; }
        }, 5000);
        return;
      }
      clearTimeout(clrArmId);
      clearAll();
    });
  }
}

/* 错题本的页签、开复习、自评，以及自测的各种动作：统一在容器上代理，
   避免每次重渲染都要重新绑一遍事件 */
$('#contentRoot').addEventListener('click', e => {
  /* ---- 自测 ---- */
  const seg = e.target.closest('.qz-seg-b');
  if (seg) {
    if (seg.dataset.qzSize) qzSetup.size = +seg.dataset.qzSize;
    if (seg.dataset.qzSrc) qzSetup.source = seg.dataset.qzSrc;
    renderQuiz();
    return;
  }
  if (e.target.closest('#qzStart') || e.target.closest('#qzAgain')) { startQuiz(); return; }
  if (e.target.closest('#qzReveal')) { qzReveal(); return; }
  const qr = e.target.closest('[data-qz-rate]');
  if (qr) { qzRate(+qr.dataset.qzRate === 1); return; }
  if (e.target.closest('#qzSkip')) { qzSkip(); return; }
  if (e.target.closest('#qzQuit')) { qzQuit(); return; }
  const quit = e.target.closest('[data-qz-quit]');
  if (quit) {
    // 收起本轮，回到设置页；已经站在 #/quiz 上时 hash 不会变，得手动重渲染
    qzSession = null; qzRevealed = false;
    const to = (quit.getAttribute('href') || '').replace(/^#\/?/, '');
    if (to === getRoute()) { e.preventDefault(); render(); }
    return;
  }

  /* ---- 选方向页：`#dir_a` 这种"跳到某方向并就地展开"的一次性口令 ---- */
  const dirj = e.target.closest('[data-dirjump], a[href^="#dir_"]');
  if (dirj) {
    const letter = dirj.dataset.dirjump ||
      String(dirj.getAttribute('href')).replace(/^#dir_/, '');
    if (letter) { e.preventDefault(); goDir(letter); return; }
  }

  /* ---- 错题本 ---- */
  const tab = e.target.closest('.tab[data-tab]');
  if (tab) { rvTab = tab.dataset.tab; renderReview(); return; }
  if (e.target.closest('#rvStart')) { startReview(); return; }
  const jump = e.target.closest('[data-jump]');
  if (jump) { pendingEx = jump.dataset.jump; return; }   // 让默认的 hash 跳转继续
  const rb = e.target.closest('.rate-btn[data-ex]');
  if (!rb) return;
  const id = rb.dataset.ex;
  // 错题本里的按钮是判定，不是开关——见 rateEx 的注释
  const r = rateEx(id, +rb.dataset.m, true);
  renderReview();
  afterRate(id, r);
});
