003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">9.9\u003c/span>         \u003cspan class=\"c1\"># float\u003c/span>\n\u003cspan class=\"n\">name\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"小明\"\u003c/span>        \u003cspan class=\"c1\"># str\u003c/span>\n\u003cspan class=\"n\">is_vip\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"kc\">True\u003c/span>       \u003cspan class=\"c1\"># bool\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">type\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">price\u003c/span>\u003cspan class=\"p\">))\u003c/span>                 \u003cspan class=\"c1\"># &lt;class 'float'&gt;\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"123\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">)\u003c/span>              \u003cspan class=\"c1\"># 124\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"我今年 \"\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">age\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"s2\">\" 岁\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"c1\"># 字符串只能拼接字符串\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mf\">0.1\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mf\">0.2\u003c/span>\u003cspan class=\"p\">)\u003c/span>                   \u003cspan class=\"c1\"># 0.30000000000000004\u003c/span>\n\n\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">b\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\n\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">b\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">a\u003c/span>                        \u003cspan class=\"c1\"># Python 特色的交换变量\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">)\u003c/span>                        \u003cspan class=\"c1\"># 2 1\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：BMI 计算器\u003c/h4>\n\u003cp>身高 1.75 米、体重 68 公斤，输出 BMI（体重 ÷ 身高²），保留 1 位小数。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">height\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">1.75\u003c/span>\n\u003cspan class=\"n\">weight\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">68\u003c/span>\n\u003cspan class=\"n\">bmi\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">weight\u003c/span> \u003cspan class=\"o\">/\u003c/span> \u003cspan class=\"n\">height\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"BMI =\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"nb\">round\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">bmi\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">))\u003c/span>      \u003cspan class=\"c1\"># 22.2\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>**\u003c/code> 是乘方，优先级高于 \u003ccode>/\u003c/code>，所以 \u003ccode>height ** 2\u003c/code> 不用加括号；\u003ccode>round(x, n)\u003c/code> 四舍五入到 n 位。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：找出隐藏的 bug\u003c/h4>\n\u003cp>下面这段代码一运行就会报错。先自己找是哪一行、为什么，再看解析。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">num\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"请输入一个数字：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>     \u003cspan class=\"c1\"># 用户输入了 5\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">num\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>input()\u003c/code> 返回的\u003cstrong>永远是字符串\u003c/strong>，\u003ccode>\"5\" + 10\u003c/code> 会抛 \u003ccode>TypeError\u003c/code>。正确写法：\u003ccode>num = int(input(\"请输入一个数字：\"))\u003c/code>。这个坑 90% 的新手都会踩，现在记住它。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用变量保存一本书的书名、价格、页数、是否有电子版，逐行打印\"值 + 类型\"。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入你的年龄，按一年 365 天算出你至少活了多少天。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>输入一个总秒数（如 10000），输出\"X 小时 Y 分 Z 秒\"。（提示：\u003ccode>//\u003c/code> 整除、\u003ccode>%\u003c/code> 取余）\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>验证 \u003ccode>0.1 + 0.2 != 0.3\u003c/code> 成立，再用 \u003ccode>round()\u003c/code> 让等式判断变成 True。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>输入人民币金额（如 1234.56），拆解成\"X 张 100 元、Y 张 50 元……\"直到 1 角。\u003c/li>\n\u003c/ol>","counts":{"kp":5,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 变量 = 给数据贴的标签： name = \"小明\" 。赋值即创建，之后还能换成别的类型的值（动态类型）。 四大基本类型： int 整数、 float 小数、 str 字符串、 bool 布尔（ True / False 首字母必须大写）。 type(x) 查看类型；类型转换： int(\"123\") 、 float(\"3.14\") 、 str(100) 。 命名规范：小写字母 + 下划线（ user_name ），见名知义；不能以数字开头，不能用关键字（ if 、 for 、 class …）。 两个经典坑：浮点误差 0.1 + 0.2 == 0.30000000000000004 ；字符串和数字不能直接相加。 💡 例题 例题 1：BMI 计算器 身高 1.75 米、体重 68 公斤，输出 BMI（体重 ÷ 身高²），保留 1 位小数。 参考答案 解析 ** 是乘方，优先级高于 / ，所以 height ** 2 不用加括号； round(x, n) 四舍五入到 n 位。 例题 2：找出隐藏的 bug 下面这段代码一运行就会报错。先自己找是哪一行、为什么，再看解析。 参考答案 解析 input() 返回的 永远是字符串 ， \"5\" + 10 会抛 TypeError 。正确写法： num = int(input(\"请输入一个数字：\")) 。这个坑 90% 的新手都会踩，现在记住它。 ✏️ 作业 基础 用变量保存一本书的书名、价格、页数、是否有电子版，逐行打印\"值 + 类型\"。 基础 输入你的年龄，按一年 365 天算出你至少活了多少天。 进阶 输入一个总秒数（如 10000），输出\"X 小时 Y 分 Z 秒\"。（提示： // 整除、 % 取余） 进阶 验证 0.1 + 0.2 != 0.3 成立，再用 round() 让等式判断变成 True。 挑战 输入人民币金额（如 1234.56），拆解成\"X 张 100 元、Y 张 50 元……\"直到 1 角。"},{"id":"s1-l3","kind":"lesson","no":3,"title":"运算符与格式化输出","time":"3 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>算术运算符：\u003ccode>+ - * /\u003c/code>（真除法，结果是 float）、\u003ccode>//\u003c/code>（整除取商）、\u003ccode>%\u003c/code>（取余数）、\u003ccode>**\u003c/code>（乘方）。\u003c/li>\n\u003cli>比较运算符返回 bool：\u003ccode>== != &gt; &lt; &gt;= &lt;=\u003c/code>；支持连写：\u003ccode>0 &lt;= x &lt;= 100\u003c/code>。\u003c/li>\n\u003cli>逻辑运算符：\u003ccode>and\u003c/code>（都真才真）、\u003ccode>or\u003c/code>（一真即真）、\u003ccode>not\u003c/code>（取反）。\u003c/li>\n\u003cli>优先级：\u003ccode>**\u003c/code> &gt; \u003ccode>* / // %\u003c/code> &gt; \u003ccode>+ -\u003c/code> &gt; 比较 &gt; \u003ccode>not\u003c/code> &gt; \u003ccode>and\u003c/code> &gt; \u003ccode>or\u003c/code>。记不住就\u003cstrong>加括号\u003c/strong>。\u003c/li>\n\u003cli>f-string 是最好用的格式化方式：\u003ccode>f\"名字是{name}\"\u003c/code>，还能控制格式：\u003ccode>{x:.2f}\u003c/code> 保留 2 位、\u003ccode>{n:&gt;8}\u003c/code> 右对齐占 8 格、\u003ccode>{n:,}\u003c/code> 千分位。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">name\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"abc\"\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">7\u003c/span> \u003cspan class=\"o\">/\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">7\u003c/span> \u003cspan class=\"o\">//\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">7\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">)\u003c/span>   \u003cspan class=\"c1\"># 3.5 3 1 1024\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">5\u003c/span> \u003cspan class=\"ow\">and\u003c/span> \u003cspan class=\"mi\">5\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">)\u003c/span>                 \u003cspan class=\"c1\"># False\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">))\u003c/span>                     \u003cspan class=\"c1\"># False\u003c/span>\n\n\u003cspan class=\"n\">pi\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">3.14159\u003c/span>\n\u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">1234567.891\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"pi ≈ \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">pi\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.2f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>     \u003cspan class=\"c1\"># pi ≈ 3.14\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">,.2f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>          \u003cspan class=\"c1\"># 1,234,567.89\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"[\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">&gt;10\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">]\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>      \u003cspan class=\"c1\"># [       abc]（右对齐）\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"[\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">^10\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">]\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>      \u003cspan class=\"c1\"># [   abc    ]（居中）\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：购物小票\u003c/h4>\n\u003cp>单价 3.5 元、数量 4、会员 8 折，输出格式化小票：单价保留 2 位、实付带千分位。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">price\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">count\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">discount\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">3.5\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mf\">0.8\u003c/span>\n\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">price\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">discount\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"单价：\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">price\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.2f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 元\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"数量：\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">count\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"实付：\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">,.2f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 元\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>     \u003cspan class=\"c1\"># 实付：11.20 元\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>:,.2f\u003c/code> = 千分位 + 2 位小数，一个占位符同时干两件事。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：复利计算\u003c/h4>\n\u003cp>本金 10000 元、年利率 3.5%，输入存几年 n，输出到期本息（复利公式：本金 × (1+r)^n）。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">p\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">r\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">10000\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mf\">0.035\u003c/span>\n\u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"存几年：\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">p\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"n\">n\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 年后本息合计：\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">,.2f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 元\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>(1 + r)\u003c/code> 必须加括号，否则 \u003ccode>r ** n\u003c/code> 会先算（优先级）。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入摄氏度，输出华氏度（F = C × 9/5 + 32），保留 1 位。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入两个整数，输出它们的和、差、积、真除法商、整除商、余数。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>不运行代码，先心算 \u003ccode>2 + 3 * 2 ** 2 / 4\u003c/code> 的值，再运行验证（想想结果为什么是 float）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>鸡兔同笼：输入总头数 a、总脚数 b，输出鸡兔各几只；无解时输出\"无解\"。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>海伦公式三角形面积计算器：输入三边，先判断能否构成三角形（任意两边之和大于第三边），再算面积（提示：\u003ccode>** 0.5\u003c/code> 开平方）。\u003c/li>\n\u003c/ol>","counts":{"kp":5,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 算术运算符： + - * / （真除法，结果是 float）、 // （整除取商）、 % （取余数）、 ** （乘方）。 比较运算符返回 bool： == != &gt; &lt; &gt;= &lt;= ；支持连写： 0 &lt;= x &lt;= 100 。 逻辑运算符： and （都真才真）、 or （一真即真）、 not （取反）。 优先级： ** &gt; * / // % &gt; + - &gt; 比较 &gt; not &gt; and &gt; or 。记不住就 加括号 。 f-string 是最好用的格式化方式： f\"名字是{name}\" ，还能控制格式： {x:.2f} 保留 2 位、 {n:&gt;8} 右对齐占 8 格、 {n:,} 千分位。 💡 例题 例题 1：购物小票 单价 3.5 元、数量 4、会员 8 折，输出格式化小票：单价保留 2 位、实付带千分位。 参考答案 解析 :,.2f = 千分位 + 2 位小数，一个占位符同时干两件事。 例题 2：复利计算 本金 10000 元、年利率 3.5%，输入存几年 n，输出到期本息（复利公式：本金 × (1+r)^n）。 参考答案 解析 (1 + r) 必须加括号，否则 r ** n 会先算（优先级）。 ✏️ 作业 基础 输入摄氏度，输出华氏度（F = C × 9/5 + 32），保留 1 位。 基础 输入两个整数，输出它们的和、差、积、真除法商、整除商、余数。 基础 不运行代码，先心算 2 + 3 * 2 ** 2 / 4 的值，再运行验证（想想结果为什么是 float）。 进阶 鸡兔同笼：输入总头数 a、总脚数 b，输出鸡兔各几只；无解时输出\"无解\"。 挑战 海伦公式三角形面积计算器：输入三边，先判断能否构成三角形（任意两边之和大于第三边），再算面积（提示： ** 0.5 开平方）。"},{"id":"s1-l4","kind":"lesson","no":4,"title":"字符串详解","time":"3–4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>索引从 0 开始；\u003ccode>s[-1]\u003c/code> 是最后一个字符。\u003c/li>\n\u003cli>切片 \u003ccode>s[start:end:step]\u003c/code>：\u003cstrong>含头不含尾\u003c/strong>；\u003ccode>s[:5]\u003c/code> 前 5 个；\u003ccode>s[::-1]\u003c/code> 反转。\u003c/li>\n\u003cli>常用方法：\u003ccode>len(s)\u003c/code>、\u003ccode>s.strip()\u003c/code> 去两端空白、\u003ccode>s.split()\u003c/code> 切分成列表、\u003ccode>\"-\".join(列表)\u003c/code> 拼接、\u003ccode>s.replace(a, b)\u003c/code> 替换、\u003ccode>s.find(x)\u003c/code> 查位置（找不到返回 -1）、\u003ccode>s.count(x)\u003c/code> 计数、\u003ccode>s.upper()/lower()\u003c/code> 大小写。\u003c/li>\n\u003cli>成员判断 \u003ccode>\"py\" in s\u003c/code>；遍历 \u003ccode>for ch in s:\u003c/code>。\u003c/li>\n\u003cli>字符与编码：\u003ccode>ord(\"A\")\u003c/code> → 65，\u003ccode>chr(65)\u003c/code> → \"A\"（挑战题要用）。\u003c/li>\n\u003cli>字符串\u003cstrong>不可变\u003c/strong>：所有方法都返回新字符串，原字符串不变。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"Hello, Python\"\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">7\u003c/span>\u003cspan class=\"p\">:])\u003c/span>          \u003cspan class=\"c1\"># H n Python\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">[::\u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">])\u003c/span>                     \u003cspan class=\"c1\"># nohtyP ,olleH\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">split\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\", \"\u003c/span>\u003cspan class=\"p\">))\u003c/span>               \u003cspan class=\"c1\"># ['Hello', 'Python']\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"-\"\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">join\u003c/span>\u003cspan class=\"p\">([\u003c/span>\u003cspan class=\"s2\">\"2026\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"09\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"13\"\u003c/span>\u003cspan class=\"p\">]))\u003c/span>   \u003cspan class=\"c1\"># 2026-09-13\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">replace\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"Python\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"World\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"s2\">\"Py\"\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">)\u003c/span>           \u003cspan class=\"c1\"># 13 True\u003c/span>\n\n\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">score\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"xiaoming\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mf\">92.567\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">=^12\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.1f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>  \u003cspan class=\"c1\"># ==xiaoming== 92.6\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：回文判断\u003c/h4>\n\u003cp>输入一个字符串，判断正读反读是否一样（如 level）。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"输入字符串：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">strip\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">[::\u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"是回文\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"不是回文\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>核心就是 \u003ccode>s[::-1]\u003c/code> 反转切片。进阶版：先 \u003ccode>s.lower()\u003c/code> 并去掉空格再比。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：解析文件名\u003c/h4>\n\u003cp>输入 \u003ccode>\"report.2026.final.pdf\"\u003c/code>，分别输出主文件名和扩展名。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">filename\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"report.2026.final.pdf\"\u003c/span>\n\u003cspan class=\"n\">dot\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">filename\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">rfind\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\".\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>          \u003cspan class=\"c1\"># rfind 从右侧找，拿到最后一个点\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"主文件名:\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">filename\u003c/span>\u003cspan class=\"p\">[:\u003c/span>\u003cspan class=\"n\">dot\u003c/span>\u003cspan class=\"p\">])\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"扩展名:\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">filename\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">dot\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">:])\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>用 \u003ccode>find\u003c/code> 找第一个点就错了——要从右往左找。也可以用 \u003ccode>filename.rsplit(\".\", 1)\u003c/code>。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入一句英文，统计其中单词个数（提示：\u003ccode>split()\u003c/code> 不给参数时按任意空白切，多空格也不怕）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入一个 18 位身份证号，输出出生年月日（第 7–14 位是生日）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>把英文句子里每个单词改成\"首字母大写、其余小写\"后输出（\u003cstrong>自己写逻辑\u003c/strong>，不用 \u003ccode>title()\u003c/code>——想想它为什么会把 \u003ccode>don't\u003c/code> 变成 \u003ccode>Don'T\u003c/code>）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>判断两个词是否\"变位词\"（字母相同顺序不同，如 listen / silent）。提示：\u003ccode>sorted(\"listen\")\u003c/code> 返回什么？\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>凯撒加密：输入明文和偏移量 k，把每个字母在字母表后移 k 位输出。\n   提示：小写字母可用 \u003ccode>chr((ord(c) - 97 + k) % 26 + 97)\u003c/code>。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 索引从 0 开始； s[-1] 是最后一个字符。 切片 s[start:end:step] ： 含头不含尾 ； s[:5] 前 5 个； s[::-1] 反转。 常用方法： len(s) 、 s.strip() 去两端空白、 s.split() 切分成列表、 \"-\".join(列表) 拼接、 s.replace(a, b) 替换、 s.find(x) 查位置（找不到返回 -1）、 s.count(x) 计数、 s.upper()/lower() 大小写。 成员判断 \"py\" in s ；遍历 for ch in s: 。 字符与编码： ord(\"A\") → 65， chr(65) → \"A\"（挑战题要用）。 字符串 不可变 ：所有方法都返回新字符串，原字符串不变。 💡 例题 例题 1：回文判断 输入一个字符串，判断正读反读是否一样（如 level）。 参考答案 解析 核心就是 s[::-1] 反转切片。进阶版：先 s.lower() 并去掉空格再比。 例题 2：解析文件名 输入 \"report.2026.final.pdf\" ，分别输出主文件名和扩展名。 参考答案 解析 用 find 找第一个点就错了——要从右往左找。也可以用 filename.rsplit(\".\", 1) 。 ✏️ 作业 基础 输入一句英文，统计其中单词个数（提示： split() 不给参数时按任意空白切，多空格也不怕）。 基础 输入一个 18 位身份证号，输出出生年月日（第 7–14 位是生日）。 进阶 把英文句子里每个单词改成\"首字母大写、其余小写\"后输出（ 自己写逻辑 ，不用 title() ——想想它为什么会把 don't 变成 Don'T ）。 进阶 判断两个词是否\"变位词\"（字母相同顺序不同，如 listen / silent）。提示： sorted(\"listen\") 返回什么？ 挑战 凯撒加密：输入明文和偏移量 k，把每个字母在字母表后移 k 位输出。 提示：小写字母可用 chr((ord(c) - 97 + k) % 26 + 97) 。"},{"id":"s1-l5","kind":"lesson","no":5,"title":"条件判断","time":"3 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>完整结构：\u003ccode>if ... elif ... else\u003c/code>，条件后加冒号，分支体缩进 4 格。\u003c/li>\n\u003cli>条件本质是 bool；空串 \u003ccode>\"\"\u003c/code>、\u003ccode>0\u003c/code>、\u003ccode>None\u003c/code>、空列表 \u003ccode>[]\u003c/code> 都算 False（真值测试）。\u003c/li>\n\u003cli>逻辑组合 \u003ccode>and/or/not\u003c/code>；比较可连写 \u003ccode>if 18 &lt;= age &lt; 60:\u003c/code>。\u003c/li>\n\u003cli>三元表达式：\u003ccode>level = \"及格\" if score &gt;= 60 else \"不及格\"\u003c/code>。\u003c/li>\n\u003cli>写好条件的习惯：特殊/异常情况放在最前面处理；避免嵌套超过两层。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">score\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">86\u003c/span>\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">score\u003c/span> \u003cspan class=\"o\">&gt;=\u003c/span> \u003cspan class=\"mi\">90\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">grade\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"A\"\u003c/span>\n\u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">score\u003c/span> \u003cspan class=\"o\">&gt;=\u003c/span> \u003cspan class=\"mi\">80\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">grade\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"B\"\u003c/span>\n\u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">score\u003c/span> \u003cspan class=\"o\">&gt;=\u003c/span> \u003cspan class=\"mi\">60\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">grade\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"C\"\u003c/span>\n\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">grade\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"D\"\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">grade\u003c/span>\u003cspan class=\"p\">)\u003c/span>                    \u003cspan class=\"c1\"># B\u003c/span>\n\n\u003cspan class=\"n\">age\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">20\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"成年\"\u003c/span> \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">age\u003c/span> \u003cspan class=\"o\">&gt;=\u003c/span> \u003cspan class=\"mi\">18\u003c/span> \u003cspan class=\"k\">else\u003c/span> \u003cspan class=\"s2\">\"未成年\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"n\">name\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"\"\u003c/span>\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span>                    \u003cspan class=\"c1\"># 用真值测试代替 name == \"\"\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"名字不能为空\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：BMI 分级（衔接第 2 课）\u003c/h4>\n\u003cp>输入身高体重，输出 BMI 及分级：&lt;18.5 偏瘦，&lt;24 正常，&lt;28 偏胖，≥28 肥胖。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">h\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"身高(米)：\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"n\">w\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"体重(kg)：\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"n\">bmi\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">w\u003c/span> \u003cspan class=\"o\">/\u003c/span> \u003cspan class=\"n\">h\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">bmi\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mf\">18.5\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">level\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"偏瘦\"\u003c/span>\n\u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">bmi\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">24\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">level\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"正常\"\u003c/span>\n\u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">bmi\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">28\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">level\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"偏胖\"\u003c/span>\n\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">level\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"肥胖\"\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"BMI=\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">bmi\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.1f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">，属于\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">level\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>elif\u003c/code> 从上往下命中即停，范围天然互斥，不用写 \u003ccode>18.5 &lt;= bmi &lt; 24\u003c/code>。注意范围要\u003cstrong>从小到大（或从大到小）排列\u003c/strong>，乱序会出 bug。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：闰年判断\u003c/h4>\n\u003cp>能被 4 整除但不能被 100 整除，或能被 400 整除，是闰年。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">year\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"年份：\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">year\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">4\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">0\u003c/span> \u003cspan class=\"ow\">and\u003c/span> \u003cspan class=\"n\">year\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">100\u003c/span> \u003cspan class=\"o\">!=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"ow\">or\u003c/span> \u003cspan class=\"n\">year\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">400\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"闰年\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"平年\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>and\u003c/code> 优先级高于 \u003ccode>or\u003c/code>，这里恰好符合语义，但\u003cstrong>括号写清楚永远不吃亏\u003c/strong>。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入一个数，输出\"正数/负数/零\"；如果是偶数再补一句\"它是偶数\"。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入三个数，\u003cstrong>不用 \u003ccode>max()\u003c/code>\u003c/strong> 找出最大值。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>简易计算器：输入如 \u003ccode>3 * 4\u003c/code>（空格分隔），输出结果；除数为 0 或运算符非法要给提示。（提示：\u003ccode>split()\u003c/code>）\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>输入月份，输出该月天数（2 月按 28 天算）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>输入三角形三边：先判断能否构成三角形，再判断是等边、等腰还是一般三角形。\u003c/li>\n\u003c/ol>","counts":{"kp":5,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 完整结构： if ... elif ... else ，条件后加冒号，分支体缩进 4 格。 条件本质是 bool；空串 \"\" 、 0 、 None 、空列表 [] 都算 False（真值测试）。 逻辑组合 and/or/not ；比较可连写 if 18 &lt;= age &lt; 60: 。 三元表达式： level = \"及格\" if score &gt;= 60 else \"不及格\" 。 写好条件的习惯：特殊/异常情况放在最前面处理；避免嵌套超过两层。 💡 例题 例题 1：BMI 分级（衔接第 2 课） 输入身高体重，输出 BMI 及分级：&lt;18.5 偏瘦，&lt;24 正常，&lt;28 偏胖，≥28 肥胖。 参考答案 解析 elif 从上往下命中即停，范围天然互斥，不用写 18.5 &lt;= bmi &lt; 24 。注意范围要 从小到大（或从大到小）排列 ，乱序会出 bug。 例题 2：闰年判断 能被 4 整除但不能被 100 整除，或能被 400 整除，是闰年。 参考答案 解析 and 优先级高于 or ，这里恰好符合语义，但 括号写清楚永远不吃亏 。 ✏️ 作业 基础 输入一个数，输出\"正数/负数/零\"；如果是偶数再补一句\"它是偶数\"。 基础 输入三个数， 不用 max() 找出最大值。 进阶 简易计算器：输入如 3 * 4 （空格分隔），输出结果；除数为 0 或运算符非法要给提示。（提示： split() ） 进阶 输入月份，输出该月天数（2 月按 28 天算）。 挑战 输入三角形三边：先判断能否构成三角形，再判断是等边、等腰还是一般三角形。"},{"id":"s1-l6","kind":"lesson","no":6,"title":"循环","time":"4–5 小时（重点课，多花时间）","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>\u003ccode>while 条件:\u003c/code> —— 不知道循环几次时用；小心死循环（条件永远为真且没有 break）。\u003c/li>\n\u003cli>\u003ccode>for i in range(start, stop, step):\u003c/code> —— 已知次数时用；含头不含尾。\u003c/li>\n\u003cli>\u003ccode>break\u003c/code> 立即跳出\u003cstrong>整个\u003c/strong>循环；\u003ccode>continue\u003c/code> 跳过本次，进入下一轮。\u003c/li>\n\u003cli>循环 \u003ccode>else\u003c/code>：循环\u003cstrong>没被 break 打断\u003c/strong>时执行（\"找了一圈没找到\"场景很优雅）。\u003c/li>\n\u003cli>嵌套循环：外层走一步，内层走完一整遍。\u003c/li>\n\u003cli>\u003ccode>enumerate(序列)\u003c/code> 同时拿到序号和元素。\u003c/li>\n\u003cli>三大经典模式：\u003cstrong>累加\u003c/strong>（\u003ccode>total += x\u003c/code>）、\u003cstrong>计数\u003c/strong>（\u003ccode>count += 1\u003c/code>）、\u003cstrong>求最值\u003c/strong>（\u003ccode>if x &gt; best: best = x\u003c/code>）。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">101\u003c/span>\u003cspan class=\"p\">):\u003c/span>        \u003cspan class=\"c1\"># 1..100\u003c/span>\n    \u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"n\">i\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">total\u003c/span>\u003cspan class=\"p\">)\u003c/span>                   \u003cspan class=\"c1\"># 5050\u003c/span>\n\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">ch\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">enumerate\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"abc\"\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">ch\u003c/span>\u003cspan class=\"p\">)\u003c/span>               \u003cspan class=\"c1\"># 0 a / 1 b / 2 c\u003c/span>\n\n\u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\n\u003cspan class=\"k\">while\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">:\u003c/span>                    \u003cspan class=\"c1\"># \"反复直到成功\"的标准写法：死循环 + break\u003c/span>\n    \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">13\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">break\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">9\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">2\u003c/span> \u003cspan class=\"o\">!=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">continue\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">)\u003c/span>                   \u003cspan class=\"c1\"># 2 4\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：九九乘法表\u003c/h4>\n\u003cp>用两层循环打印 1–9 的乘法表，第 i 行就排 i 个式子。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">j\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">j\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">×\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">=\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">j\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">&lt;4\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">end\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>   \u003cspan class=\"c1\"># end=\"\" 不换行；:&lt;4 左对齐占4格\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">()\u003c/span>                                  \u003cspan class=\"c1\"># 内层结束，手动换行\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>观察规律——第 i 行有 i 个式子，所以内层是 \u003ccode>range(1, i + 1)\u003c/code>。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：猜数字游戏（雏形）\u003c/h4>\n\u003cp>程序随机生成 1–100 的数，用户反复猜，提示\"大了/小了\"，猜中后显示次数。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">random\u003c/span>\n\u003cspan class=\"n\">answer\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">randint\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">100\u003c/span>\u003cspan class=\"p\">)\u003c/span>   \u003cspan class=\"c1\"># 两端都包含\u003c/span>\n\u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\n\u003cspan class=\"k\">while\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">guess\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"猜：\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">guess\u003c/span> \u003cspan class=\"o\">&gt;\u003c/span> \u003cspan class=\"n\">answer\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"大了\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">guess\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"n\">answer\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小了\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">else\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"对了！用了 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">count\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 次\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">break\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>while True + break\u003c/code> 是交互式程序的骨架；\u003ccode>random.randint(1, 100)\u003c/code> 生成 1 到 100 的随机整数。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 while 求 1! + 2! + … + 10!（阶乘之和）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>不断输入数字，直到输入 \u003ccode>q\u003c/code> 为止，输出个数、总和、平均分（一个有效数字都没有时要提示）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入层数 n，打印星号金字塔：\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"text\">\u003cpre>\u003ccode>  *\n ***\n*****\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cp>提示：每行 = 空格 + 星号，数量和行号的关系自己推。\n4. \u003cspan class=\"badge b-adv\">进阶\u003c/span>找出 100–999 中所有水仙花数（各位数字的立方和等于它自己，如 153）。\n5. \u003cspan class=\"badge b-adv\">进阶\u003c/span>输入两个正整数，输出最大公约数。提示：从两者中较小的往下穷举，找到就 break；或查\"辗转相除法\"。\n6. \u003cspan class=\"badge b-chal\">挑战\u003c/span>打印 100 以内所有素数，每行 5 个。建议先写\"判断单个数是否素数\"的循环，再套外层。\u003c/p>","counts":{"kp":7,"ex":2,"hw":3,"points":0,"codes":4,"answers":2},"text":"📚 知识点 while 条件: —— 不知道循环几次时用；小心死循环（条件永远为真且没有 break）。 for i in range(start, stop, step): —— 已知次数时用；含头不含尾。 break 立即跳出 整个 循环； continue 跳过本次，进入下一轮。 循环 else ：循环 没被 break 打断 时执行（\"找了一圈没找到\"场景很优雅）。 嵌套循环：外层走一步，内层走完一整遍。 enumerate(序列) 同时拿到序号和元素。 三大经典模式： 累加 （ total += x ）、 计数 （ count += 1 ）、 求最值 （ if x &gt; best: best = x ）。 💡 例题 例题 1：九九乘法表 用两层循环打印 1–9 的乘法表，第 i 行就排 i 个式子。 参考答案 解析 观察规律——第 i 行有 i 个式子，所以内层是 range(1, i + 1) 。 例题 2：猜数字游戏（雏形） 程序随机生成 1–100 的数，用户反复猜，提示\"大了/小了\"，猜中后显示次数。 参考答案 解析 while True + break 是交互式程序的骨架； random.randint(1, 100) 生成 1 到 100 的随机整数。 ✏️ 作业 基础 用 while 求 1! + 2! + … + 10!（阶乘之和）。 基础 不断输入数字，直到输入 q 为止，输出个数、总和、平均分（一个有效数字都没有时要提示）。 基础 输入层数 n，打印星号金字塔： 提示：每行 = 空格 + 星号，数量和行号的关系自己推。 4. 进阶 找出 100–999 中所有水仙花数（各位数字的立方和等于它自己，如 153）。 5. 进阶 输入两个正整数，输出最大公约数。提示：从两者中较小的往下穷举，找到就 break；或查\"辗转相除法\"。 6. 挑战 打印 100 以内所有素数，每行 5 个。建议先写\"判断单个数是否素数\"的循环，再套外层。"},{"id":"s1-l7","kind":"lesson","no":7,"title":"列表与元组","time":"4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>列表 = 有序可变的容器：\u003ccode>nums = [3, 1, 4]\u003c/code>；索引、切片和字符串完全一样。\u003c/li>\n\u003cli>增：\u003ccode>append(x)\u003c/code> 尾插、\u003ccode>insert(i, x)\u003c/code> 指定位置插、\u003ccode>extend(另一个列表)\u003c/code> 合并；删：\u003ccode>remove(x)\u003c/code> 按值删、\u003ccode>pop(i)\u003c/code> 按位置删并返回、\u003ccode>clear()\u003c/code> 清空。\u003c/li>\n\u003cli>查与统计：\u003ccode>in\u003c/code>、\u003ccode>index(x)\u003c/code>、\u003ccode>count(x)\u003c/code>、\u003ccode>len/sum/max/min\u003c/code>。\u003c/li>\n\u003cli>排序：\u003ccode>lst.sort()\u003c/code> \u003cstrong>原地修改\u003c/strong>（可加 \u003ccode>reverse=True\u003c/code>）；\u003ccode>sorted(lst)\u003c/code> 返回新列表、不动原列表。\u003c/li>\n\u003cli>复制陷阱：\u003ccode>b = a\u003c/code> 只是贴别名，改 b 连 a 一起变；真复制用 \u003ccode>a.copy()\u003c/code> 或切片 \u003ccode>a[:]\u003c/code>。\u003c/li>\n\u003cli>元组 \u003ccode>tuple\u003c/code> = 不可变的列表：\u003ccode>point = (3, 5)\u003c/code>，不能增删改，适合存\"一组固定搭配的数据\"。\u003c/li>\n\u003cli>解包：\u003ccode>x, y = point\u003c/code>；\u003ccode>a, *rest = [1, 2, 3]\u003c/code>。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">scores\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">88\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">92\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">79\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">93\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">85\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">100\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sort\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">reverse\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span>                  \u003cspan class=\"c1\"># [100, 93, 92, 88, 85, 79]\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">:\u003c/span>\u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\n\u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">b\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">a\u003c/span>                          \u003cspan class=\"c1\"># 别名！不是复制\u003c/span>\n\u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">)\u003c/span>                       \u003cspan class=\"c1\"># [1, 2, 3, 4]——a 也变了\u003c/span>\n\n\u003cspan class=\"n\">point\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">y\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">point\u003c/span>                   \u003cspan class=\"c1\"># 解包\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">y\u003c/span>\u003cspan class=\"p\">)\u003c/span>                   \u003cspan class=\"c1\"># 15\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：成绩统计\u003c/h4>\n\u003cp>成绩 \u003ccode>[78, 92, 45, 66, 88, 35, 94]\u003c/code>，输出最高分、平均分（1 位小数）、低于平均分的人数。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">scores\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">78\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">92\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">45\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">66\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">88\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">35\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">94\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">avg\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">/\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">below\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"n\">avg\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">below\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"最高 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"nb\">max\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">，平均 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">avg\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.1f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">，低于平均 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">below\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 人\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>sum / len / max\u003c/code> 是序列三件套；\u003ccode>count += 1\u003c/code> 的计数模式再次出现。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：去重但保持原顺序\u003c/h4>\n\u003cp>\u003ccode>[3, 1, 3, 2, 1, 5]\u003c/code> → \u003ccode>[3, 1, 2, 5]\u003c/code>。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">nums\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">result\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[]\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">nums\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">result\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">result\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">result\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>直接 \u003ccode>set(nums)\u003c/code> 会丢掉原顺序；\"见过的才跳过\"是保序去重的标准思路。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入 5 个成绩存入列表，输出最高分、最低分、平均分。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>把 \u003ccode>[\"张三\", \"李四\", \"王五\"]\u003c/code> 拼成 \u003ccode>\"张三、李四、王五\"\u003c/code>（提示：\u003ccode>join\u003c/code>）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>输入若干名字（空回车结束），然后输入一个名字，查询它排在第几位；查不到给友好提示而不是报错。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>找出列表 \u003ccode>[5, 3, 9, 9, 2]\u003c/code> 的\u003cstrong>第二大\u003c/strong>值（有重复时要考虑：第二大算 5 还是 9？自己定规则并说明）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>约瑟夫环：n 个人围成一圈报数，数到 3 的人出列，求最后剩下的人的编号（提示：列表 + 取模模拟，或提前查资料）。\u003c/li>\n\u003c/ol>","counts":{"kp":7,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 列表 = 有序可变的容器： nums = [3, 1, 4] ；索引、切片和字符串完全一样。 增： append(x) 尾插、 insert(i, x) 指定位置插、 extend(另一个列表) 合并；删： remove(x) 按值删、 pop(i) 按位置删并返回、 clear() 清空。 查与统计： in 、 index(x) 、 count(x) 、 len/sum/max/min 。 排序： lst.sort() 原地修改 （可加 reverse=True ）； sorted(lst) 返回新列表、不动原列表。 复制陷阱： b = a 只是贴别名，改 b 连 a 一起变；真复制用 a.copy() 或切片 a[:] 。 元组 tuple = 不可变的列表： point = (3, 5) ，不能增删改，适合存\"一组固定搭配的数据\"。 解包： x, y = point ； a, *rest = [1, 2, 3] 。 💡 例题 例题 1：成绩统计 成绩 [78, 92, 45, 66, 88, 35, 94] ，输出最高分、平均分（1 位小数）、低于平均分的人数。 参考答案 解析 sum / len / max 是序列三件套； count += 1 的计数模式再次出现。 例题 2：去重但保持原顺序 [3, 1, 3, 2, 1, 5] → [3, 1, 2, 5] 。 参考答案 解析 直接 set(nums) 会丢掉原顺序；\"见过的才跳过\"是保序去重的标准思路。 ✏️ 作业 基础 输入 5 个成绩存入列表，输出最高分、最低分、平均分。 基础 把 [\"张三\", \"李四\", \"王五\"] 拼成 \"张三、李四、王五\" （提示： join ）。 进阶 输入若干名字（空回车结束），然后输入一个名字，查询它排在第几位；查不到给友好提示而不是报错。 进阶 找出列表 [5, 3, 9, 9, 2] 的 第二大 值（有重复时要考虑：第二大算 5 还是 9？自己定规则并说明）。 挑战 约瑟夫环：n 个人围成一圈报数，数到 3 的人出列，求最后剩下的人的编号（提示：列表 + 取模模拟，或提前查资料）。"},{"id":"s1-l8","kind":"lesson","no":8,"title":"字典与集合","time":"4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>字典 = 键值对映射：\u003ccode>d = {\"name\": \"小明\", \"age\": 18}\u003c/code>；键必须是不可变类型（字符串/数字/元组）。\u003c/li>\n\u003cli>访问：\u003ccode>d[\"name\"]\u003c/code>——键不存在会 \u003ccode>KeyError\u003c/code>；\u003ccode>d.get(\"x\", 默认值)\u003c/code>——不存在不报错。\u003c/li>\n\u003cli>增改：\u003ccode>d[\"key\"] = value\u003c/code>；删：\u003ccode>d.pop(\"key\")\u003c/code>、\u003ccode>del d[\"key\"]\u003c/code>。\u003c/li>\n\u003cli>遍历：\u003ccode>for k, v in d.items():\u003c/code>（另有 \u003ccode>keys()\u003c/code> / \u003ccode>values()\u003c/code>）；判断键存在：\u003ccode>\"name\" in d\u003c/code>。\u003c/li>\n\u003cli>集合 \u003ccode>set\u003c/code> = 无序、不重复：\u003ccode>{1, 2, 3}\u003c/code>；\u003ccode>add/remove\u003c/code>；运算 \u003ccode>&amp;\u003c/code> 交集、\u003ccode>|\u003c/code> 并集、\u003ccode>-\u003c/code> 差集；\u003cstrong>空集合必须写 \u003ccode>set()\u003c/code>\u003c/strong>（\u003ccode>{}\u003c/code> 是空字典）。\u003c/li>\n\u003cli>选择建议：按\"名字找东西\"用字典；去重或数学集合运算用集合。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">d\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s2\">\"name\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"小明\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"age\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"mi\">18\u003c/span>\u003cspan class=\"p\">}\u003c/span>\n\u003cspan class=\"n\">d\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"city\"\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"北京\"\u003c/span>               \u003cspan class=\"c1\"># 新增\u003c/span>\n\u003cspan class=\"n\">d\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"age\"\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">19\u003c/span>                    \u003cspan class=\"c1\"># 修改\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">d\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"phone\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"未填写\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>   \u003cspan class=\"c1\"># 未填写\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">k\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">v\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">d\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">items\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">k\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"→\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">v\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">}\u003c/span>\n\u003cspan class=\"n\">b\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">}\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">&amp;\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">|\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">)\u003c/span>       \u003cspan class=\"c1\"># {3, 4} {1, 2, 3, 4, 5} {1, 2}\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">set\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"aabbbcc\"\u003c/span>\u003cspan class=\"p\">)))\u003c/span>       \u003cspan class=\"c1\"># 3——set 一行去重\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：词频统计（经典中的经典）\u003c/h4>\n\u003cp>统计 \u003ccode>\"to be or not to be\"\u003c/code> 中每个单词出现的次数。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">sentence\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"to be or not to be\"\u003c/span>\n\u003cspan class=\"n\">freq\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{}\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">word\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">sentence\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">split\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"n\">freq\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">word\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">freq\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">word\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">freq\u003c/span>\u003cspan class=\"p\">)\u003c/span>      \u003cspan class=\"c1\"># {'to': 2, 'be': 2, 'or': 1, 'not': 1}\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>freq.get(word, 0) + 1\u003c/code> 用一行同时处理\"第一次出现\"和\"已存在\"两种情况，这行代码务必吃透。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：命令行通讯录\u003c/h4>\n\u003cp>支持：\u003ccode>1 姓名 电话\u003c/code> 添加、\u003ccode>2 姓名\u003c/code> 查询、\u003ccode>3\u003c/code> 列出全部、\u003ccode>q\u003c/code> 退出。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">contacts\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{}\u003c/span>\n\u003cspan class=\"k\">while\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">cmd\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"命令(1添加 2查询 3列表 q退出)：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">strip\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">cmd\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"s2\">\"q\"\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">break\u003c/span>\n    \u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">cmd\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"s2\">\"1\"\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">_\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">phone\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"请输入 姓名 电话：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">split\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n        \u003cspan class=\"n\">contacts\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">phone\u003c/span>\n    \u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">cmd\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"s2\">\"2\"\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">name\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"要查的姓名：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">contacts\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"查无此人\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"k\">elif\u003c/span> \u003cspan class=\"n\">cmd\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"s2\">\"3\"\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">for\u003c/span> \u003cspan clas
