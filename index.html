u003cspan class=\"n\">select_one\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"p.price_color\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">text\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">title\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> — \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">price\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch4 class=\"mini-title\">练习题\u003c/h4>\n\u003col class=\"hw-list\">\n\u003cli>抓取 books.toscrape.com 列表页：书名/价格/评分入库（sqlite3）。\u003c/li>\n\u003cli>实现分页抓取 + 限流（Semaphore 或 sleep），并统计总耗时。\u003c/li>\n\u003cli>用 \u003ccode>requests.Session\u003c/code> 保持会话连续抓取多页，观察 cookie 变化。\u003c/li>\n\u003cli>进阶：用 Scrapy 重写题 1，理解 spider/item/pipeline 分层。\u003c/li>\n\u003c/ol>","counts":{"kp":0,"ex":0,"hw":4,"points":0,"codes":1,"answers":0},"text":"路线 requests + HTML 基础 → BeautifulSoup4 解析 → 数据清洗入库 → 反爬常识 → Scrapy 框架。 ⚠️ 合规红线先立 ：只抓公开数据；遵守 robots.txt 与服务条款；控制频率（sleep/信号量）；不碰需要登录的数据、不抓个人信息；商用前确认法律边界。 示例：解析练习站点 练习题 抓取 books.toscrape.com 列表页：书名/价格/评分入库（sqlite3）。 实现分页抓取 + 限流（Semaphore 或 sleep），并统计总耗时。 用 requests.Session 保持会话连续抓取多页，观察 cookie 变化。 进阶：用 Scrapy 重写题 1，理解 spider/item/pipeline 分层。"},{"id":"s4-dire","kind":"direction","no":"E","title":"AI 应用开发","time":"","html":"\u003ch4 class=\"mini-title\">路线\u003c/h4>\u003cp>调用 LLM API → 提示词工程 → 结构化输出 → RAG（检索增强）雏形 →（可选）sklearn 经典机器学习。\u003c/p>\n\u003ch4 class=\"mini-title\">示例：让模型稳定吐 JSON\u003c/h4>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">zhipuai\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">ZhipuAI\u003c/span>            \u003cspan class=\"c1\"># 任选一家大模型 SDK，套路相同\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">json\u003c/span>\n\n\u003cspan class=\"n\">client\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">ZhipuAI\u003c/span>\u003cspan class=\"p\">()\u003c/span>                     \u003cspan class=\"c1\"># API key 从环境变量读取\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">extract_contacts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">text\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"n\">resp\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">client\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">chat\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">completions\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n        \u003cspan class=\"n\">model\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"glm-4-flash\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">messages\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[{\u003c/span>\n            \u003cspan class=\"s2\">\"role\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"user\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n            \u003cspan class=\"s2\">\"content\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"从下面文本抽取联系人，只输出 JSON 数组，元素含 name/phone 字段：\u003c/span>\u003cspan class=\"se\">\\n\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">text\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"p\">}],\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">json\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">loads\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">resp\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choices\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">message\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">content\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">extract_contacts\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"今天联系张三13812345678和李四，邮箱略。\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch4 class=\"mini-title\">练习题\u003c/h4>\n\u003col class=\"hw-list\">\n\u003cli>调用一家大模型 API，做命令行对话助手（多轮对话 = 把历史消息都放进 messages；进阶做流式输出）。\u003c/li>\n\u003cli>做\"任意文本抽取联系人\"工具：模型输出 JSON → \u003ccode>json.loads\u003c/code> 解析 → 失败自动重试一次。\u003c/li>\n\u003cli>批量给 50 条评论打情感标签（正面/负面/中性），用 Counter 统计分布。\u003c/li>\n\u003cli>进阶 RAG：把自己的笔记切块 → 调 embedding 接口转向量 → 余弦相似度检索 Top3 → 拼进提问让模型作答。\u003c/li>\n\u003cli>可选：sklearn 跑通鸢尾花分类，理解\"训练 → 预测 → 评估\"三步曲。\u003c/li>\n\u003c/ol>","counts":{"kp":0,"ex":0,"hw":5,"points":0,"codes":1,"answers":0},"text":"路线 调用 LLM API → 提示词工程 → 结构化输出 → RAG（检索增强）雏形 →（可选）sklearn 经典机器学习。 示例：让模型稳定吐 JSON 练习题 调用一家大模型 API，做命令行对话助手（多轮对话 = 把历史消息都放进 messages；进阶做流式输出）。 做\"任意文本抽取联系人\"工具：模型输出 JSON → json.loads 解析 → 失败自动重试一次。 批量给 50 条评论打情感标签（正面/负面/中性），用 Counter 统计分布。 进阶 RAG：把自己的笔记切块 → 调 embedding 接口转向量 → 余弦相似度检索 Top3 → 拼进提问让模型作答。 可选：sklearn 跑通鸢尾花分类，理解\"训练 → 预测 → 评估\"三步曲。"},{"id":"s4-毕业项目-三选一","kind":"grad","no":"","title":"🎓 毕业项目（三选一）","time":"","html":"\u003cp>要求：做完整、可展示、放 GitHub。每个项目都附验收标准。\u003c/p>\n\u003ch3>① 全栈向：个人记账 Web 应用\u003c/h3>\n\u003cp>FastAPI + SQLite + 简单前端页面。功能：记录收支、分类统计、月度图表（echarts）、输入校验、部署上线。\u003c/p>\n\u003ch4 class=\"mini-title\">验收标准\u003c/h4>\n\u003col class=\"hw-list\">\n\u003cli>陌生人看 README 就能用起来\u003c/li>\n\u003cli>README 含截图与运行说明\u003c/li>\n\u003cli>至少 10 个测试用例通过\u003c/li>\n\u003c/ol>\n\u003ch3>② 数据向：招聘市场分析报告\u003c/h3>\n\u003cp>获取某岗位的招聘数据（合规来源）→ 清洗 → 分析薪资分布、技能词频、城市对比 → 生成 PDF 分析报告。\u003c/p>\n\u003ch4 class=\"mini-title\">验收标准\u003c/h4>\n\u003col class=\"hw-list\">\n\u003cli>报告有明确结论且每条结论有图表支撑\u003c/li>\n\u003cli>采集端有限流与异常处理\u003c/li>\n\u003cli>代码通过 ruff/mypy\u003c/li>\n\u003c/ol>\n\u003ch3>③ 工具向：发布一个 pip 包\u003c/h3>\n\u003cp>把阶段二/三攒的工具函数（ask_int、retry、timer 等）打包发布到 TestPyPI（或 PyPI），带文档与测试。\u003c/p>\n\u003ch4 class=\"mini-title\">验收标准\u003c/h4>\n\u003col class=\"hw-list\">\n\u003cli>\u003ccode>pip install\u003c/code> 后可正常使用\u003c/li>\n\u003cli>README 有用法示例\u003c/li>\n\u003cli>GitHub Actions 自动跑测试\u003c/li>\n\u003c/ol>","counts":{"kp":0,"ex":0,"hw":9,"points":0,"codes":0,"answers":0},"text":"要求：做完整、可展示、放 GitHub。每个项目都附验收标准。 ① 全栈向：个人记账 Web 应用 FastAPI + SQLite + 简单前端页面。功能：记录收支、分类统计、月度图表（echarts）、输入校验、部署上线。 验收标准 陌生人看 README 就能用起来 README 含截图与运行说明 至少 10 个测试用例通过 ② 数据向：招聘市场分析报告 获取某岗位的招聘数据（合规来源）→ 清洗 → 分析薪资分布、技能词频、城市对比 → 生成 PDF 分析报告。 验收标准 报告有明确结论且每条结论有图表支撑 采集端有限流与异常处理 代码通过 ruff/mypy ③ 工具向：发布一个 pip 包 把阶段二/三攒的工具函数（ask_int、retry、timer 等）打包发布到 TestPyPI（或 PyPI），带文档与测试。 验收标准 pip install 后可正常使用 README 有用法示例 GitHub Actions 自动跑测试"},{"id":"s4-附录-通用自查清单","kind":"extra","no":"","title":"附录 · 通用自查清单","time":"","html":"\u003cul>\n\u003cli>\u003cstrong>代码报错\u003c/strong>：先读报错最后一行 → 按行号定位 → 复制报错搜索/问 AI，但答案要自己重敲验证\u003c/li>\n\u003cli>\u003cstrong>学不动了\u003c/strong>：回退 2 课重做作业，比硬推进有效得多\u003c/li>\n\u003cli>\u003cstrong>查语法\u003c/strong>：官方文档 docs.python.org/zh-cn/3/；标准库先看\"有什么\"再看\"怎么用\"\u003c/li>\n\u003cli>\u003cstrong>卡住超过 1 小时\u003c/strong>：把你的代码和报错贴给 AI，让它\u003cstrong>指出方向\u003c/strong>而不是直接给答案\u003c/li>\n\u003c/ul>","counts":{"kp":0,"ex":0,"hw":0,"points":0,"codes":0,"answers":0},"text":"代码报错 ：先读报错最后一行 → 按行号定位 → 复制报错搜索/问 AI，但答案要自己重敲验证 学不动了 ：回退 2 课重做作业，比硬推进有效得多 查语法 ：官方文档 docs.python.org/zh-cn/3/；标准库先看\"有什么\"再看\"怎么用\" 卡住超过 1 小时 ：把你的代码和报错贴给 AI，让它 指出方向 而不是直接给答案"}],"project":null}],"home":[{"title":"这是什么","html":"\u003cp>一门「能自己走完」的 Python 课。比起常见的教程合集，它多做了三件事：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>每道题都有明确去处。\u003c/strong> 例题自评、作业标三态，标过「没搞定」的自动进错题本——不用自己维护一份笔记来记住哪里不会。\u003c/li>\n\u003cli>\u003cstrong>复习有排期，不靠自觉。\u003c/strong> 答对的题按 1 → 3 → 7 → 21 天滚动复习，走完 21 天算掌握，答错的明天重做。\u003c/li>\n\u003cli>\u003cstrong>每天打开就知道该干什么。\u003c/strong> 首页「今日计划」四张卡：先清欠债 → 再往前走 → 复核已掌握 → 保持节奏。\u003c/li>\n\u003c/ol>\n\u003cp>它不是「读完就完」的电子书：\u003cstrong>214 个可勾选的练习项\u003c/strong>，每一课都以动手收尾。\u003c/p>\n\u003ch3>课程规模\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>数量\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>正课\u003c/td>\n\u003ctd>24 节，分 4 个阶段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阶段项目\u003c/td>\n\u003ctd>3 个（每个阶段末尾一个，必须动手做）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>方向主线\u003c/td>\n\u003ctd>5 条，任选其一深入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>毕业作品\u003c/td>\n\u003ctd>三选一，含 9 项验收标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>知识点\u003c/td>\n\u003ctd>143 条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>例题\u003c/td>\n\u003ctd>45 道，\u003cstrong>全部带参考答案与解析\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>作业\u003c/td>\n\u003ctd>169 项，分基础 / 进阶 / 挑战三档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可勾选练习项\u003c/td>\n\u003ctd>\u003cstrong>214 个\u003c/strong>（＝ 45 道例题 + 169 项作业）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>适合谁\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>完全零基础\u003c/strong>，想要一条有始有终的路线，而不是零散视频合集。\u003c/li>\n\u003cli>\u003cstrong>自学过但没坚持下来\u003c/strong>，需要「每天都有人告诉你该做什么」这种外部约束。\u003c/li>\n\u003cli>\u003cstrong>想系统补一遍基础\u003c/strong>，尤其是文件、异常、面向对象、并发这些「知道但没亲手写过」的部分。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>不太适合\u003c/strong>：想三天速成的人；想直接要作业答案的人（作业只给思路提示，逼你自己写）；已有多年工程经验、想深入分布式或框架源码的人——这条路线走到毕业项目，约等于初级工程师的语法与工程底线。\u003c/p>"},{"title":"✨ 工作台里有什么","html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>功能\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>今日计划\u003c/strong>\u003c/td>\n\u003ctd>首页四张行动卡，各自直达该去的地方；欠债还清后自动换下一条建议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>进度追踪\u003c/strong>\u003c/td>\n\u003ctd>35 个页面、214 个练习项逐个勾选；侧栏实时显示每个阶段的完成度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>例题自评\u003c/strong>\u003c/td>\n\u003ctd>参考答案默认展开；看完自判「写对了 / 没写出来」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>作业三态\u003c/strong>\u003c/td>\n\u003ctd>已完成 / 卡住 / 未做；「卡住」的自动进错题本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>错题本\u003c/strong>\u003c/td>\n\u003ctd>只收标过「没搞定」的题，例题与作业混排、各带来源徽章\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>间隔复习\u003c/strong>\u003c/td>\n\u003ctd>1 → 3 → 7 → 21 天排期，答对升档、答错重置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>抽题自测\u003c/strong>\u003c/td>\n\u003ctd>从全部 214 个练习项随机抽，优先抽「你可能以为会了」的；可限定范围与题量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>学习记录\u003c/strong>\u003c/td>\n\u003ctd>时长统计、学习热力图、复习阶梯分布、连续学习天数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>导出 / 导入\u003c/strong>\u003c/td>\n\u003ctd>进度存在浏览器本地，可导出 JSON 备份、换设备导入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>深色模式\u003c/strong>\u003c/td>\n\u003ctd>浅 / 深两套主题；移动端与窄屏已适配\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>工作台是\u003cstrong>单个 HTML 文件\u003c/strong>：不需要服务器、不需要安装、不请求任何外部资源。双击就能用，拷进 U 盘带走也行。\u003c/p>"},{"title":"📚 课程大纲","html":"\u003ch3>阶段一 · 入门基础（第 1–8 课 · 建议 4–5 周）\u003c/h3>\n\u003cp>零基础 → 独立写出 150 行以内的命令行小程序。\u003c/p>\n\u003cp>\u003ccode>1\u003c/code> Python 初体验 · \u003ccode>2\u003c/code> 变量与数据类型 · \u003ccode>3\u003c/code> 运算符与格式化输出 · \u003ccode>4\u003c/code> 字符串详解 · \u003ccode>5\u003c/code> 条件判断 · \u003ccode>6\u003c/code> 循环 · \u003ccode>7\u003c/code> 列表与元组 · \u003ccode>8\u003c/code> 字典与集合\u003c/p>\n\u003cp>🏁 \u003cstrong>阶段项目\u003c/strong>：学生成绩管理器\u003c/p>\n\u003cp>\u003ca href=\"#/s1\">打开阶段一 →\u003c/a>\u003c/p>\n\u003ch3>阶段二 · 核心进阶（第 9–16 课 · 建议 5–6 周）\u003c/h3>\n\u003cp>从「能跑就行」到「结构清晰」——函数化 + 面向对象 + 文件持久化 + 异常处理。\u003c/p>\n\u003cp>\u003ccode>9\u003c/code> 函数基础 · \u003ccode>10\u003c/code> 函数进阶与递归 · \u003ccode>11\u003c/code> 文件操作与异常处理 · \u003ccode>12\u003c/code> 模块、包与环境管理 · \u003ccode>13\u003c/code> 面向对象基础 · \u003ccode>14\u003c/code> 面向对象进阶 · \u003ccode>15\u003c/code> 推导式、迭代器与生成器 · \u003ccode>16\u003c/code> 常用标准库速览\u003c/p>\n\u003cp>🏁 \u003cstrong>阶段项目\u003c/strong>：命令行待办事项管理器\u003c/p>\n\u003cp>\u003ca href=\"#/s2\">打开阶段二 →\u003c/a>\u003c/p>\n\u003ch3>阶段三 · 高级应用（第 17–24 课 · 建议 6–8 周）\u003c/h3>\n\u003cp>从「会写代码」到「会写工程」——装饰器、并发、网络、数据库、测试。\u003c/p>\n\u003cp>\u003ccode>17\u003c/code> 闭包与装饰器 · \u003ccode>18\u003c/code> 类型注解与代码规范 · \u003ccode>19\u003c/code> 正则表达式 · \u003ccode>20\u003c/code> 并发编程 · \u003ccode>21\u003c/code> 异步编程 asyncio · \u003ccode>22\u003c/code> 网络请求与 API · \u003ccode>23\u003c/code> 数据库操作（sqlite3 与 ORM 初探） · \u003ccode>24\u003c/code> 测试、调试与日志\u003c/p>\n\u003cp>🏁 \u003cstrong>阶段项目\u003c/strong>：资讯聚合命令行工具\u003c/p>\n\u003cp>\u003ca href=\"#/s3\">打开阶段三 →\u003c/a>\u003c/p>\n\u003ch3>阶段四 · 方向拓展与毕业项目（建议 4–8 周）\u003c/h3>\n\u003cp>按目标选 \u003cstrong>1 条\u003c/strong>主线深入，做出可展示、能放 GitHub 的毕业作品。贪多嚼不烂。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方向\u003c/th>\n\u003cth>适合谁\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>A · 数据分析\u003c/strong>\u003c/td>\n\u003ctd>想处理和可视化数据、往数据岗走\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>B · Web 开发\u003c/strong>\u003c/td>\n\u003ctd>想做能给别人用的网站或接口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>C · 自动化办公\u003c/strong>\u003c/td>\n\u003ctd>想先解决手头重复劳动（Excel、文件、报表）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>D · 爬虫（数据采集）\u003c/strong>\u003c/td>\n\u003ctd>想批量获取公开数据，注意合规与礼貌抓取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>E · AI 应用开发\u003c/strong>\u003c/td>\n\u003ctd>想调用大模型 API 做出可用的智能应用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>选不定就打开工作台的「怎么选方向」页——五张卡片对应五个目标，点开就地展开该方向的知识点与练习题，不用来回跳。\u003c/p>\n\u003cp>🎓 \u003cstrong>毕业项目（三选一）\u003c/strong>：9 项验收标准，全部勾上即达成。工作台首页会在你走完正课和三个阶段项目后自动多出一张毕业里程碑卡，从「该做毕业项目了」到「毕业项目已达成」，不用自己记还差多少。\u003c/p>\n\u003cp>\u003ca href=\"#/s4\">打开阶段四 →\u003c/a>\u003c/p>"},{"title":"🎯 每一课都这样学","html":"\u003col>\n\u003cli>\u003cstrong>读知识点\u003c/strong>（约 20 分钟）：对照代码块理解概念，不要死记。\u003c/li>\n\u003cli>\u003cstrong>做例题\u003c/strong>（约 30 分钟）：先自己写，再展开参考答案对比；想不通就逐行加 \u003ccode>print\u003c/code> 调试。\u003c/li>\n\u003cli>\u003cstrong>写作业\u003c/strong>（40–60 分钟）：基础题必做 → 进阶题尽量做 → 挑战题选做；\u003cstrong>独立挣扎至少 30 分钟再看提示\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>记笔记\u003c/strong>：用自己的话写「这课我踩了什么坑」，两周后回看一次。\u003c/li>\n\u003c/ol>\n\u003cp>⚠️ 三条铁律：\u003c/p>\n\u003cul>\n\u003cli>所有代码必须\u003cstrong>亲手敲\u003c/strong>，禁止复制粘贴；\u003c/li>\n\u003cli>上一课的基础作业没做完，不进入下一课；\u003c/li>\n\u003cli>每个阶段的\u003cstrong>项目必须做\u003c/strong>——项目才是检验学会的唯一标准。\u003c/li>\n\u003c/ul>"},{"title":"🛠️ 开课前准备","html":"\u003col>\n\u003cli>安装 Python 3.12+：\u003ca href=\"https://www.python.org/downloads/\">https://www.python.org/downloads/\u003c/a>（Windows 安装时务必勾选 \u003cstrong>Add Python to PATH\u003c/strong>）\u003c/li>\n\u003cli>安装编辑器：VS Code + Python 扩展，或 PyCharm Community\u003c/li>\n\u003cli>打开终端验证：\u003ccode>python --version\u003c/code>\u003c/li>\n\u003c/ol>"},{"title":"📁 仓库结构","html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>路径\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>01-\u003c/code> ~ \u003ccode>04-*.md\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>课程内容源\u003c/strong>，唯一的内容出处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>python-学习工作台.html\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>编译产物\u003c/strong>：单文件、离线、零外部依赖，双击即用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>index.html\u003c/code>\u003c/td>\n\u003ctd>同一份产物，给 GitHub Pages 当站点首页用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LICENSE\u003c/code>\u003c/td>\n\u003ctd>许可协议（CC BY-NC-SA 4.0）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>assets/\u003c/code>\u003c/td>\n\u003ctd>README 用的界面截图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tools/\u003c/code>\u003c/td>\n\u003ctd>编译器与验收工具，\u003ca href=\"tools/README.md\">见说明\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>改课程只需编辑那四份 \u003ccode>.md\u003c/code>，然后 \u003ccode>python tools/build.py\u003c/code> 重新生成工作台——一次构建同时写出上面两份 HTML，内容一致，不存在「改完忘同步」。\u003c/p>\n\u003cp>\u003ccode>tools/\u003c/code> 里还有一套\u003cstrong>无头浏览器验收\u003c/strong>（18 个场景 / 663 项断言），覆盖交互、响应式、键盘可达与 WCAG 对比度，用来保证改动没有破坏既有行为。细节见 \u003ca href=\"tools/README.md\">\u003ccode>tools/README.md\u003c/code>\u003c/a>。\u003c/p>\n\u003cblockquote>\n\u003cp>只读课程的话完全不用管 \u003ccode>tools/\u003c/code>，双击 HTML 即可。\u003c/p>\n\u003c/blockquote>"},{"title":"❓ 常见问题","html":"\u003cdetails class=\"faq\">\u003csummary>Q：每天只有 30 分钟怎么办？\u003c/summary>\u003cp>把「一周」当最小单位：一周吃透 1 课 + 重做上周作业，总时长拉长即可。\u003c/p>\u003c/details>\n\u003cdetails class=\"faq\">\u003csummary>Q：作业完全不会做？\u003c/summary>\u003cp>按顺序：① 回看知识点代码块 → ② 重做例题 → ③ 读作业提示 → ④ 把提示里的函数名查官方文档（\u003ca href=\"https://docs.python.org/zh-cn/3/\">https://docs.python.org/zh-cn/3/\u003c/a>）。\u003c/p>\u003c/details>\n\u003cdetails class=\"faq\">\u003csummary>Q：想要作业的完整参考答案？\u003c/summary>\u003cp>本套课程例题全部带答案，作业只带思路提示（逼你思考）。做完后可以让 AI 批改，或把你的解法和例题答案对照。\u003c/p>\u003c/details>\n\u003cdetails class=\"faq\">\u003csummary>Q：学完能找到工作吗？\u003c/summary>\u003cp>本路径到阶段三 ≈ 初级工程师的语法底线。能否就业取决于阶段四的方向深度 + 项目经验 + 计算机基础（数据结构 / 网络 / 数据库），需要另配资源。\u003c/p>\u003c/details>\n\u003cdetails class=\"faq\">\u003csummary>Q：我的学习进度存在哪？会不会丢？\u003c/summary>\u003cp>只存在你这台机器的浏览器里（localStorage），不上传任何地方。换设备或清理浏览器数据前，用「学习记录」页的\u003cstrong>导出\u003c/strong>存一份 JSON，随时可以导入回来。\u003c/p>\u003c/details>\n\u003cdetails class=\"faq\">\u003csummary>Q：必须联网吗？\u003c/summary>\u003cp>不用。工作台是单个 HTML 文件，不请求任何外部资源——断网、内网、U 盘里都能跑。\u003c/p>\u003c/details>"}]};

/* ============================================================
   数据整理
   ============================================================ */
const ITEMS = [];        // 所有可学习条目（含阶段项目）
const ITEM_BY_ID = {};
const STAGE_BY_ID = {};

COURSE.stages.forEach(st => {
  STAGE_BY_ID[st.id] = st;
  st.lessons.forEach(l => { l.stageId = st.id; l.accent = st.accent; ITEMS.push(l); ITEM_BY_ID[l.id] = l; });
  if (st.project) {
    st.project.stageId = st.id; st.project.accent = st.accent;
    ITEMS.push(st.project); ITEM_BY_ID[st.project.id] = st.project;
  }
});
const TOTAL = ITEMS.length;

/* ============================================================
   状态（localStorage）
   ============================================================ */
const KEY = 'py-path-v3';
const KEY_V2 = 'py-path-v2';
const KEY_V1 = 'py-path-v1';
// rev：复习档期表，id → { l: 已连对次数, due: 下次该复习的日期, n: 一共练过几次 }
const STATE_DEFAULT = () => ({ done: {}, hw: {}, miles: {}, ex: {}, rev: {}, time: {}, theme: null, last: null });
const STATE_MAPS = ['done', 'hw', 'miles', 'ex', 'rev', 'time'];

let state = STATE_DEFAULT();
let saveTimer = null, dirty = false;

(function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* 隐私模式等场景静默降级 */ }
  let migrated = false;
  if (!raw) {
    // 从 v2 / v1 平滑迁移：进度、作业勾选、里程碑、错题、时长、主题都不能丢
    try { raw = localStorage.getItem(KEY_V2); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY_V1); } catch (e) {} }
    migrated = !!raw;
  }
  if (!raw) return;
  try {
    state = Object.assign(STATE_DEFAULT(), JSON.parse(raw));
    STATE_MAPS.forEach(k => {
      if (!state[k] || typeof state[k] !== 'object' || Array.isArray(state[k])) state[k] = {};
    });
    sweepRev();
    if (migrated) saveNow();
  } catch (e) { state = STATE_DEFAULT(); }
})();

/* 练习项有两族 id，共住在同一张复习档期表里：
   · 例题  ex-<课时 id>-<页内第几个答案块>
   · 作业  <课时 id>:<第几题>            ← 就靠这个冒号判别
   所以「这个 id 的标记该记在哪张表」是一个必须统一的判断，不能各写一遍。 */
function isHwKey(id) { return String(id).indexOf(':') >= 0; }
function markMap(id) { return isHwKey(id) ? state.hw : state.ex; }

/* 两张表的取值刻意保持一致：1 = 我搞定了，-1 = 我没搞定、要回头再来，缺省 = 还没表态。
   例题的 -1 叫「没写出来」，作业的 -1 叫「卡住」——同一件事的两种说法。
   值域统一的直接好处：复习引擎、错题本、统计口径全都不用再分叉。 */
function markGet(id) { return +(markMap(id)[id] || 0); }
function markSet(id, v) { const M = markMap(id); if (v) M[id] = v; else delete M[id]; return v || 0; }

/* 把档期表和标记对齐，三件事：
   ① 两张标记表都体检一遍：值不是 1 / -1 的一律清掉（老版本给作业存过 0，代表"没勾"）；
   ② 已经标成"欠着"、却还没有档期的，今天就到期——升级上来的老错题（含老作业勾错）立刻进队列；
   ③ 标记被取消、或值不合法的，档期记录一并清掉，免得导出里留一堆对不上的垃圾。 */
function sweepRev() {
  const t = dayKey();
  [state.ex, state.hw].forEach(M => {
    Object.keys(M).forEach(id => {
      const v = +M[id];
      if (v !== 1 && v !== -1) { delete M[id]; return; }
      M[id] = v;
      if (v === -1 && !state.rev[id]) state.rev[id] = { l: 0, due: t, n: 0 };
    });
  });
  Object.keys(state.rev).forEach(id => { if (markGet(id) !== -1) delete state.rev[id]; });
}

function saveNow() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(state)); dirty = false; } catch (e) {}
}
function save() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 120);
}
// 关页前落盘，别把最后几秒的学习时长丢了
addEventListener('beforeunload', () => { if (dirty) saveNow(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) saveNow();
});

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================================================
   进度
   ============================================================ */
function isDone(id) { return !!state.done[id]; }
function doneCount() { return ITEMS.filter(i => isDone(i.id)).length; }
function stageDone(st) {
  const all = st.lessons.concat(st.project ? [st.project] : []);
  return { n: all.filter(i => isDone(i.id)).length, t: all.length };
}
function refreshProgress() {
  const n = doneCount(), pct = Math.round(n / TOTAL * 100);
  const C = 2 * Math.PI * 18;
  const ring = $('#ringFg');
  ring.setAttribute('stroke-dasharray', C.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (C * (1 - n / TOTAL)).toFixed(1));
  $('#ringTxt').textContent = pct + '%';
  $('#progRing').title = `总进度 ${n} / ${TOTAL} 项（${pct}%）`;
  $$('.nav-item').forEach(el => { el.dataset.done = isDone(el.dataset.id) ? '1' : '0'; });
  $$('.nav-bar[data-stage]').forEach(el => {
    const st = STAGE_BY_ID[el.dataset.stage];
    const p = stageDone(st);
    $('i', el).style.width = (p.t ? p.n / p.t * 100 : 0) + '%';
  });
  // ⚠️ `.stage-card` 这个类被两处复用：首页的阶段卡（带 data-stage），
  // 以及**阶段页里的课时卡**（只有 data-id，它自己的进度条在 renderStage 里就写好了）。
  // 早先这里没做筛选，阶段页就会拿到 STAGE_BY_ID[undefined] → stageDone(undefined)
  // 抛 TypeError，把整个 refreshProgress 连同其后的 refreshReviewBadge / paintRvBar /
  // 焦点归位一起中断——而验收套件的 17 个场景从不访问 #/s1…#/s4，所以一直没被发现。
  // 用 [data-stage] 筛选而不是 return 兜底：不筛选的话，即使不抛错也会把
  // 「阶段进度」写到课时卡上，是错的数。
  $$('.stage-card[data-stage]').forEach(el => {
    const st = STAGE_BY_ID[el.dataset.stage];
    const p = stageDone(st);
    $('.sc-bar i', el).style.width = (p.t ? p.n / p.t * 100 : 0) + '%';
    $('.sc-pct', el).textContent = `${p.n}/${p.t}`;
  });
}

/* ============================================================
   今日计划——首页从「回顾型」变「行动型」的那一层
   ------------------------------------------------------------
   首页原本只回答"我学到哪了"（进度环、统计、阶段卡），答完就没下文了：
   知道该复习的人得自己想到去点错题本。这一块把四处散着的可动手项收成
   一张清单——到期欠债、下一步内容、该复核的"会了"、今天的节奏。

   全部由现有状态推出，不新增任何 localStorage 表：
     · 到期复习 / 已掌握例题数 —— revStats()（单一计数出口）
     · 下一个知识点            —— done 表里第一个没勾的条目
     · 今日已学 / 连续天数      —— time 表
   顺序即优先级，不随数据变：先清欠债，再往前走。 */

function todayLabel() {
  const d = new Date();
  const p = dayKey(d).split('-');
  return (+p[1]) + ' 月 ' + (+p[2]) + ' 日 · ' + ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
}

/* 「毕业项目做到哪了」——纯函数，从全局作业索引里挑出毕业页那几项。
   ------------------------------------------------------------------
   不去 DOM 里读芯片：芯片是"渲染出来的样子"，而这里要的是"数据本身"。
   首页、今日计划、验收探针共用这一个出口，三处不会各数一遍。

   三组验收标准是并排的（三选一），所以这里报的是**整页口径**：
   9 项里做完几项。不替用户判定"你选了哪个项目"——他没勾就是还没选，
   硬猜一个反而会跟实际勾选对不上（毕业芯片那边也是同一个取舍）。

   口径与 HW_TOTAL 的关系：这 9 项**已经在** 169 里了，
   所以它是子集而不是额外的一层，不会让任何计数翻倍。 */
function gradProgress() {
  const rows = buildHwIndex().filter(h => {
    const it = ITEM_BY_ID[h.itemId];
    return it && it.kind === 'grad';
  });
  const t = rows.length;
  const n = rows.filter(h => markGet(h.id) === 1).length;
  const stuck = rows.filter(h => markGet(h.id) === -1).length;
  // 「动手了但没做完」也算已经开始：勾过任何一项就说明在做了
  const started = rows.some(h => markGet(h.id) === 1 || markGet(h.id) === -1);
  /* 什么时候才该把这张卡摆出来？
     ① 正课与阶段项目全部走完，或 ② 已经在做毕业项目了（含做完全部）。
     这条**必须**留着：否则一个刚学第 3 课的人，首页会一直挂着一张
     "该做毕业项目了"，把前面那几张真正该做的事挤到后面去。

     判定用「课时 + 阶段项目」而不是"全部条目"：附录和"怎么选方向"这类
     拓展页不该成为毕业的前置条件——它们永远可以不勾，那这张卡就永远不出现。 */
  const courseDone = !ITEMS.some(i =>
    !isDone(i.id) && (i.kind === 'lesson' || i.kind === 'project'));
  return {
    n, t, stuck, started,
    show: t > 0 && (courseDone || started),
    courseDone,
    left: t - n,
    pct: t ? Math.round(n / t * 100) : 0,
    full: t > 0 && n === t,
    id: (Object.keys(ITEM_BY_ID).find(k => ITEM_BY_ID[k].kind === 'grad')) || 's4'
  };
}

function todayPlan() {
  const s = revStats();
  const next = ITEMS.find(i => !isDone(i.id)) || null;
  const dueHw = s.rows.due.filter(r => r.kind === 'hw').length;
  const poolLearned = quizPool('learned', 'mix').length;
  const todaySec = state.time[dayKey()] || 0;
  const stk = streak();
  const soon = s.rows.later.length ? s.rows.later[0].due : null;
  const g = gradProgress();

  const items = [
    {
      k: 'due', n: s.due, unit: '道', href: '#/review',
      label: '今天该复习',
      note: s.due
        ? (dueHw ? '其中作业卡住 ' + dueHw + ' 项' : '间隔复习到期，趁热重做一遍')
        : (soon ? '今天没有到期的，下一道排在 ' + fmtDue(soon) : '错题本空着，没有欠债'),
      on: s.due > 0
    },
    {
      k: 'next', n: next ? (next.kind === 'lesson' ? next.no : '★') : '✓',
      unit: next && next.kind === 'lesson' ? '课' : '',
      href: next ? '#/' + next.id : '#/s4',
      label: next ? next.title : '全部课程已完成',
      note: next
        ? ((ITEM_BY_ID[next.stageId] ? '' : (STAGE_BY_ID[next.stageId] ? STAGE_BY_ID[next.stageId].label + ' · ' : '')) +
           (next.kind === 'lesson' ? '还没开始，接上就好' : '阶段项目，动手做'))
        : '去挑一个毕业项目',
      on: !!next
    },
    /* 毕业进度只在"确实该关心它"的时候出现——课程全部走完、或已经动手做了。
       否则它会一直挂在那儿催一个还轮不到的人，把前面四项的优先级搅浑。 */
    ...(g.show ? [{
      k: 'grad', n: g.n + '/' + g.t, unit: '项', href: '#/' + g.id,
      label: g.full ? '毕业项目已达成' : (g.started ? '毕业项目进行中' : '该做毕业项目了'),
      note: g.full
        ? '三组验收全部通过，可以收工了'
        : (g.started
          ? '还差 ' + g.left + ' 项验收' + (g.stuck ? ' · 有 ' + g.stuck + ' 项卡住' : '')
          : '课程已走完，挑一个方向开工吧'),
      on: true,
      done: g.full
    }] : []),
    {
      k: 'quiz', n: s.doneEx, unit: '道', href: '#/quiz',
      label: '标了「已掌握」',
      note: poolLearned
        ? '可抽 ' + poolLearned + ' 个已学过的练习项复核'
        : '先把课时标记完成，就有题可抽了',
      on: s.doneEx > 0
    },
    {
      k: 'time', n: stk, unit: '天', href: '#/records',
      label: '连续学习',
      note: todaySec ? '今天已学 ' + fmtDur(todaySec) : '今天还没开始，学 5 分钟也算',
      on: stk > 0 || todaySec > 0
    }
  ];

  let lead;
  if (s.due) lead = '今天有 ' + s.due + ' 道到期的题，先把欠债清了，再往前走。';
  else if (soon) lead = '今天没有到期的题，下一道排在 ' + fmtDue(soon) + '。';
  else if (next) lead = '错题本空着，正好推进《' + next.title + '》。';
  else if (g.full) lead = '24 节课、3 个项目和毕业作品都完成了——这套路径你走完了。';
  else lead = '24 节课和 3 个项目都完成了，接下来该做毕业项目了。';

  return { date: todayLabel(), lead, items, due: s.due, later: s.later,
           doneEx: s.doneEx, streak: stk, todaySec, grad: g };
}

/* ============================================================
   渲染：阶段页
   ============================================================ */
/* 页面类型的统一叫法。阶段卡片、课时页眉、搜索结果三处都要用，
   所以只留一个出口——以前三处各写一遍 `kind === 'xxx' ? ... : ...`，
   加一种 kind 就得记着改三处。 */
function kindTag(it) {
  if (it.kind === 'lesson') return '第 ' + it.no + ' 课';
  if (it.kind === 'direction') return '方向 ' + it.no;
  return { project: '阶段项目', grad: '毕业项目', picker: '选方向' }[it.kind] || '拓展';
}

/* 「作业 / 任务 / 验收」和量词也是同一件事的三种说法：三态机制完全一样，
   只是页面语义不同。集中在这里，免得文案改一处漏一处。 */
function hwNoun(it) {
  return it.kind === 'project' ? '任务' : it.kind === 'grad' ? '验收' : '作业';
}
function hwUnitOf(it) {
  return (it.kind === 'lesson' || it.kind === 'direction') ? '题' : '项';
}

function renderStage(st) {

function describeCounts(it) {
  const c = it.counts || {};
  const bits = [];
  if (c.kp) bits.push('知识点 ' + c.kp + ' 条');
  if (c.points) bits.push('要点 ' + c.points + ' 条');
  if (c.ex) bits.push('例题 ' + c.ex + ' 个');
  if (c.codes && !c.ex) bits.push('代码 ' + c.codes + ' 段');
  if (c.hw) bits.push(hwNoun(it) + ' ' + c.hw + ' ' + hwUnitOf(it));
  return bits.length ? bits.join(' · ') : '含完整讲解与示例';
}
/* ============================================================
   渲染：课程页

      ${it.counts.answers ? `<div class="gauge" style="flex:0 1 260px"><span>自评</span><div class="gauge-bar"><i id="exBar" style="width:0%"></i></div><span id="exTxt">0/${it.counts.answers}</span></div>` : ''}

  afterHwPaint = it.kind === 'picker' ? paintPickProg : () => {};

/* 从错题本跳回来时，展开并高亮那道题 */
function focusPendingEx() {
  if (!pendingEx) return;
  const el = document.getElementById(pendingEx);
  pendingEx = null;
  if (!el) return;
  if (el.tagName === 'DETAILS') el.open = true;
  setTimeout(() => {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('is-flash');
    setTimeout(() => el.classList.remove('is-flash'), 1600);
  }, 80);
}

/* --- 代码块：语言标签 + 复制 --- */
const LANG_NAME = { python: 'Python', py: 'Python', bash: 'Shell', sh: 'Shell', shell: 'Shell', text: '文本', json: 'JSON', sql: 'SQL', html: 'HTML' };
/* root 可传：就地展开出来的克隆节点不在文档序里，得单独扫一遍 */
function decorateCode(root) {
  $$('.hl', root).forEach(box => {
    if (box.dataset.deco) return;
    box.dataset.deco = '1';
    const raw = box.dataset.lang || 'python';
    const bar = document.createElement('div');
    bar.className = 'hl-bar';
    bar.innerHTML = `<span class="hl-lang">${esc(LANG_NAME[raw] || raw.toUpperCase())}</span>
      <button class="hl-copy" type="button" aria-label="复制这段代码">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>复制</span>
      </button>`;
    box.prepend(bar);
    $('.hl-copy', bar).addEventListener('click', async e => {
      const btn = e.currentTarget;
      const code = $('code', box).textContent;
      const ok = await copyText(code);
      btn.dataset.ok = ok ? '1' : '0';
      $('span', btn).textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => { btn.dataset.ok = '0'; $('span', btn).textContent = '复制'; }, 1600);
    });
  });
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* --- 作业 / 任务：三态（未做 / 卡住 / 已做） ---

   一页可能有**多张**清单：毕业项目页就是三个项目各自的验收标准并排。所以这里
   遍历页面里每一张 ol.hw-list，而不是只取第一张。

   两套序号刻意分开，混用一定会出 bug：
     · gid = 全局序号 → 进 id（<课时 id>:<第几项>）。必须全页唯一，否则三组清单
             的第 1 项会挤在同一个 id 上，勾一组等于勾三组。
     · k   = 清单内序号 → 只用于文案。视觉上的号由 CSS counter 数，每张清单各自
             从 01 起，恰好就是 k。
   单清单页（24 节课 + 5 个方向页）里两者数值相同，行为与以前完全一致。 */
function decorateHomework(it) {
  decorateHomeworkLists($('#lessonBody'), it);
  refreshHw(it);
}

/* 上面那套装饰的**单根版本**，供「选方向」页就地展开的三块勾复用。
   it 只用来取 id 前缀与量词，所以展开区可以拿方向页的 it 传进来。 */
function decorateHomeworkLists(root, it) {
  const groups = hwListsBySection(root);
  if (!groups.length) return 0;
  const noun = (it.kind === 'lesson' || it.kind === 'direction') ? '题' : '项';
  const multi = groups.length > 1;
  let gid = 0;

  groups.forEach(({ sec, list }) => {
    const base = multi && sec ? shortSec(sec) + ' · ' : '';
    $$(':scope > li', list).forEach((li, k) => {
      const id = it.id + ':' + (gid++);
      const where = base + '第 ' + (k + 1) + ' ' + noun;

      li.id = id;                 // 错题本里的「去复习」靠它跳过来并高亮
      li.dataset.hw = id;

      const lab = document.createElement('label');
      lab.className = 'hw-tick';
      lab.innerHTML = `<input type="checkbox" aria-label="标记${where}已完成"><span></span>`;
      li.prepend(lab);

      const act = document.createElement('div');
      act.className = 'hw-act';
      act.innerHTML = `<button class="hw-stuck" type="button" aria-pressed="false"
        title="标记为「卡住」：进入错题本，按 1 → 3 → 7 → 21 天的节奏提醒你回来重做">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 2.6 17A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01"/></svg>卡住</button>`;
      li.appendChild(act);
      paintHw(li, id);            // 两个控件都进了 DOM 才上色，否则 aria-pressed 会停在初始值

      $('input', lab).addEventListener('change', e => {
        if (e.target.checked) {
          // 复习会话里点＝判定；平时在课文里翻着看，点下去是记录，再点可撤销
          const r = rateEx(id, 1, isSessionItem(id));
          toast(where + ' · ' + (r.msg || '已完成'));
        } else {
          markSet(id, 0); delete state.rev[id];
          toast(where + ' · 已取消标记');
        }
        paintHw(li, id); save(); refreshHw(it); afterHwPaint(id);
      });

      $('.hw-stuck', act).addEventListener('click', () => {
        const r = rateEx(id, -1, isSessionItem(id));   // 会话中＝判定，平时＝开关
        paintHw(li, id); refreshHw(it);
        afterRate(id, r);                              // 落盘 + 提示，并在会话里推进下一道
        afterHwPaint(id);
      });
    });
  });
  return gid;
}

/* 勾选之后除了刷新本页仪表，还有别的东西要跟着变。
   用钩子而不是在这里直接调 paintPickProg()：装饰逻辑不该认识"选方向页"这个特例。 */
let afterHwPaint = () => {};

/* 小节名太长会在提示条里折行，截短一个够辨认的长度就好 */
function shortSec(s) { return s.length > 12 ? s.slice(0, 12) + '…' : s; }

/* 按文档序把每张 ol.hw-list 归到它所属的那一节（最近的 h3）。
   装饰、计数、毕业进度芯片都走这一个出口——否则三处各遍历一遍 DOM，
   迟早有一处忘了改，于是"数据"和"由数据推出来的样子"就对不上。 */
function hwListsBySection(root) {
  const pairs = [];
  let sec = '', h3 = null;
  $$('h3, ol.hw-list', root).forEach(n => {
    if (n.tagName === 'H3') { h3 = n; sec = n.textContent.trim(); return; }
    pairs.push({ sec, h3, list: n });
  });
  return pairs;
}

/* li 的外观完全由标记推出来，DOM 不自己再记一份状态——
   否则改一处忘一处，样式迟早和数据对不上。 */
function paintHw(li, id) {
  const mark = markGet(id);
  li.dataset.state = mark === 1 ? 'done' : mark === -1 ? 'stuck' : 'todo';
  const box = $('.hw-tick input', li);
  if (box) box.checked = mark === 1;
  const st = $('.hw-stuck', li);
  if (st) st.setAttribute('aria-pressed', String(mark === -1));
  return mark;
}

function refreshHw(it) {
  const groups = hwListsBySection($('#lessonBody'));
  if (!groups.length) return;
  const items = groups.reduce((a, g) => a.concat($$(':scope > li', g.list)), []);
  const n = items.filter(li => li.dataset.state === 'done').length;
  const stuck = items.filter(li => li.dataset.state === 'stuck').length;
  const bar = $('#hwBar'), txt = $('#hwTxt');
  if (bar) bar.style.width = (items.length ? n / items.length * 100 : 0) + '%';
  if (txt) txt.textContent = n + '/' + items.length;
  const sc = $('#hwStuck');
  if (sc) { sc.textContent = String(stuck); sc.dataset.zero = stuck ? '0' : '1'; }
  paintGrad();
}

/* --- 毕业项目：三选一的闭环 ---

   三个项目各带一组验收标准（各 3 条），三组都进同一张 hw 表。这里只做一件事：
   在每组所属的项目标题旁挂一个「已达成几条」的芯片——翻到这一页就知道还差什么。

   一个刻意的取舍：**不强制"选定"某一个项目**。用户勾了哪组，哪组就是他在做的；
   多存一个"我选了哪个"的状态，就多一处可能与实际勾选对不上的地方。 */
function decorateGrad(it) {
  if (it.kind !== 'grad') return;
  hwListsBySection($('#lessonBody')).forEach(({ h3, list }, i) => {
    if (!h3) return;
    const g = 'g' + i;
    list.dataset.gradGroup = g;
    const pill = document.createElement('span');
    pill.className = 'grad-pill';
    pill.dataset.group = g;
    h3.appendChild(pill);
    paintGradPill(pill, list);
  });
}
function paintGradPill(pill, list) {
  const items = $$(':scope > li', list);
  const n = items.filter(li => li.dataset.state === 'done').length;
  pill.dataset.n = String(n);
  pill.dataset.t = String(items.length);
  pill.dataset.full = (items.length && n === items.length) ? '1' : '0';
  pill.textContent = pill.dataset.full === '1' ? '🎓 已达成' : n + ' / ' + items.length;
}
/* 芯片由标记推出来，所以每次勾选都得重算——不能只在初次渲染时算一遍。 */
function paintGrad() {
  const body = $('#lessonBody');
  $$('.grad-pill', body).forEach(p => {
    const list = $('ol.hw-list[data-grad-group="' + p.dataset.group + '"]', body);
    if (list) paintGradPill(p, list);
  });
}

/* --- 「按目标选方向」：静态对照表 → 可点的卡片 ---

   卡片内容**全部从表格 DOM 派生**（目标 / 方向 / 理由），一条都不在这里硬编码，
   否则内容源就不再是唯一真相，改一处漏一处。
   找不到表格就让它原样留着——这是渐进增强，不是替换掉内容。 */
function decoratePicker(it) {
  if (it.kind !== 'picker') return;
  const body = $('#lessonBody');
  /* 只认顶层表格（`#lessonBody > table`）。用 `$('table', body)` 会连带扫到
     嵌套在小节里的表格——那份内容一被替换掉就永久消失，而且再也长不回来。 */
  const table = $(':scope > table', body);
  if (!table) return;
  const tbody = $$('tbody tr', table);
  const trs = tbody.length ? tbody : $$('tr', table).slice(1);
  const dirs = ITEMS.filter(x => x.kind === 'direction');

  const grid = document.createElement('div');
  grid.className = 'pick-grid';
  let n = 0;
  trs.forEach(tr => {
    const td = $$('td', tr);
    if (td.length < 3) return;
    const goal = td[0].textContent.trim();
    // 「A 数据分析」→ 字母认方向、其余是名字
    const m = td[1].textContent.trim().match(/^([A-Ea-e])\s*[·・]?\s*(.*)$/);
    const letter = m ? m[1].toLowerCase() : '';
    const name = m ? m[2].trim() : td[1].textContent.trim();
    const why = td[2].textContent.trim();
    // 按 kind+no 反查方向页，不写死 id 前缀——slug 变了也不会断
    const dir = dirs.filter(x => String(x.no).toLowerCase() === letter)[0];

    /* 每张卡用 <a href="#/<方向页>">。**这是刻意的**：它同时是三条路径的兜底——
       键盘 Tab 直接可达（不用引入第三套方向键）、没有 JS 也能跳转、
       点标题旁边的箭头 `#dir_<字母>` 则由后面的 hashchange 兜住。
       想要的就地展开挂在「看知识点」这颗按钮上，和跳转各管一边。 */
    const item = document.createElement('div');
    item.className = 'pick-item';
    item.dataset.dir = letter;
    item.innerHTML = `<a class="pick-card" href="#/${dir ? dir.id : 's4'}" data-open="0"
        data-dir="${esc(letter)}" aria-expanded="false">
      <span class="pick-goal">${esc(goal)}</span>
      <span class="pick-dir"><b>${esc(letter.toUpperCase())}</b><span class="pick-name">${esc(name)}</span></span>
      <span class="pick-why">${esc(why)}</span>
      <span class="pick-go"><span class="pick-go-t">去看这个方向 →</span>${
        dir && hasExpand(dir) ? '<span class="pick-more">看知识点</span>' : ''}</span>
    </a>`;

    // 展开后「看知识点」会盖掉提示文字，得把原来的话留着，收起时还原
    const gt = $('.pick-go-t', item);
    gt.dataset.collapsed = gt.textContent;

    if (dir && hasExpand(dir)) {
      const mount = document.createElement('div');
      mount.className = 'pick-x';
      mount.hidden = true;                 // hidden 必须与内容同步落地，别留个空壳给人读
      // 展开后把焦点交到这里，所以它必须可聚焦；用它自己的 Esc 收起
      mount.tabIndex = -1;
      item.appendChild(mount);
      setupPickExpand(item, dir, mount);
    }
    grid.appendChild(item);
    n++;
  });
  if (!n) return;
  /* 表格是**移走**不是删掉：一旦被替换出文档，就再也回不来（它已经不在文档里，
     谁也找不到它）。收着是为了万一出问题还能人工还原。 */
  table.remove();
  body.insertBefore(grid, body.firstChild);
}

/* 有可展开的内容吗？——路线 / 核心知识点 / 示例 / 练习题 里任意一条就算。 */
function hasExpand(dir) {
  const h = document.createElement('div');
  h.innerHTML = dir.html;
  return $$('h4.mini-title', h).some(x => /路线|核心知识点|示例|练习题/.test(x.textContent));
}

/* 展开区是**克隆**课文节点拼出来的。
   直接搬原节点会把文章顺序打乱（展开后正文里少了三块），克隆留原件不动。

   「示例」也在收录范围内：抽掉它，展开区就从"核心知识点"直接跳到"练习题"，
   中间那道可运行的示范没了——而这个示范恰恰是判断"这方向我感不感兴趣"最省事的依据。 */
function pickExpandNodes(dir) {
  const src = document.createElement('div');
  src.innerHTML = dir.html;
  const keeps = /路线|核心知识点|示例|练习题/;
  const nodes = [];
  let on = false;
  $$(':scope > *', src).forEach(el => {
    if (el.tagName === 'H4') on = keeps.test(el.textContent);
    if (on) nodes.push(el.cloneNode(true));
  });
  return nodes;
}

/* 展开区里那三颗勾用的是**同一张 hw 表**，所以 id 必须与课时页逐字一致：
   `hwListsBySection` 数到的是「本页第几个 ol.hw-list」，这里只有一个 ol，
   所以全局序号必然从 0 起——照同一个公式拼即可，不需要另建索引。 */
function pickHwMap(dir, root) {
  const map = new Map();
  const lists = $$('ol.hw-list', root);
  if (!lists.length) return map;
  const items = $$(':scope > li', lists[0]);
  items.forEach((li, g) => map.set(li, dir.id + ':' + g));
  return map;
}

function setupPickExpand(item, dir, mount) {
  const card = $('.pick-card', item);
  const gt = $('.pick-go-t', item);
  let built = false;

  // 第一次展开才建内容：默认路径（直接点卡片跳走）不付这块开销
  const build = () => {
    if (built) return;
    built = true;
    pickExpandNodes(dir).forEach(nd => mount.appendChild(nd));

    const h = document.createElement('div');
    h.className = 'pick-x-h';
    const dn = dir.no ? String(dir.no).toUpperCase() : '';
    h.innerHTML = `<h3><b>${esc(dn)}</b>${esc(dir.title)}</h3>
      <span class="pick-x-prog" id="pxProg"></span>
      <a class="pick-x-link" id="pxOpen" href="#/${dir.id}">打开完整方向页 →</a>`;
    mount.insertBefore(h, mount.firstChild);

    decorateCode(mount);
    const hm = pickHwMap(dir, mount);
    buildHwIndexFrom(mount, hm, dir);
    decorateHomeworkLists(mount, dir);
    // 代码高亮、题面、勾选芯片都挂完之后再上色——顺序错了会漏掉后进的子节点
    hm.forEach((id, li) => paintHw(li, id));
    const n = hm.size;
    if (n) {
      const p = $('#pxProg', mount);
      if (p) { p.dataset.t = String(n); paintPickProg(); }
    }
  };

  const toggle = () => {
    const open = item.dataset.open !== '1';
    build();
    item.dataset.open = open ? '1' : '0';
    card.dataset.open = item.dataset.open;
    card.setAttribute('aria-expanded', String(open));
    mount.hidden = !open;
    if (open && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      mount.classList.remove('mv-enter');
      void mount.offsetWidth;          // 强制重排，否则同一个类加第二次不重放动画
      mount.classList.add('mv-enter');
    }
    const t = $('.pick-go-t', item);
    if (t) t.textContent = open ? '收起 ↑' : (t.dataset.collapsed || '去看这个方向 →');
    if (open) mount.focus({ preventScroll: true });
  };

  // 直接点卡片 = 展开/收起；点右上角箭头 = 仍然跳去完整页（那是它的字面承诺）
  card.addEventListener('click', e => {
    if (e.target.closest('.pick-x-link')) return;
    e.preventDefault();
    toggle();
  });
  // 回车和方向键一样是开合，跳完整页留给右上角那颗链接（它才是真的 <a>）
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowDown' && item.dataset.open !== '1') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowUp' && item.dataset.open === '1') { e.preventDefault(); toggle(); }
  });
  mount.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); toggle(); card.focus(); }
  });
  /* 从完整方向页返回（浏览器后退 / 页内箭头回跳）要还原展开态。
     这一条必须排在最后：前面所有监听都绑完了才回头补账。 */
  if (pendingDir === dir.id) {
    pendingDir = null;
    toggle();
  }
}

let pendingDir = null;
/* `#dir_a` 这种"带目标"的跳转：切页 + 落地后展开那一格。
   1 是给路由留出渲染时间——渲染没跑完，方向卡片在 DOM 里还不存在。 */
function goDir(letter) {
  const dir = ITEMS.filter(x => x.kind === 'direction' &&
    String(x.no).toLowerCase() === String(letter).toLowerCase())[0];
  if (!dir) return;
  if (getRoute() === 's4-怎么选方向') {
    const card = $('.pick-item[data-dir="' + String(letter).toLowerCase() + '"] .pick-card');
    if (card) { card.click(); return; }
  }
  pendingDir = dir.id;
  go('s4-怎么选方向');
  setTimeout(() => { if (pendingDir) { pendingDir = null; } }, 1200);
}

/* 「已做 x / n」跟着勾选走，和毕业页的芯片一样，每次勾选都要重算 */
function paintPickProg() {
  const body = $('#lessonBody');
  if (!body) return;
  $$('.pick-x', body).forEach(m => {
    const p = $('#pxProg', m);
    if (!p || !p.dataset.t) return;
    const li = $$('ol.hw-list > li', m);
    const n = li.filter(x => x.dataset.state === 'done').length;
    p.textContent = '已做 ' + n + ' / ' + li.length;
    p.dataset.n = String(n);
    p.dataset.full = li.length && n === li.length ? '1' : '0';
  });
}

/* --- 本页操作 --- */
function toggleDone(it) {
  const now = !isDone(it.id);
  if (now) state.done[it.id] = 1; else delete state.done[it.id];
  save(); refreshProgress();
  const btn = $('#doneBtn');
  if (btn && getRoute() === it.id) {
    btn.className = 'btn ' + (now ? 'btn-done' : 'btn-primary');
    btn.setAttribute('aria-pressed', String(now));
    $('#doneTxt').textContent = now ? '已完成' : '标记为已完成';
  }
  toast(now ? '已标记完成：' + it.title : '已取消完成标记');
}

function bindLessonActions(it) {
  const btn = $('#doneBtn');
  if (btn) btn.addEventListener('click', () => toggleDone(it));

  const exp = $('#expandAll');
  if (exp) {
    // 答案默认就是展开的，所以按钮一开始说的是「收起」
    const ds0 = $$('details.answer', $('#lessonBody'));
    if (ds0.length && ds0.every(d => d.open)) exp.textContent = '收起全部答案';
    exp.addEventListener('click', () => {
      const ds = $$('details.answer', $('#lessonBody'));
      if (!ds.length) { toast('本页没有可折叠的参考答案'); return; }
      const open = ds.some(d => !d.open);
      ds.forEach(d => { d.open = open; });
      exp.textContent = open ? '收起全部答案' : '展开全部答案';
    });
  }
}

/* ============================================================
   打字机（首页记忆点）
   ============================================================ */
const HERO_LINES = [
  [{ c: 'c', v: '# 你的 Python 学习工作台' }],
  [{ c: 'k', v: 'print' }, { c: 'p', v: '(' }, { c: 's', v: '"Hello, World!"' }, { c: 'p', v: ')' }],
  [{ c: 'n', v: 'goal' }, { c: 'p', v: ' = ' }, { c: 's', v: '"24 节课后写出能跑的程序"' }],
  [{ c: 'k', v: 'for' }, { c: 'n', v: ' week' }, { c: 'k', v: ' in' }, { c: 'b', v: 'range' }, { c: 'p', v: '(1, 25):' }],
  [{ c: 'p', v: '    ' }, { c: 'b', v: 'print' }, { c: 'p', v: '(' }, { c: 's', v: 'f"第 {week} 周 · 慢慢来，比较快"' }, { c: 'p', v: ')' }],
  [{ c: 'n', v: 'progress' }, { c: 'p', v: ' → ' }, { c: 's', v: '"持续 > 强度"' }]
];
let heroTimer = null;
function startHeroTyping() {
  const host = $('#heroTerm');
  if (!host) return;
  clearTimeout(heroTimer);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const paint = (li, ci, tokens) => tokens.map((t, i) =>
    `<span class="tk-${t.c}">${esc(t.v)}</span>`).join('');

  if (reduce) {
    host.innerHTML = HERO_LINES.map(l => `<div class="ln">${l.map(t => `<span class="tk-${t.c}">${esc(t.v)}</span>`).join('')}</div>`).join('');
    return;
  }

  let li = 0, ci = 0;
  host.innerHTML = HERO_LINES.map(() => '<div class="ln"></div>').join('');
  const lines = $$('.ln', host);

  const step = () => {
    if (li >= HERO_LINES.length) {
      lines[lines.length - 1].innerHTML += '<span class="caret"></span>';
      return;
    }
    const tokens = HERO_LINES[li];
    const flat = tokens.map(t => t.v).join('');
    ci++;
    const shown = flat.slice(0, ci);
    let acc = '', rest = shown;
    for (const t of tokens) {
      const take = Math.min(t.v.length, rest.length);
      acc += `<span class="tk-${t.c}">${esc(rest.slice(0, take))}</span>`;
      rest = rest.slice(take);
      if (!rest.length) break;
    }
    lines[li].innerHTML = acc + (ci < flat.length ? '<span class="caret"></span>' : '');
    if (ci >= flat.length) { li++; ci = 0; heroTimer = setTimeout(step, 300); }
    else heroTimer = setTimeout(step, 34);
  };
  heroTimer = setTimeout(step, 420);
}

/* ============================================================
   搜索
   ============================================================ */
let searchIdx = null, resList = [], resSel = 0;
function buildIndex() {
  if (searchIdx) return searchIdx;
  searchIdx = ITEMS.map(it => {
    const st = STAGE_BY_ID[it.stageId];
    const parts = [];
    parts.push(it.title);
    // 从 HTML 中抽取小标题与正文，作为检索语料
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    tmp.querySelectorAll('h3,h4,p,li').forEach(el => parts.push(el.textContent));
    const text = parts.join(' · ').replace(/\s+/g, ' ');
    return { id: it.id, title: it.title, stage: st.label + ' · ' + st.name, kind: it.kind, no: it.no, text };
  });
  return searchIdx;
}
function runSearch(q) {
  q = q.trim();
  const ul = $('#searchRes');
  if (!q) {
    resList = ITEMS.slice(0, 8).map(it => ({ it, snippet: '' }));
    resSel = 0;
    $('#searchCount').textContent = '共 ' + TOTAL + ' 项';
    paintResults([], true);
    return;
  }
  const idx = buildIndex();
  const needle = q.toLowerCase();
  const scored = [];
  idx.forEach(rec => {
    const title = rec.title.toLowerCase();
    const body = rec.text.toLowerCase();
    let score = 0;
    let first = -1;
    if (title.includes(needle)) score += 100 - title.indexOf(needle);
    let hits = 0, pos = body.indexOf(needle);
    if (pos >= 0) first = pos;
    while (pos !== -1 && hits < 40) { hits++; pos = body.indexOf(needle, pos + needle.length); }
    if (hits) score += Math.min(hits, 20) * 4 + 20;
    if (!score && needle.length >= 2) {
      // 逐字兜底：支持「装饰 缓存」这类记不全的查询。
      // 但要求命中字符彼此靠近（跨度 ≤30），否则「闭包」会误命中只含「包」的课。
      let cur = 0, ok = true, span0 = -1, span1 = -1;
      for (const ch of needle) {
        const q = body.indexOf(ch, cur);
        if (q === -1) { ok = false; break; }
        if (span0 === -1) span0 = q;
        span1 = q; cur = q + 1;
      }
      if (ok && span1 - span0 <= 30) { score = 8; first = span0; }
    }
    if (score > 0) scored.push({ rec, score, first, hits });
  });
  scored.sort((a, b) => b.score - a.score || a.rec.title.length - b.rec.title.length);
  resList = scored.slice(0, 14).map(s => ({ it: ITEM_BY_ID[s.rec.id], snippet: makeSnippet(s.rec.text, needle, s.first), hits: s.hits }));
  resSel = 0;
  $('#searchCount').textContent = scored.length ? scored.length + ' 项匹配' : '无结果';
  paintResults();
}
function makeSnippet(text, needle, pos) {
  if (pos < 0) return text.slice(0, 110);
  const start = Math.max(0, pos - 34);
  return (start > 0 ? '…' : '') + text.slice(start, start + 120) + '…';
}
function hlWords(s, q) {
  const safe = esc(s);
  if (!q) return safe;
  try {
    // 先按同一套规则转义查询词，保证转义后的实体也能被命中
    const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp('(' + needle + ')', 'gi'), '<mark>$1</mark>');
  } catch (e) { return safe; }
}
function paintResults(emptyMode) {
  const ul = $('#searchRes');
  const q = $('#searchInput').value;
  if (!resList.length) {
    ul.innerHTML = `<li style="padding:34px 20px;text-align:center;color:var(--ink-3);font-size:14.5px">
      没有找到匹配内容，换个关键词试试<br><span style="font-size:13px">例如：装饰器 / 闭包 / 生成器 / json / 正则</span></li>`;
    return;
  }
  ul.innerHTML = resList.map((r, i) => `
    <li><a class="res" href="#/${r.it.id}" data-i="${i}" data-sel="${i === resSel ? 1 : 0}">
      <div class="res-top">
        <span class="res-kind">${esc(kindTag(r.it))}</span>
        <b>${hlWords(r.it.title, q)}</b>
      </div>
      <p>${hlWords(r.snippet || (STAGE_BY_ID[r.it.stageId].label + ' · ' + STAGE_BY_ID[r.it.stageId].name), q)}</p>
    </a></li>`).join('');
}
function moveSel(d) {
  if (!resList.length) return;
  resSel = (resSel + d + resList.length) % resList.length;
  $$('.res').forEach((el, i) => el.dataset.sel = i === resSel ? '1' : '0');
  const cur = $('.res[data-sel="1"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}
let searchTimer = null;
function openSearch() {
  $('#overlay').dataset.open = '1';
  const inp = $('#searchInput');
  inp.value = ''; runSearch('');
  setTimeout(() => inp.focus(), 40);
  syncScrollLock();
}
function closeSearch() {
  const inside = $('#overlay').contains(document.activeElement);
  $('#overlay').dataset.open = '0';
  syncScrollLock();
  // 焦点交还给触发按钮，键盘用户不必重新 Tab 一圈找回来
  if (inside) $('#searchBtn').focus({ preventScroll: true });
}
$('#searchBtn').addEventListener('click', openSearch);
$('#kbdHint').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘ K' : 'Ctrl K';
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSearch(); });
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => runSearch(v), 110);
});
$('#searchRes').addEventListener('click', e => {
  const a = e.target.closest('.res');
  if (a) { closeSearch(); }
});
addEventListener('keydown', e => {
  const sOpen = $('#overlay').dataset.open === '1';
  const hOpen = $('#helpOverlay').dataset.open === '1';

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    sOpen ? closeSearch() : openSearch();
    return;
  }
  if (e.key === 'Escape') {
    if (hOpen) closeHelp();
    if (sOpen) closeSearch();
    closeDrawer();
    return;
  }

  if (sOpen) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const r = resList[resSel];
      if (r) { closeSearch(); go(r.it.id); }
    }
    return;
  }

  // 单键快捷键：输入中或以修饰键组合时一律不抢
  const ae = document.activeElement || {};
  const tag = ae.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ae.isContentEditable) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const route = getRoute();
  const jump = d => {
    const i = ITEMS.findIndex(x => x.id === route);
    if (i === -1) return;
    const t = ITEMS[i + d];
    if (t) { e.preventDefault(); go(t.id); }
  };

  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key === '?') { e.preventDefault(); hOpen ? closeHelp() : openHelp(); return; }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleTheme(); return; }
  if (e.key === 'm' || e.key === 'M') {
    if (ITEM_BY_ID[route]) { e.preventDefault(); toggleDone(ITEM_BY_ID[route]); }
    return;
  }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); startReview(); return; }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); startQuiz(); return; }
  if (e.key === '[') jump(-1);
  else if (e.key === ']') jump(1);
});

/* ============================================================
   错题本：例题自评
   ============================================================ */
let pendingEx = null;   // 从错题本跳回时要点亮的那道题
let exIndex = null;     // 全站例题索引（懒构建）

/* 从课程数据里抽出每一道例题，不依赖用户是否访问过那一页 */
function buildExIndex() {
  if (exIndex) return exIndex;
  exIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    let lastEx = '', lastHead = '', n = 0;
    tmp.querySelectorAll('h3,h4.ex-title,details.answer').forEach(el => {
      if (el.tagName === 'H3') {
        lastHead = el.textContent.replace(/^[^\u4e00-\u9fffA-Za-z0-9]+/, '').trim();
      } else if (el.tagName === 'H4') {
        lastEx = el.textContent.trim();
      } else {
        const id = 'ex-' + it.id + '-' + (n++);
        // 「运行效果」只是题面，不是一道题；序号仍要递增，否则这里的 id
        // 会和 decorateAnswers 写进 DOM 的对不上。
        if (el.classList.contains('out')) return;
        // 答案前的最近一个「例题 N：」标题就是它的题面，退而求其次用所在小节名
        exIndex.push({ id, itemId: it.id, kind: 'ex', title: lastEx || lastHead || it.title });
      }
    });
  });
  return exIndex;
}

/* 作业索引：和例题同一个口径——从课程数据里直接抽，不依赖用户有没有打开过那一页。
   id 的形状必须和 decorateHomework() 写进 DOM 的完全一致（<课时 id>:<第几项>），
   否则错题本里的「去复习」会跳过去却找不到目标。

   **一页可能有多张清单**（毕业项目页就是三组验收标准并排），所以这里遍历全部，
   序号跨清单连续。只取第一张的话，第二组之后的项会整个从错题本、自测题库和
   进度统计里消失——数还是那个数，但数的是错的东西。 */
let hwIndex = null;
function buildHwIndex() {
  if (hwIndex) return hwIndex;
  hwIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    buildHwIndexFrom(tmp, null, it);
  });
  return hwIndex;
}

/* 往已有索引里补一棵子树的作业项。map 给出「li → 完整 id」的替换映射——
   就地展开的那三块勾不在 it.html 的文章序里（它们是克隆出来的），
   靠全局计数推不出它们的 id，只能由调用方把算好的 id 交进来。 */
function buildHwIndexFrom(root, map, it) {
  let gid = 0;
  $$('ol.hw-list', root).forEach(list => {
    $$(':scope > li', list).forEach(li => {
      const i = gid++;
      const id = map && map.get(li) ? map.get(li) : (it.id + ':' + i);
      if (hwIndex.some(x => x.id === id)) return;    // 同一页重复展开不重复登记
      const txt = String(li.textContent || '').replace(/\s+/g, ' ').trim();
      hwIndex.push({
        id: id, itemId: it.id, kind: 'hw', no: i + 1,
        title: hwNoun(it) + ' ' + (i + 1) + ' · '
          + (txt.length > 44 ? txt.slice(0, 44) + '…' : txt),
        full: txt                      // 错题本用截断的 title，自测要完整题面
      });
    });
  });
}

/* 两个索引都建好之后，任何一个练习项 id 都能查到它的归属 */
function pracRow(id) {
  return buildExIndex().find(e => e.id === id) || buildHwIndex().find(h => h.id === id) || null;
}

/* 抽题索引：把例题拆成「题面」与「参考答案」两块，供自测遮住答案用。
   ------------------------------------------------------------------
   编号规则必须和 buildExIndex() 一字不差——同样按 details.answer 的文档序
   计数、「运行效果」块也照常占号——否则自测里判的错落不到错题本上。

   分段的单位是**答案块**，不是例题标题：有一节课（模块与包）是一个标题配
   utils.py / main.py 两个答案块，按标题分段会少抽出一道。

   题面 = 例题标题 + 到这一个答案为止的全部散文（含「运行效果」——
          "打印出如下效果"指的就是它）
   答案 = 这一个答案块（脱掉 <details> 外壳）+ 紧随其后到下一个答案之间的
          说明段（「解析」就落在这里） */
let quizIndex = null;
function buildQuizIndex() {
  if (quizIndex) return quizIndex;
  quizIndex = [];
  ITEMS.forEach(it => {
    const tmp = document.createElement('div');
    tmp.innerHTML = it.html;
    const segs = [];
    let cur = null, n = 0;

    Array.prototype.forEach.call(tmp.children, el => {
      if (el.tagName === 'H3') { cur = null; return; }
      if (el.tagName === 'H4' && el.classList.contains('ex-title')) {
        cur = { title: el.textContent.trim(), nodes: [] };
        segs.push(cur);
        cur.nodes.push({ el });
        return;
      }
      if (el.tagName === 'DETAILS' && el.classList.contains('answer')) {
        const id = 'ex-' + it.id + '-' + (n++);   // .out 也占号，与 buildExIndex 同序
        if (!cur) return;                          // 例题区之外的块（当前数据没有，防御而已）
        cur.nodes.push({ el, id, isOut: el.classList.contains('out') });
        return;
      }
      if (cur) cur.nodes.push({ el });
    });

    segs.forEach(sec => {
      const as = sec.nodes.filter(x => x.id && !x.isOut);
      if (!as.length) return;
      as.forEach((a, k) => {
        const at = sec.nodes.indexOf(a);
        const stop = as[k + 1] ? sec.nodes.indexOf(as[k + 1]) : sec.nodes.length;
        // 题面只收散文和「运行效果」——同一例题里的**其它答案**必须挡在外面，
        // 否则第二题的题面里就印着第一题的答案
        const qs = sec.nodes.slice(0, at).filter(x => !x.id || x.isOut);
        /* 有些例题的标题后面直接就是代码，题面等于只有一行标题
           （"九九乘法表"这种标题本身就是完整题目，成立；
           "找出隐藏的 bug"那种代码才是题目，就不够了）。
           结构上区分不了这两种，所以不猜——如实告诉用户，并给一个回课文的出口。 */
        const hasProse = qs.some(x => x.el.tagName !== 'H4'
          && String(x.el.textContent || '').trim().length > 0);
        quizIndex.push({
          id: a.id, itemId: it.id, kind: 'ex', bare: !hasProse,
          // 一个标题配多个答案时标上 (1/2)，否则两道的标题完全一样
          title: sec.title + (as.length > 1 ? `（${k + 1}/${as.length}）` : ''),
          q: qs.map(x => x.el.outerHTML).join(''),
          a: a.el.innerHTML.replace(/<summary[\s\S]*?<\/summary>/, '')
            + sec.nodes.slice(at + 1, stop).map(x => x.el.outerHTML).join('')
        });
      });
    });
  });
  return quizIndex;
}

const RATE_HTML = `

function decorateAnswers(it) {

function paintAnswerMark(d, mark) {

  // 挂在摘要行上的这块小字，顺手告诉你下次什么时候再来碰它
  const r = state.rev[d.dataset.ex];

}

function refreshExGauge() {
  const bar = $('#exBar'), txt = $('#exTxt');
  if (!bar || !txt) return;
  const all = $$('details.answer', $('#lessonBody')).filter(d => !d.classList.contains('out'));
  if (!all.length) return;
  const rated = all.filter(d => d.dataset.mark === '1' || d.dataset.mark === '-1').length;
  bar.style.width = (rated / all.length * 100) + '%';
