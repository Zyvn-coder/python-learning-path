[13/Sep/2026:10:00:00] \"GET /a HTTP/1.1\" 200 123 ，提取 IP、时间、路径、状态码。"},{"id":"s3-l20","kind":"lesson","no":20,"title":"并发编程","time":"5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>并发（轮流处理）≠ 并行（同时处理）。GIL：CPython 里同一进程的多线程\u003cstrong>不能并行执行 Python 字节码\u003c/strong>。\u003c/li>\n\u003cli>结论先行：\u003cstrong>IO 密集\u003c/strong>（网络/磁盘等待多）→ 多线程或异步有效；\u003cstrong>CPU 密集\u003c/strong>（纯计算）→ 多进程。\u003c/li>\n\u003cli>\u003ccode>threading.Thread(target=f, args=(...))\u003c/code>，\u003ccode>start()\u003c/code> 启动，\u003ccode>join()\u003c/code> 等待结束。\u003c/li>\n\u003cli>竞态条件：多线程同时改同一个数据会出错；用 \u003ccode>threading.Lock()\u003c/code> 保护，\u003ccode>with lock:\u003c/code> 自动加解锁。\u003c/li>\n\u003cli>\u003ccode>multiprocessing.Process\u003c/code> 用法几乎同 Thread，每个进程有独立内存和解释器（绕开 GIL）。\u003c/li>\n\u003cli>实战首选 \u003ccode>concurrent.futures\u003c/code> 的线程池/进程池：自动管理线程、自动 join、结果有序。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">threading\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">download\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 开始\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>                  \u003cspan class=\"c1\"># 模拟 IO 等待\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 完成\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"n\">start\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"n\">threads\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">threading\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">Thread\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">target\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">download\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"文件\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,))\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">)]\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">t\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">threads\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">t\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">start\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">t\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">threads\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">t\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">join\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"总耗时 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">start\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.1f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">s\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>   \u003cspan class=\"c1\"># 约 2s，而不是 6s\u003c/span>\n\n\u003cspan class=\"n\">lock\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">threading\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">Lock\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">unsafe_add\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"k\">global\u003c/span> \u003cspan class=\"n\">count\u003c/span>\n    \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">_\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">100000\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">lock\u003c/span>\u003cspan class=\"p\">:\u003c/span>                 \u003cspan class=\"c1\"># 把这两行去掉试试：结果会小于预期\u003c/span>\n            \u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：线程池并发\u003c/h4>\n\u003cp>用 \u003ccode>ThreadPoolExecutor\u003c/code> 并发「请求」5 个 URL（\u003ccode>sleep(1)\u003c/code> 模拟），对比串行 5 秒、并发几秒。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">concurrent.futures\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">ThreadPoolExecutor\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">fetch\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">url\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">)\u003c/span>                  \u003cspan class=\"c1\"># 模拟网络请求\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">url\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 的内容\"\u003c/span>\n\n\u003cspan class=\"n\">urls\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"https://site.com/page/\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">)]\u003c/span>\n\u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">ThreadPoolExecutor\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">max_workers\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">pool\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">results\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">pool\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">map\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fetch\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">urls\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">results\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"s2\">\"个结果\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>       \u003cspan class=\"c1\"># 总耗时约 1s，而不是 5s\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>池自动创建/回收线程并 join；\u003ccode>map\u003c/code> 按输入顺序返回结果。把 \u003ccode>max_workers\u003c/code> 改成 1，对比耗时，体会\"并发\"到底省在哪。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：多进程算 CPU 密集任务\u003c/h4>\n\u003cp>用 \u003ccode>ProcessPoolExecutor\u003c/code> 把 4 个 CPU 密集任务真正分到多个核，注意 Windows 的 \u003ccode>__main__\u003c/code> 护身符。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">concurrent.futures\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">ProcessPoolExecutor\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">heavy\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\n\u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"vm\">__name__\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"s2\">\"__main__\"\u003c/span>\u003cspan class=\"p\">:\u003c/span>         \u003cspan class=\"c1\"># 多进程必须加这句护身符！\u003c/span>\n    \u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">ProcessPoolExecutor\u003c/span>\u003cspan class=\"p\">()\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">pool\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">results\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">pool\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">map\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">heavy\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"mi\">10_000_000\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">results\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>4 个任务分给 4 个 CPU 核真正并行；不加 \u003ccode>if __name__ == \"__main__\":\u003c/code> 在 Windows 下会无限递归开进程直接报错。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>线程池并发\"下载\"10 个文件（sleep 模拟），打印串行与并发的耗时对比。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>复现竞态：两个线程各给 count 加 100000 次，先不加锁观察错误结果，再加 Lock 修复。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>多进程分段计算 1 到 4000000 的和（分 4 段再合并），与单进程比耗时。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>queue.Queue\u003c/code> 实现\"一个生产者造数据 + 两个消费者处理数据\"模型。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>写线程安全的 \u003ccode>BankAccount\u003c/code>（所有改余额的方法加锁），开 10 个线程各存款 100 次，验证余额分毫不差。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 并发（轮流处理）≠ 并行（同时处理）。GIL：CPython 里同一进程的多线程 不能并行执行 Python 字节码 。 结论先行： IO 密集 （网络/磁盘等待多）→ 多线程或异步有效； CPU 密集 （纯计算）→ 多进程。 threading.Thread(target=f, args=(...)) ， start() 启动， join() 等待结束。 竞态条件：多线程同时改同一个数据会出错；用 threading.Lock() 保护， with lock: 自动加解锁。 multiprocessing.Process 用法几乎同 Thread，每个进程有独立内存和解释器（绕开 GIL）。 实战首选 concurrent.futures 的线程池/进程池：自动管理线程、自动 join、结果有序。 💡 例题 例题 1：线程池并发 用 ThreadPoolExecutor 并发「请求」5 个 URL（ sleep(1) 模拟），对比串行 5 秒、并发几秒。 参考答案 解析 池自动创建/回收线程并 join； map 按输入顺序返回结果。把 max_workers 改成 1，对比耗时，体会\"并发\"到底省在哪。 例题 2：多进程算 CPU 密集任务 用 ProcessPoolExecutor 把 4 个 CPU 密集任务真正分到多个核，注意 Windows 的 __main__ 护身符。 参考答案 解析 4 个任务分给 4 个 CPU 核真正并行；不加 if __name__ == \"__main__\": 在 Windows 下会无限递归开进程直接报错。 ✏️ 作业 基础 线程池并发\"下载\"10 个文件（sleep 模拟），打印串行与并发的耗时对比。 基础 复现竞态：两个线程各给 count 加 100000 次，先不加锁观察错误结果，再加 Lock 修复。 进阶 多进程分段计算 1 到 4000000 的和（分 4 段再合并），与单进程比耗时。 进阶 用 queue.Queue 实现\"一个生产者造数据 + 两个消费者处理数据\"模型。 挑战 写线程安全的 BankAccount （所有改余额的方法加锁），开 10 个线程各存款 100 次，验证余额分毫不差。"},{"id":"s3-l21","kind":"lesson","no":21,"title":"异步编程 asyncio","time":"4–5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>协程：\u003ccode>async def\u003c/code> 定义的函数；调用它得到协程对象\u003cstrong>不会立刻执行\u003c/strong>，\u003ccode>await\u003c/code> 处才真正运行并在等待时让出控制权。\u003c/li>\n\u003cli>事件循环：单线程调度器，谁在等 IO 就切去跑别人——单线程也能高并发。\u003c/li>\n\u003cli>入口 \u003ccode>asyncio.run(main())\u003c/code>；并发执行多个协程：\u003ccode>asyncio.gather(*tasks)\u003c/code> 或 \u003ccode>asyncio.create_task\u003c/code>。\u003c/li>\n\u003cli>铁律：协程里\u003cstrong>不能调用阻塞函数\u003c/strong>（\u003ccode>time.sleep\u003c/code>、普通 \u003ccode>requests\u003c/code>），否则整个事件循环被卡死。异步等待用 \u003ccode>asyncio.sleep\u003c/code>，异步请求用 \u003ccode>httpx\u003c/code>/\u003ccode>aiohttp\u003c/code>。\u003c/li>\n\u003cli>选型：高并发网络 IO（爬虫、接口服务）→ asyncio；简单脚本 → 线程池；CPU 密集 → 多进程。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">asyncio\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">download\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">seconds\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 开始\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">seconds\u003c/span>\u003cspan class=\"p\">)\u003c/span>         \u003cspan class=\"c1\"># 模拟异步 IO\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 完成\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">name\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"n\">start\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n    \u003cspan class=\"n\">results\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">gather\u003c/span>\u003cspan class=\"p\">(\u003c/span>      \u003cspan class=\"c1\"># 三个任务并发执行\u003c/span>\n        \u003cspan class=\"n\">download\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"A\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n        \u003cspan class=\"n\">download\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"B\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n        \u003cspan class=\"n\">download\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"C\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">results\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"总耗时 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"n\">start\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.1f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">s\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"c1\"># 总耗时 ≈ 3s（取决于最慢的那个），而不是 6s\u003c/span>\n\n\u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">run\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">main\u003c/span>\u003cspan class=\"p\">())\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：信号量限流\u003c/h4>\n\u003cp>用 \u003ccode>asyncio.Semaphore(3)\u003c/code> 给 10 个并发任务限流，同时最多只跑 3 个。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">asyncio\u003c/span>\n\n\u003cspan class=\"n\">sem\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">Semaphore\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">)\u003c/span>               \u003cspan class=\"c1\"># 最多同时 3 个\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">fetch\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">sem\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"#\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 开始\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"#\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 结束\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">i\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">gather\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fetch\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">)))\u003c/span>\n\n\u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">run\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">main\u003c/span>\u003cspan class=\"p\">())\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>不限流则 10 个任务同时开闸；\u003ccode>Semaphore(3)\u003c/code> 之后每批最多 3 个——这是爬虫\"礼貌守则\"的基础设施。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：带超时的调用\u003c/h4>\n\u003cp>用一个要 5 秒的调用配上 2 秒超时，超时就走兜底逻辑，别让程序卡死。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">asyncio\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">slow_api\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"s2\">\"data\"\u003c/span>\n\n\u003cspan class=\"k\">async\u003c/span> \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">main\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">result\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"k\">await\u003c/span> \u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">wait_for\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">slow_api\u003c/span>\u003cspan class=\"p\">(),\u003c/span> \u003cspan class=\"n\">timeout\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">except\u003c/span> \u003cspan class=\"ne\">TimeoutError\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"超时，走兜底逻辑\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"n\">result\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"默认数据\"\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">result\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"n\">asyncio\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">run\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">main\u003c/span>\u003cspan class=\"p\">())\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>wait_for\u003c/code> 超时即取消任务并抛 \u003ccode>TimeoutError\u003c/code>——网络程序永远要有超时兜底。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>把第 20 课题 1 的线程池版本改写成 asyncio 版，对比两者代码量。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>httpx\u003c/code>（\u003ccode>pip install httpx\u003c/code>）+ gather 并发请求 5 个 URL，打印各自状态码和总耗时。\n   骨架：\u003ccode>async with httpx.AsyncClient() as client: r = await client.get(url)\u003c/code>\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>给作业 2 加 \u003ccode>Semaphore(2)\u003c/code> 限流，观察请求节奏变化。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>asyncio.Queue\u003c/code> 实现异步生产者/消费者。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>写\"并发 ping 多台主机\"工具：\u003ccode>await asyncio.create_subprocess_exec(\"ping\", host, ...)\u003c/code> 同时执行系统命令并汇总结果。\u003c/li>\n\u003c/ol>","counts":{"kp":5,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 协程： async def 定义的函数；调用它得到协程对象 不会立刻执行 ， await 处才真正运行并在等待时让出控制权。 事件循环：单线程调度器，谁在等 IO 就切去跑别人——单线程也能高并发。 入口 asyncio.run(main()) ；并发执行多个协程： asyncio.gather(*tasks) 或 asyncio.create_task 。 铁律：协程里 不能调用阻塞函数 （ time.sleep 、普通 requests ），否则整个事件循环被卡死。异步等待用 asyncio.sleep ，异步请求用 httpx / aiohttp 。 选型：高并发网络 IO（爬虫、接口服务）→ asyncio；简单脚本 → 线程池；CPU 密集 → 多进程。 💡 例题 例题 1：信号量限流 用 asyncio.Semaphore(3) 给 10 个并发任务限流，同时最多只跑 3 个。 参考答案 解析 不限流则 10 个任务同时开闸； Semaphore(3) 之后每批最多 3 个——这是爬虫\"礼貌守则\"的基础设施。 例题 2：带超时的调用 用一个要 5 秒的调用配上 2 秒超时，超时就走兜底逻辑，别让程序卡死。 参考答案 解析 wait_for 超时即取消任务并抛 TimeoutError ——网络程序永远要有超时兜底。 ✏️ 作业 基础 把第 20 课题 1 的线程池版本改写成 asyncio 版，对比两者代码量。 进阶 用 httpx （ pip install httpx ）+ gather 并发请求 5 个 URL，打印各自状态码和总耗时。 骨架： async with httpx.AsyncClient() as client: r = await client.get(url) 进阶 给作业 2 加 Semaphore(2) 限流，观察请求节奏变化。 进阶 用 asyncio.Queue 实现异步生产者/消费者。 挑战 写\"并发 ping 多台主机\"工具： await asyncio.create_subprocess_exec(\"ping\", host, ...) 同时执行系统命令并汇总结果。"},{"id":"s3-l22","kind":"lesson","no":22,"title":"网络请求与 API","time":"4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>HTTP 常识：GET 拿数据、POST 交数据；状态码 2xx 成功、4xx 你这边的错、5xx 服务器错。\u003c/li>\n\u003cli>\u003ccode>pip install requests\u003c/code>。标准流程：\u003ccode>r = requests.get(url, params=..., headers=..., timeout=10)\u003c/code> → \u003ccode>r.raise_for_status()\u003c/code> → \u003ccode>r.json()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>必须设 timeout\u003c/strong>；网络失败会抛 \u003ccode>requests.exceptions.*\u003c/code> 异常，要捕获。\u003c/li>\n\u003cli>需要 key 的 API：key 放请求头 \u003ccode>headers={\"Authorization\": \"Bearer &lt;key&gt;\"}\u003c/code>；\u003cstrong>永远不要把 key 写死进代码提交到 git\u003c/strong>（用环境变量 \u003ccode>os.environ\u003c/code>）。\u003c/li>\n\u003cli>礼貌与合规：看目标站点的服务条款与 robots、控制请求频率、只抓公开数据。\u003c/li>\n\u003cli>免 key 的练手 API：GitHub API、open-meteo 天气、ip-api。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">requests\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">get_user_repos\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">user\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"n\">url\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"https://api.github.com/users/\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">user\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">/repos\"\u003c/span>\n    \u003cspan class=\"n\">r\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">url\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">params\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s2\">\"per_page\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">},\u003c/span> \u003cspan class=\"n\">timeout\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">raise_for_status\u003c/span>\u003cspan class=\"p\">()\u003c/span>                       \u003cspan class=\"c1\"># 4xx/5xx 直接抛异常\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">json\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\n\u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">repo\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">get_user_repos\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"octocat\"\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">repo\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s1\">'name'\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">: ⭐\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">repo\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s1\">'stargazers_count'\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">except\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">RequestException\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"请求失败:\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：带重试与退避的健壮请求\u003c/h4>\n\u003cp>写 \u003ccode>robust_get(url, retries=3)\u003c/code>：失败就重试，间隔用指数退避（2s、4s、8s），用尽后抛异常。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">requests\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">robust_get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">url\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">retries\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">Response\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">retries\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n            \u003cspan class=\"n\">r\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">url\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">timeout\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n            \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">raise_for_status\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n            \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">r\u003c/span>\n        \u003cspan class=\"k\">except\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">RequestException\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n            \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"第 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 次失败：\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n            \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"n\">retries\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n                \u003cspan class=\"k\">raise\u003c/span>\n            \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"p\">)\u003c/span>                 \u003cspan class=\"c1\"># 指数退避：2s、4s、8s\u003c/span>\n\n\u003cspan class=\"n\">data\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">robust_get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"https://api.github.com/users/octocat\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">json\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">data\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"login\"\u003c/span>\u003cspan class=\"p\">])\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>这是第 17 课 retry 装饰器的函数版；\"指数退避\"（越失败等越久）是行业惯例，别失败后立刻疯狂重试。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：免 key 天气查询（open-meteo）\u003c/h4>\u003cp>调 open-meteo 拿当前天气，传经纬度，返回温度和风速。别忘了 \u003ccode>timeout\u003c/code> 和 \u003ccode>raise_for_status()\u003c/code>。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">weather\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">lat\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">lon\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">r\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">requests\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n        \u003cspan class=\"s2\">\"https://api.open-meteo.com/v1/forecast\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n        \u003cspan class=\"n\">params\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s2\">\"latitude\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"n\">lat\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"longitude\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"n\">lon\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"current_weather\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"true\"\u003c/span>\u003cspan class=\"p\">},\u003c/span>\n        \u003cspan class=\"n\">timeout\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">raise_for_status\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n    \u003cspan class=\"n\">cw\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">r\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">json\u003c/span>\u003cspan class=\"p\">()[\u003c/span>\u003cspan class=\"s2\">\"current_weather\"\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"温度 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">cw\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s1\">'temperature'\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">°C，风速 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">cw\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s1\">'windspeed'\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">weather\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mf\">39.9\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mf\">116.4\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>查询自己 IP 的归属地（\u003ccode>http://ip-api.com/json/\u003c/code>）并格式化打印。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 GitHub 搜索 API（\u003ccode>https://api.github.com/search/repositories?q=python\u003c/code>）打印前 5 个仓库的名称、星数、语言。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>把作业 2 的结果保存成 json 文件。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>给 \u003ccode>robust_get\u003c/code> 加\"滑动窗口限流\"：1 秒内最多 2 次请求（提示：记录时间戳列表）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>命令行天气工具：输入城市名 → 先用 geocoding API（\u003ccode>https://geocoding-api.open-meteo.com/v1/search?name=北京\u003c/code>）查坐标 → 再查天气；城市查不到要有提示。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 HTTP 常识：GET 拿数据、POST 交数据；状态码 2xx 成功、4xx 你这边的错、5xx 服务器错。 pip install requests 。标准流程： r = requests.get(url, params=..., headers=..., timeout=10) → r.raise_for_status() → r.json() 。 必须设 timeout ；网络失败会抛 requests.exceptions.* 异常，要捕获。 需要 key 的 API：key 放请求头 headers={\"Authorization\": \"Bearer &lt;key&gt;\"} ； 永远不要把 key 写死进代码提交到 git （用环境变量 os.environ ）。 礼貌与合规：看目标站点的服务条款与 robots、控制请求频率、只抓公开数据。 免 key 的练手 API：GitHub API、open-meteo 天气、ip-api。 💡 例题 例题 1：带重试与退避的健壮请求 写 robust_get(url, retries=3) ：失败就重试，间隔用指数退避（2s、4s、8s），用尽后抛异常。 参考答案 解析 这是第 17 课 retry 装饰器的函数版；\"指数退避\"（越失败等越久）是行业惯例，别失败后立刻疯狂重试。 例题 2：免 key 天气查询（open-meteo） 调 open-meteo 拿当前天气，传经纬度，返回温度和风速。别忘了 timeout 和 raise_for_status() 。 参考答案 ✏️ 作业 基础 查询自己 IP 的归属地（ http://ip-api.com/json/ ）并格式化打印。 基础 用 GitHub 搜索 API（ https://api.github.com/search/repositories?q=python ）打印前 5 个仓库的名称、星数、语言。 基础 把作业 2 的结果保存成 json 文件。 进阶 给 robust_get 加\"滑动窗口限流\"：1 秒内最多 2 次请求（提示：记录时间戳列表）。 挑战 命令行天气工具：输入城市名 → 先用 geocoding API（ https://geocoding-api.open-meteo.com/v1/search?name=北京 ）查坐标 → 再查天气；城市查不到要有提示。"},{"id":"s3-l23","kind":"lesson","no":23,"title":"数据库操作（sqlite3 与 ORM 初探）","time":"4–5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>为什么不用文件：查询快、支持并发、有类型和约束。SQLite = 单文件、零配置，Python 内置 \u003ccode>sqlite3\u003c/code>，学习和小项目完全够用。\u003c/li>\n\u003cli>标准流程：\u003ccode>connect(库文件)\u003c/code> → \u003ccode>execute(SQL, 参数)\u003c/code> → 写操作要 \u003ccode>commit()\u003c/code> → \u003ccode>close()\u003c/code>。推荐 \u003ccode>with conn:\u003c/code> 块，自动提交/回滚。\u003c/li>\n\u003cli>SQL 四件套：\u003ccode>CREATE TABLE\u003c/code> / \u003ccode>INSERT INTO\u003c/code> / \u003ccode>SELECT ... WHERE ... ORDER BY\u003c/code> / \u003ccode>UPDATE ... SET\u003c/code> / \u003ccode>DELETE FROM\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>参数化查询\u003c/strong> \u003ccode>execute(sql, (a, b))\u003c/code>，占位符 \u003ccode>?\u003c/code>。字符串拼接 SQL = SQL 注入漏洞，\u003cstrong>绝对禁止\u003c/strong>。\u003c/li>\n\u003cli>事务：\u003ccode>with conn:\u003c/code> 块里所有语句要么全成功要么全回滚。\u003c/li>\n\u003cli>ORM（SQLAlchemy）：把表映射成类、SQL 变成 Python 调用。\u003cstrong>先会 SQL，再碰 ORM\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">sqlite3\u003c/span>\n\n\u003cspan class=\"n\">conn\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">sqlite3\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">connect\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"school.db\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"\"\"CREATE TABLE IF NOT EXISTS student (\u003c/span>\n\u003cspan class=\"s2\">    id     INTEGER PRIMARY KEY,\u003c/span>\n\u003cspan class=\"s2\">    name   TEXT NOT NULL,\u003c/span>\n\u003cspan class=\"s2\">    score  REAL\u003c/span>\n\u003cspan class=\"s2\">)\"\"\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">:\u003c/span>                                          \u003cspan class=\"c1\"># 自动 commit / 出错自动回滚\u003c/span>\n    \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"INSERT INTO student (name, score) VALUES (?, ?)\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小明\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">92\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"INSERT INTO student (name, score) VALUES (?, ?)\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小红\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">88\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\n\u003cspan class=\"n\">rows\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"s2\">\"SELECT name, score FROM student WHERE score &gt;= ? ORDER BY score DESC\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">90\u003c/span>\u003cspan class=\"p\">,),\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">fetchall\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">rows\u003c/span>\u003cspan class=\"p\">)\u003c/span>                 \u003cspan class=\"c1\"># [('小明', 92.0)]\u003c/span>\n\n\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">close\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题：迷你学生库（增删改查齐全）\u003c/h4>\n\u003cp>用 \u003ccode>sqlite3\u003c/code> 建 student 表并写增、改、查三个函数，全程参数化查询；UPDATE 后检查 \u003ccode>rowcount\u003c/code>。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">sqlite3\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">add_student\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"INSERT INTO student (name, score) VALUES (?, ?)\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">update_score\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">cur\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"UPDATE student SET score = ? WHERE name = ?\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">score\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">cur\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">rowcount\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">:\u003c/span>                     \u003cspan class=\"c1\"># 影响行数为 0 = 没这个人\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 不存在\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">top_students\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n        \u003cspan class=\"s2\">\"SELECT name, score FROM student ORDER BY score DESC LIMIT ?\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">,)\u003c/span>\n    \u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">fetchall\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\n\u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">sqlite3\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">connect\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"school.db\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">execute\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"\"\"CREATE TABLE IF NOT EXISTS student\u003c/span>\n\u003cspan class=\"s2\">                    (id INTEGER PRIMARY KEY, name TEXT, score REAL)\"\"\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"n\">add_student\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小刚\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">75\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"n\">update_score\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小刚\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">95\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">top_students\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">conn\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>cur.rowcount\u003c/code> 告诉你上一条写语句影响了几行——UPDATE/DELETE 之后必须检查\"是否真的改到了\"。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>建图书表 books（书名/作者/价格/库存），写全增、删、改、查四个函数。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>聚合查询：统计学生总数和平均分（\u003ccode>SELECT COUNT(*), AVG(score) FROM student\u003c/code>）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>在\u003cstrong>复制出来的练习库\u003c/strong>上演示注入危害：用字符串拼接把名字设成 \u003ccode>'; DROP TABLE student; --\u003c/code>，观察表被删；再用参数化查询修复。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>executemany\u003c/code> 从 json 文件批量导入 100 条数据。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>写一个 MiniORM 类：\u003ccode>User.save()\u003c/code>、\u003ccode>User.find_by(name=...)\u003c/code>，体会 SQLAlchemy 之类的工具到底帮你解决了什么问题。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":1,"hw":5,"points":0,"codes":2,"answers":1},"text":"📚 知识点 为什么不用文件：查询快、支持并发、有类型和约束。SQLite = 单文件、零配置，Python 内置 sqlite3 ，学习和小项目完全够用。 标准流程： connect(库文件) → execute(SQL, 参数) → 写操作要 commit() → close() 。推荐 with conn: 块，自动提交/回滚。 SQL 四件套： CREATE TABLE / INSERT INTO / SELECT ... WHERE ... ORDER BY / UPDATE ... SET / DELETE FROM 。 参数化查询 execute(sql, (a, b)) ，占位符 ? 。字符串拼接 SQL = SQL 注入漏洞， 绝对禁止 。 事务： with conn: 块里所有语句要么全成功要么全回滚。 ORM（SQLAlchemy）：把表映射成类、SQL 变成 Python 调用。 先会 SQL，再碰 ORM 。 💡 例题 例题：迷你学生库（增删改查齐全） 用 sqlite3 建 student 表并写增、改、查三个函数，全程参数化查询；UPDATE 后检查 rowcount 。 参考答案 解析 cur.rowcount 告诉你上一条写语句影响了几行——UPDATE/DELETE 之后必须检查\"是否真的改到了\"。 ✏️ 作业 基础 建图书表 books（书名/作者/价格/库存），写全增、删、改、查四个函数。 基础 聚合查询：统计学生总数和平均分（ SELECT COUNT(*), AVG(score) FROM student ）。 进阶 在 复制出来的练习库 上演示注入危害：用字符串拼接把名字设成 '; DROP TABLE student; -- ，观察表被删；再用参数化查询修复。 进阶 用 executemany 从 json 文件批量导入 100 条数据。 挑战 写一个 MiniORM 类： User.save() 、 User.find_by(name=...) ，体会 SQLAlchemy 之类的工具到底帮你解决了什么问题。"},{"id":"s3-l24","kind":"lesson","no":24,"title":"测试、调试与日志","time":"4–5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>测试观念：写代码时顺手写测试（pytest 是事实标准，\u003ccode>pip install pytest\u003c/code>）。\u003c/li>\n\u003cli>约定：测试文件命名 \u003ccode>test_xxx.py\u003c/code>，测试函数命名 \u003ccode>test_yyy()\u003c/code>，断言直接用 \u003ccode>assert\u003c/code>。\u003c/li>\n\u003cli>参数化 \u003ccode>@pytest.mark.parametrize\u003c/code> 一份逻辑测多组数据；测异常用 \u003ccode>with pytest.raises(...)\u003c/code>。\u003c/li>\n\u003cli>fixture：准备/清理测试环境（临时文件、样例数据）；\u003ccode>tmp_path\u003c/code> 是内置的临时目录 fixture。\u003c/li>\n\u003cli>\u003ccode>print\u003c/code> 调试的正规升级是 logging：级别 DEBUG &lt; INFO &lt; WARNING &lt; ERROR，可同时输出到屏幕和文件，上线时只改一个级别参数。\u003c/li>\n\u003cli>断点调试：代码里写 \u003ccode>breakpoint()\u003c/code> 进 pdb（\u003ccode>l\u003c/code> 看代码、\u003ccode>p 变量名\u003c/code> 打印、\u003ccode>c\u003c/code> 继续、\u003ccode>q\u003c/code> 退出）；VS Code 里打断点更舒服。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"c1\"># ---- test_utils.py（utils.py 里已有 is_prime）----\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">pytest\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">utils\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">is_prime\u003c/span>\n\n\u003cspan class=\"nd\">@pytest\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">mark\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">parametrize\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"n, expected\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"p\">[\u003c/span>\n    \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">4\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">False\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n    \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">17\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">True\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">False\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">False\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">-\u003c/span>\u003cspan class=\"mi\">5\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"kc\">False\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n\u003cspan class=\"p\">])\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">test_is_prime\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">expected\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">assert\u003c/span> \u003cspan class=\"n\">is_prime\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"ow\">is\u003c/span> \u003cspan class=\"n\">expected\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"hl\" data-lang=\"bash\">\u003cpre>\u003ccode>&gt;\u003cspan class=\"w\"> \u003c/span>pytest\u003cspan class=\"w\"> \u003c/span>-v\u003cspan class=\"w\">        \u003c/span>\u003cspan class=\"c1\"># 每组参数一行结果，一目了然\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"c1\"># ---- logging 基本配置 ----\u003c/span>\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">logging\u003c/span>\n\u003cspan class=\"n\">logging\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">basicConfig\u003c/span>\u003cspan class=\"p\">(\u003c/span>\n    \u003cspan class=\"n\">level\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"n\">logging\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">INFO\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"nb\">format\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">%(asctime)s\u003c/span>\u003cspan class=\"s2\"> \u003c/span>\u003cspan class=\"si\">%(levelname)s\u003c/span>\u003cspan class=\"s2\"> \u003c/span>\u003cspan class=\"si\">%(message)s\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,\u003c/span>\n    \u003cspan class=\"n\">handlers\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"p\">[\u003c/span>\n        \u003cspan class=\"n\">logging\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">FileHandler\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"app.log\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">encoding\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"utf-8\"\u003c/span>\u003cspan class=\"p\">),\u003c/span>\n        \u003cspan class=\"n\">logging\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">StreamHandler\u003c/span>\u003cspan class=\"p\">(),\u003c/span>               \u003cspan class=\"c1\"># 同时输出到屏幕\u003c/span>\n    \u003cspan class=\"p\">],\u003c/span>\n\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">log\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">logging\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">getLogger\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"vm\">__name__\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">withdraw\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">balance\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">amount\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">log\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">info\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"取款请求: 余额=\u003c/span>\u003cspan class=\"si\">%.2f\u003c/span>\u003cspan class=\"s2\">, 金额=\u003c/span>\u003cspan class=\"si\">%.2f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">balance\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">amount\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">amount\u003c/span> \u003cspan class=\"o\">&gt;\u003c/span> \u003cspan class=\"n\">balance\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">log\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">error\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"取款失败: 余额不足\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">raise\u003c/span> \u003cspan class=\"ne\">ValueError\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"余额不足\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">balance\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"n\">amount\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题：给\"安全输入\"函数写测试（不等人敲键盘）\u003c/h4>\n\u003cp>用 \u003ccode>pytest\u003c/code> + \u003ccode>monkeypatch\u003c/code> 给 \u003ccode>ask_int\u003c/code> 写三个测试：正常输入、先错后对、永远不合法。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">pytest\u003c/span>\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">utils\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">ask_int\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">test_valid_input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">setattr\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"builtins.input\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"k\">lambda\u003c/span> \u003cspan class=\"n\">_\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"42\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>   \u003cspan class=\"c1\"># 伪装 input\u003c/span>\n    \u003cspan class=\"k\">assert\u003c/span> \u003cspan class=\"n\">ask_int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"数字：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">42\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">test_retry_on_bad_input\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">answers\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">iter\u003c/span>\u003cspan class=\"p\">([\u003c/span>\u003cspan class=\"s2\">\"abc\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"7\"\u003c/span>\u003cspan class=\"p\">])\u003c/span>                            \u003cspan class=\"c1\"># 第一次给坏值\u003c/span>\n    \u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">setattr\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"builtins.input\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"k\">lambda\u003c/span> \u003cspan class=\"n\">_\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">next\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">answers\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"k\">assert\u003c/span> \u003cspan class=\"n\">ask_int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"数字：\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">7\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">test_never_valid\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">answers\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">iter\u003c/span>\u003cspan class=\"p\">([\u003c/span>\u003cspan class=\"s2\">\"-1\"\u003c/span>\u003cspan class=\"p\">])\u003c/span>                                  \u003cspan class=\"c1\"># 永远不合法\u003c/span>\n    \u003cspan class=\"n\">monkeypatch\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">setattr\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"builtins.input\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"k\">lambda\u003c/span> \u003cspan class=\"n\">_\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">next\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">answers\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n    \u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"n\">pytest\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">raises\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"ne\">StopIteration\u003c/span>\u003cspan class=\"p\">):\u003c/span>                      \u003cspan class=\"c1\"># 循环卡到输入耗尽\u003c/span>\n        \u003cspan class=\"n\">ask_int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"数字：\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">low\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>monkeypatch\u003c/code> 把 \u003ccode>input\u003c/code> 换成假函数，测试就能全自动跑。\"能不能被轻松测试\"本身就是代码设计好坏的试金石。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>给第 9 课的 \u003ccode>count_vowels\u003c/code>、\u003ccode>is_leap\u003c/code> 写完整测试（正常值 + 边界值 + 非法值）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 parametrize 测闰年，必须包含 2000（闰）和 1900（平）两个经典年份。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>给待办项目的文件读写加测试：用内置的 \u003ccode>tmp_path\u003c/code> fixture 造临时目录，测\"保存后能读回\"。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>pytest.raises\u003c/code> 测试 BankAccount 取款超额抛 \u003ccode>ValueError\u003c/code>。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>给待办事项项目全程加 logging，把每次增删改查都写进 app.log。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":1,"hw":5,"points":0,"codes":4,"answers":1},"text":"📚 知识点 测试观念：写代码时顺手写测试（pytest 是事实标准， pip install pytest ）。 约定：测试文件命名 test_xxx.py ，测试函数命名 test_yyy() ，断言直接用 assert 。 参数化 @pytest.mark.parametrize 一份逻辑测多组数据；测异常用 with pytest.raises(...) 。 fixture：准备/清理测试环境（临时文件、样例数据）； tmp_path 是内置的临时目录 fixture。 print 调试的正规升级是 logging：级别 DEBUG &lt; INFO &lt; WARNING &lt; ERROR，可同时输出到屏幕和文件，上线时只改一个级别参数。 断点调试：代码里写 breakpoint() 进 pdb（ l 看代码、 p 变量名 打印、 c 继续、 q 退出）；VS Code 里打断点更舒服。 💡 例题 例题：给\"安全输入\"函数写测试（不等人敲键盘） 用 pytest + monkeypatch 给 ask_int 写三个测试：正常输入、先错后对、永远不合法。 参考答案 解析 monkeypatch 把 input 换成假函数，测试就能全自动跑。\"能不能被轻松测试\"本身就是代码设计好坏的试金石。 ✏️ 作业 基础 给第 9 课的 count_vowels 、 is_leap 写完整测试（正常值 + 边界值 + 非法值）。 基础 用 parametrize 测闰年，必须包含 2000（闰）和 1900（平）两个经典年份。 进阶 给待办项目的文件读写加测试：用内置的 tmp_path fixture 造临时目录，测\"保存后能读回\"。 进阶 用 pytest.raises 测试 BankAccount 取款超额抛 ValueError 。 挑战 给待办事项项目全程加 logging，把每次增删改查都写进 app.log。"}],"project":{"id":"s3-p","kind":"project","title":"阶段三项目：资讯聚合命令行工具","no":"","time":"","html":"\u003cp>做一个 \u003ccode>news_cli.py\u003c/code>：并发抓取多个公开数据源（如 GitHub API、open-meteo 天气、ip-api）→ 规则清洗 → 存 SQLite → 终端查询浏览。\u003c/p>\n\u003cp>\u003cstrong>技术要求\u003c/strong>（每一项都对应一课）：\u003c/p>\n\u003col class=\"hw-list\">\n\u003cli>抓取用 \u003ccode>requests + ThreadPoolExecutor\u003c/code> 或 \u003ccode>httpx + asyncio\u003c/code>，二选一，并在 README 写明选择理由\u003c/li>\n\u003cli>统一的重试 / 超时 / 限流封装（用第 17 课的装饰器或第 22 课的函数）\u003c/li>\n\u003cli>数据入库 sqlite3，全程参数化查询\u003c/li>\n\u003cli>清洗函数、入库函数有 pytest 覆盖（含异常路径）\u003c/li>\n\u003cli>logging 记录每次抓取的成败与耗时\u003c/li>\n\u003cli>全部函数有类型注解，\u003ccode>mypy\u003c/code> 与 \u003ccode>ruff check\u003c/code> 全绿\u003c/li>\n\u003c/ol>\n\u003cp>做完这 识点\u003c/h4>\n\u003col>\n\u003cli>NumPy：ndarray、向量化运算（\u003ccode>arr * 2\u003c/code>，告别 for）、布尔索引 \u003ccode>arr[arr &gt; 5]\u003c/code>\u003c/li>\n\u003cli>Pandas：\u003ccode>pd.read_csv/read_excel\u003c/code>；\u003ccode>df.head()/info()/describe()\u003c/code> 先看三件套；选列筛选 \u003ccode>df[df[\"age\"] &gt; 18]\u003c/code>；\u003ccode>groupby\u003c/code> 聚合；\u003ccode>merge\u003c/code> 连表；缺失值 \u003ccode>dropna/fillna\u003c/code>\u003c/li>\n\u003cli>可视化：折线/柱状/散点/直方图；matplotlib 中文显示需配置字体\u003c/li>\n\u003c/ol>\n\u003ch4 class=\"mini-title\">示例：groupby 聚合\u003c/h4>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">pandas\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"k\">as\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">pd\u003c/span>\n\n\u003cspan class=\"n\">df\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">pd\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">read_csv\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"orders.csv\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>                     \u003cspan class=\"c1\"># 列: 城市, 金额, 日期\u003c/span>\n\u003cspan class=\"n\">df\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"日期\"\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">pd\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">to_datetime\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">df\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"日期\"\u003c/span>\u003cspan class=\"p\">])\u003c/span>\n\u003cspan class=\"n\">df\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"月份\"\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">df\u0 n> \u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{}\u003c/span>\n\n\u003cspan class=\"k\">class\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nc\">TodoIn\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">BaseModel\u003c/span>\u003cspan class=\"p\">):\u003c/span>                \u003cspan class=\"c1\"># 自动校验请求体\u003c/span>\n    \u003cspan class=\"n\">title\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\n    \u003cspan class=\"n\">priority\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>                       \u003cspan class=\"c1\"># 想限定 高/中/低 可用 Literal\u003c/span>\n\n\u003cspan class=\"nd\">@app\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">post\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"/todos\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">create\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">todo\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"n\">TodoIn\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">new_id\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">todos\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n    \u003cspan class=\"n\">todos\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">new_id\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan cl
