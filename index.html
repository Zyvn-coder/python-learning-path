\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">Employee\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"fm\">__init__\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"bp\">self\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">base_salary\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">bonus\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"nb\">super\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"fm\">__init__\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">base_salary\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"bp\">self\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">bonus\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">bonus\u003c/span>\n\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">monthly_pay\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"bp\">self\u003c/span>\u003cspan class=\"p\">):\u003c/span>                       \u003cspan class=\"c1\"># 重写\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"nb\">super\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">monthly_pay\u003c/span>\u003cspan class=\"p\">()\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"bp\">self\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">bonus\u003c/span>\n\n\u003cspan class=\"n\">staff\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">Employee\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小李\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">8000\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"n\">Manager\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"王总\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">20000\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">5000\u003c/span>\u003cspan class=\"p\">)]\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">p\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">monthly_pay\u003c/span>\u003cspan class=\"p\">()\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">p\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">staff\u003c/span>\u003cspan class=\"p\">))\u003c/span>       \u003cspan class=\"c1\"># 33000\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>最后一行不需要管列表里谁是谁——多态让\"求总工资\"的调用方代码零修改。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>\u003ccode>Shape\u003c/code> 基类 + \u003ccode>Circle\u003c/code>/\u003ccode>Square\u003c/code> 子类，统一 \u003ccode>area()\u003c/code>，循环打印所有面积。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>\u003ccode>Vehicle\u003c/code> → \u003ccode>Car\u003c/code>/\u003ccode>Bike\u003c/code>：子类 \u003ccode>describe()\u003c/code> 里用 \u003ccode>super()\u003c/code> 复用父类的通用描述。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>给 \u003ccode>Rectangle\u003c/code> 实现 \u003ccode>__eq__\u003c/code>（面积相等即相等）和 \u003ccode>__repr__\u003c/code>。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>\u003ccode>Playlist\u003c/code> 类实现 \u003ccode>__len__\u003c/code> 和 \u003ccode>__getitem__\u003c/code>，使它支持 \u003ccode>len()\u003c/code>、\u003ccode>playlist[0]\u003c/code> 和 for 遍历。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>用 \u003ccode>@dataclass\u003c/code> 重写第 13 课的购物车条目，体会省掉了哪些代码；再思考哪些方法 dataclass 帮不了你。\u003c/li>\n\u003c/ol>","counts":{"kp":7,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 继承 class Dog(Animal): —— 子类自动拥有父类的一切； 重写 = 在子类重新定义同名方法。 super().__init__(...) 调用父类构造，避免复制粘贴父类逻辑。 多态：不同子类对同一方法各有实现，调用方不关心具体类型。（Python 更宽泛的说法叫鸭子类型：长得像鸭子就走鸭子逻辑，甚至不必继承。） isinstance(x, Dog) 类型判断。 常用魔术方法： __repr__ （开发者视角的显示）、 __eq__ （决定 == ）、 __len__ 、 __add__ （决定 + ）、 __getitem__ （决定下标访问）。 @dataclass 装饰器（标准库 dataclasses）：自动生成 __init__/__repr__/__eq__ ，纯数据类首选。 设计原则一句话：优先 组合 （对象里装对象），慎用多层继承。 💡 例题 例题 1：向量类（运算符重载） 让 Vector(x, y) 支持 v1 + v2 、 v1 == v2 和直接 print(v) ，想想各要重载什么。 参考答案 解析 实现了 __add__ 之后 + 才知道怎么算——运算符重载让自定义类型无缝融入 Python 语法。 例题 2：员工工资体系 写 Employee 和继承它的 Manager （底薪 + 奖金），再用一个循环算出所有人的工资总和。 参考答案 解析 最后一行不需要管列表里谁是谁——多态让\"求总工资\"的调用方代码零修改。 ✏️ 作业 基础 Shape 基类 + Circle / Square 子类，统一 area() ，循环打印所有面积。 基础 Vehicle → Car / Bike ：子类 describe() 里用 super() 复用父类的通用描述。 基础 给 Rectangle 实现 __eq__ （面积相等即相等）和 __repr__ 。 进阶 Playlist 类实现 __len__ 和 __getitem__ ，使它支持 len() 、 playlist[0] 和 for 遍历。 挑战 用 @dataclass 重写第 13 课的购物车条目，体会省掉了哪些代码；再思考哪些方法 dataclass 帮不了你。"},{"id":"s2-l15","kind":"lesson","no":15,"title":"推导式、迭代器与生成器","time":"4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>列表推导式 \u003ccode>[表达式 for x in 序列 if 条件]\u003c/code> —— 一行完成\"过滤 + 变换\"。\u003c/li>\n\u003cli>字典推导式 \u003ccode>{k: v for ...}\u003c/code>、集合推导式 \u003ccode>{x for ...}\u003c/code>。\u003c/li>\n\u003cli>生成器表达式 \u003ccode>(x for x in ...)\u003c/code>：不立刻算，边用边算，省内存（求和场景直接喂给 \u003ccode>sum()\u003c/code>）。\u003c/li>\n\u003cli>生成器函数：带 \u003ccode>yield\u003c/code> 的函数，每次要值才执行到下一个 yield 暂停；\u003cstrong>只能遍历一次\u003c/strong>。\u003c/li>\n\u003cli>迭代器协议一句话：实现了 \u003ccode>__iter__\u003c/code> 和 \u003ccode>__next__\u003c/code> 的对象；for 循环背后就是它。\u003c/li>\n\u003cli>何时用生成器：数据量大（大文件、无限序列）、只需顺序消费一遍。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">squares\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">10\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"o\">%\u003c/span> \u003cspan class=\"mi\">2\u003c/span> \u003cspan class=\"o\">==\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">]\u003c/span>   \u003cspan class=\"c1\"># [0, 4, 16, 36, 64]\u003c/span>\n\u003cspan class=\"n\">word_len\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"n\">w\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">w\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">w\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"py\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"java\"\u003c/span>\u003cspan class=\"p\">]}\u003c/span>       \u003cspan class=\"c1\"># {'py': 2, 'java': 4}\u003c/span>\n\u003cspan class=\"n\">unique\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"n\">c\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">c\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"s2\">\"hello\"\u003c/span>\u003cspan class=\"p\">}\u003c/span>                        \u003cspan class=\"c1\"># {'h', 'e', 'l', 'o'}\u003c/span>\n\n\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">10\u003c/span> \u003cspan class=\"o\">**\u003c/span> \u003cspan class=\"mi\">6\u003c/span>\u003cspan class=\"p\">))\u003c/span>           \u003cspan class=\"c1\"># 生成器：不建百万级列表\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">countdown\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">while\u003c/span> \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">&gt;\u003c/span> \u003cspan class=\"mi\">0\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">yield\u003c/span> \u003cspan class=\"n\">n\u003c/span>            \u003cspan class=\"c1\"># 交出一个值并暂停\u003c/span>\n        \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">-=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">countdown\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">)\u003c/span>               \u003cspan class=\"c1\"># 3 2 1\u003c/span>\n\n\u003cspan class=\"n\">gen\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">countdown\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">next\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">gen\u003c/span>\u003cspan class=\"p\">))\u003c/span>           \u003cspan class=\"c1\"># 2（手动取下一个值）\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：数据清洗三连\u003c/h4>\n\u003cp>把 \u003ccode>[\"  92 \", \"absent\", \"88\", \"  45\", \"\", \"77\"]\u003c/code> 里能转数字的筛出来转成 \u003ccode>int\u003c/code>，再用 \u003ccode>zip\u003c/code> 绑上姓名做成字典，全程用推导式。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">raw\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"  92 \"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"absent\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"88\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"  45\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"77\"\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"c1\"># ① 只把能转成数字的项提出来并转成 int\u003c/span>\n\u003cspan class=\"n\">scores\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">raw\u003c/span> \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">s\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">strip\u003c/span>\u003cspan class=\"p\">()\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">isdigit\u003c/span>\u003cspan class=\"p\">()]\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span>            \u003cspan class=\"c1\"># [92, 88, 45, 77]\u003c/span>\n\n\u003cspan class=\"c1\"># ② 配合 zip 建立映射\u003c/span>\n\u003cspan class=\"n\">names\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"a\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"b\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"c\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"d\"\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">info\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">s\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">zip\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">names\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)}\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">info\u003c/span>\u003cspan class=\"p\">)\u003c/span>              \u003cspan class=\"c1\"># {'a': 92, 'b': 88, 'c': 45, 'd': 77}\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>推导式不是炫技，而是\"过滤+变换\"的母语。但\u003cstrong>套两层以上就该拆回普通 for\u003c/strong>——可读性优先。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：大文件惰性处理\u003c/h4>\n\u003cp>写生成器 \u003ccode>error_lines(path)\u003c/code>：只产出含 \u003ccode>ERROR\u003c/code> 的行、不把整个文件读进内存，再用一行代码数出有多少行。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">error_lines\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">path\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n\u003cspan class=\"w\">    \u003c/span>\u003cspan class=\"sd\">\"\"\"只产出含 ERROR 的行，不把整个文件读进内存\"\"\"\u003c/span>\n    \u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"nb\">open\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">path\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">encoding\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"utf-8\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">f\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">line\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">f\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n            \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"s2\">\"ERROR\"\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">line\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n                \u003cspan class=\"k\">yield\u003c/span> \u003cspan class=\"n\">line\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">rstrip\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\n\u003cspan class=\"n\">count\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">_\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">error_lines\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"app.log\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"错误行数:\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">count\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>函数每被要一条才给一条，1GB 的日志也只占几十 MB 内存。\u003ccode>sum(1 for _ in ...)\u003c/code> 是\"数一数有多少个\"的惯用写法。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>推导式：1–100 中能被 3 整除的数的平方列表。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>推导式：把 \u003ccode>[\"tom\", \"JERRY\", \"spike\"]\u003c/code> 变成 \u003ccode>{\"TOM\": 3, \"JERRY\": 5, \"SPIKE\": 5}\u003c/code>（键大写，值是长度）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用生成器实现 \u003ccode>fib()\u003c/code>：无限产出斐波那契数列，配合 for + break 取前 10 项。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>推导式双 for：把 \u003ccode>[[1, 2], [3], [4, 5]]\u003c/code> 展平成 \u003ccode>[1, 2, 3, 4, 5]\u003c/code>。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用生成器改写第 11 课的词频程序：边逐行读文件边产出单词。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>素数生成器 \u003ccode>primes()\u003c/code>：无限产出素数（复用第 9 课的 \u003ccode>is_prime\u003c/code>），打印前 20 个。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":6,"points":0,"codes":3,"answers":2},"text":"📚 知识点 列表推导式 [表达式 for x in 序列 if 条件] —— 一行完成\"过滤 + 变换\"。 字典推导式 {k: v for ...} 、集合推导式 {x for ...} 。 生成器表达式 (x for x in ...) ：不立刻算，边用边算，省内存（求和场景直接喂给 sum() ）。 生成器函数：带 yield 的函数，每次要值才执行到下一个 yield 暂停； 只能遍历一次 。 迭代器协议一句话：实现了 __iter__ 和 __next__ 的对象；for 循环背后就是它。 何时用生成器：数据量大（大文件、无限序列）、只需顺序消费一遍。 💡 例题 例题 1：数据清洗三连 把 [\" 92 \", \"absent\", \"88\", \" 45\", \"\", \"77\"] 里能转数字的筛出来转成 int ，再用 zip 绑上姓名做成字典，全程用推导式。 参考答案 解析 推导式不是炫技，而是\"过滤+变换\"的母语。但 套两层以上就该拆回普通 for ——可读性优先。 例题 2：大文件惰性处理 写生成器 error_lines(path) ：只产出含 ERROR 的行、不把整个文件读进内存，再用一行代码数出有多少行。 参考答案 解析 函数每被要一条才给一条，1GB 的日志也只占几十 MB 内存。 sum(1 for _ in ...) 是\"数一数有多少个\"的惯用写法。 ✏️ 作业 基础 推导式：1–100 中能被 3 整除的数的平方列表。 基础 推导式：把 [\"tom\", \"JERRY\", \"spike\"] 变成 {\"TOM\": 3, \"JERRY\": 5, \"SPIKE\": 5} （键大写，值是长度）。 基础 用生成器实现 fib() ：无限产出斐波那契数列，配合 for + break 取前 10 项。 进阶 推导式双 for：把 [[1, 2], [3], [4, 5]] 展平成 [1, 2, 3, 4, 5] 。 进阶 用生成器改写第 11 课的词频程序：边逐行读文件边产出单词。 挑战 素数生成器 primes() ：无限产出素数（复用第 9 课的 is_prime ），打印前 20 个。"},{"id":"s2-l16","kind":"lesson","no":16,"title":"常用标准库速览","time":"4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>\u003ccode>collections\u003c/code>：\u003ccode>Counter\u003c/code>（计数神器，\u003ccode>.most_common(n)\u003c/code>）、\u003ccode>defaultdict(list)\u003c/code>（自动初始化的字典）、\u003ccode>deque\u003c/code>（两端快速进出，适合队列）。\u003c/li>\n\u003cli>\u003ccode>random\u003c/code>：\u003ccode>randint(a, b)\u003c/code> 随机整数、\u003ccode>choice(seq)\u003c/code> 抽一个、\u003ccode>sample(seq, k)\u003c/code> 抽 k 个不重复、\u003ccode>shuffle(seq)\u003c/code> 原地打乱。\u003c/li>\n\u003cli>\u003ccode>datetime\u003c/code>：\u003ccode>date.today()\u003c/code>、日期相减得 \u003ccode>timedelta\u003c/code>、\u003ccode>strftime(\"%Y-%m-%d\")\u003c/code> 格式化、\u003ccode>strptime\u003c/code> 解析字符串。\u003c/li>\n\u003cli>\u003ccode>pathlib.Path\u003c/code>：面向对象路径操作——\u003ccode>Path(\"data\") / \"a.txt\"\u003c/code> 拼路径、\u003ccode>.exists()\u003c/code>、\u003ccode>.read_text()\u003c/code>、\u003ccode>.glob(\"*.txt\")\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>json\u003c/code>：\u003ccode>json.dumps(obj, ensure_ascii=False)\u003c/code>（Python→字符串）、\u003ccode>json.loads\u003c/code>（字符串→Python）、\u003ccode>json.dump/load\u003c/code> 直接读写文件。\u003c/li>\n\u003cli>\u003ccode>itertools\u003c/code>：\u003ccode>combinations\u003c/code>（组合）、\u003ccode>permutations\u003c/code>（排列）、\u003ccode>chain\u003c/code>（串联多个序列）。\u003c/li>\n\u003cli>学习方法论：标准库不用背，\u003cstrong>知道\"有什么\"\u003c/strong>，用时查文档即可。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">collections\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">Counter\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">defaultdict\u003c/span>\n\n\u003cspan class=\"n\">words\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"to be or not to be\"\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">split\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">Counter\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">words\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">most_common\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">))\u003c/span>   \u003cspan class=\"c1\"># [('to', 2), ('be', 2)]\u003c/span>\n\n\u003cspan class=\"n\">groups\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">defaultdict\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">)\u003c/span>             \u003cspan class=\"c1\"># 键不存在时自动给个空列表\u003c/span>\n\u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">city\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"p\">[(\u003c/span>\u003cspan class=\"s2\">\"小明\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"北京\"\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小红\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"上海\"\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"小刚\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"北京\"\u003c/span>\u003cspan class=\"p\">)]:\u003c/span>\n    \u003cspan class=\"n\">groups\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">city\u003c/span>\u003cspan class=\"p\">]\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">name\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">groups\u003c/span>\u003cspan class=\"p\">))\u003c/span>                    \u003cspan class=\"c1\"># {'北京': ['小明', '小刚'], '上海': ['小红']}\u003c/span>\n\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">datetime\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">date\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">timedelta\u003c/span>\n\u003cspan class=\"n\">today\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">date\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">2026\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">9\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">13\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">today\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"n\">timedelta\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">days\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">100\u003c/span>\u003cspan class=\"p\">))\u003c/span>     \u003cspan class=\"c1\"># 2026-12-22\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">strftime\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"%Y/%m/\u003c/span>\u003cspan class=\"si\">%d\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>      \u003cspan class=\"c1\"># 2026/09/13\u003c/span>\n\n\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">json\u003c/span>\n\u003cspan class=\"n\">config\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s2\">\"theme\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"dark\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"font\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"mi\">14\u003c/span>\u003cspan class=\"p\">}\u003c/span>\n\u003cspan class=\"k\">with\u003c/span> \u003cspan class=\"nb\">open\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"config.json\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"w\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">encoding\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"s2\">\"utf-8\"\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">f\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">json\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">dump\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">config\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">f\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">ensure_ascii\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"kc\">False\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">indent\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：随机点名器\u003c/h4>\n\u003cp>用 \u003ccode>random\u003c/code> 做四件事：抽 1 个值日生、抽 3 个不重复的人组队、原地打乱名单、取一个随机整数。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">random\u003c/span>\n\n\u003cspan class=\"n\">students\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"s2\">\"小明\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小红\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小刚\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小丽\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"小强\"\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003cspan class=\"n\">monitor\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">choice\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">students\u003c/span>\u003cspan class=\"p\">)\u003c/span>      \u003cspan class=\"c1\"># 随机抽 1 人\u003c/span>\n\u003cspan class=\"n\">group\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sample\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">students\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">)\u003c/span>     \u003cspan class=\"c1\"># 抽 3 人，不重复\u003c/span>\n\u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">shuffle\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">students\u003c/span>\u003cspan class=\"p\">)\u003c/span>               \u003cspan class=\"c1\"># 打乱顺序（原地修改）\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">monitor\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">group\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">students\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>choice 抽一个、sample 抽多个不重复、shuffle 打乱、randint 取随机整数——四个函数覆盖 90% 的随机需求。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：生日倒计时\u003c/h4>\n\u003cp>写 \u003ccode>days_until_birthday(month, day)\u003c/code>：算今天距离下一个生日还有多少天，今年过了就翻到明年。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">datetime\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">date\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">days_until_birthday\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">month\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">day\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">today\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">date\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n    \u003cspan class=\"n\">next_bd\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">date\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">year\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">month\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">day\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">next_bd\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"p\">:\u003c/span>                \u003cspan class=\"c1\"># 今年已经过了 → 算明年\u003c/span>\n        \u003cspan class=\"n\">next_bd\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">date\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">year\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">month\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">day\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">next_bd\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"n\">today\u003c/span>\u003cspan class=\"p\">)\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">days\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"距离生日还有\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">days_until_birthday\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">12\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">25\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"s2\">\"天\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>两个 date 相减得到 timedelta，\u003ccode>.days\u003c/code> 取天数；\"过期就翻年\"是这类日期题的通用套路。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 Counter 统计一篇文章的词频 Top5（重做第 11 课题 2，看少了多少代码）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 defaultdict 把一组单词按首字母分组。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>输入 \u003ccode>\"2026-10-01\"\u003c/code>，用 strptime 解析后计算距今多少天。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 pathlib 列出当前目录所有 .py 文件的名字和大小。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>把第 8 课的通讯录改成 \u003cstrong>json 文件持久化\u003c/strong>：启动时读取、退出时保存。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>itertools.combinations 算\"5 个人两两握手共几次\"，再用数学公式验证。\u003c/li>\n\u003c/ol>","counts":{"kp":7,"ex":2,"hw":6,"points":0,"codes":3,"answers":2},"text":"📚 知识点 collections ： Counter （计数神器， .most_common(n) ）、 defaultdict(list) （自动初始化的字典）、 deque （两端快速进出，适合队列）。 random ： randint(a, b) 随机整数、 choice(seq) 抽一个、 sample(seq, k) 抽 k 个不重复、 shuffle(seq) 原地打乱。 datetime ： date.today() 、日期相减得 timedelta 、 strftime(\"%Y-%m-%d\") 格式化、 strptime 解析字符串。 pathlib.Path ：面向对象路径操作—— Path(\"data\") / \"a.txt\" 拼路径、 .exists() 、 .read_text() 、 .glob(\"*.txt\") 。 json ： json.dumps(obj, ensure_ascii=False) （Python→字符串）、 json.loads （字符串→Python）、 json.dump/load 直接读写文件。 itertools ： combinations （组合）、 permutations （排列）、 chain （串联多个序列）。 学习方法论：标准库不用背， 知道\"有什么\" ，用时查文档即可。 💡 例题 例题 1：随机点名器 用 random 做四件事：抽 1 个值日生、抽 3 个不重复的人组队、原地打乱名单、取一个随机整数。 参考答案 解析 choice 抽一个、sample 抽多个不重复、shuffle 打乱、randint 取随机整数——四个函数覆盖 90% 的随机需求。 例题 2：生日倒计时 写 days_until_birthday(month, day) ：算今天距离下一个生日还有多少天，今年过了就翻到明年。 参考答案 解析 两个 date 相减得到 timedelta， .days 取天数；\"过期就翻年\"是这类日期题的通用套路。 ✏️ 作业 基础 用 Counter 统计一篇文章的词频 Top5（重做第 11 课题 2，看少了多少代码）。 基础 用 defaultdict 把一组单词按首字母分组。 基础 输入 \"2026-10-01\" ，用 strptime 解析后计算距今多少天。 基础 用 pathlib 列出当前目录所有 .py 文件的名字和大小。 进阶 把第 8 课的通讯录改成 json 文件持久化 ：启动时读取、退出时保存。 挑战 itertools.combinations 算\"5 个人两两握手共几次\"，再用数学公式验证。"}],"project":{"id":"s2-p","kind":"project","title":"阶段二项目：命令行待办事项管理器","no":"","time":"","html":"\u003cp>写一个 \u003cstrong>200–300 行\u003c/strong>的项目，功能需求：\u003c/p>\n\u003col class=\"hw-list\">\n\u003cli>添加任务（标题、优先级 高/中/低、截止日期）\u003c/li>\n\u003cli>列表查看：全部 / 未完成 / 已完成，支持按优先级或截止日期排序\u003c/li>\n\u003cli>完成任务、删除任务\u003c/li>\n\u003cli>数据保存为 JSON 文件，重启不丢（json + pathlib）\u003c/li>\n\u003cli>任何非法输入都不崩溃（异常处理 + 复用 ask_int / ask_choice）\u003c/li>\n\u003cli>主流程用函数组织；核心数据用 1–2 个类管理（\u003ccode>Task\u003c/code>、\u003ccode>TodoList\u003c/code>）\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>建议步骤\u003c/strong>（很重要，照着走）：\n① 先写纯内存版跑通菜单 → ② 数据结构改成 Task 类 → ③ 加 JSON 持久化 → ④ 补异常与排序 → ⑤ 拆分成 \u003ccode>todo.py\u003c/code>（主程序）+ \u003ccode>models.py\u003c/code>（类）+ \u003ccode>utils.py\u003c/code>（工具函数）。\u003c/p>\n\u003ch4 class=\"mini-title\">验收标准\u003c/h4>\u003cp>重启后数据还在；故意输入乱码不崩溃；没有任何一个函数超过 30 行。\u003c/p>","counts":{"kp":0,"ex":0,"hw":6,"points":0,"codes":0,"answers":0},"text":"写一个 200–300 行 的项目，功能需求： 添加任务（标题、优先级 高/中/低、截止日期） 列表查看：全部 / 未完成 / 已完成，支持按优先级或截止日期排序 完成任务、删除任务 数据保存为 JSON 文件，重启不丢（json + pathlib） 任何非法输入都不崩溃（异常处理 + 复用 ask_int / ask_choice） 主流程用函数组织；核心数据用 1–2 个类管理（ Task 、 TodoList ） 建议步骤 （很重要，照着走）： ① 先写纯内存版跑通菜单 → ② 数据结构改成 Task 类 → ③ 加 JSON 持久化 → ④ 补异常与排序 → ⑤ 拆分成 todo.py （主程序）+ models.py （类）+ utils.py （工具函数）。 验收标准 重启后数据还在；故意输入乱码不崩溃；没有任何一个函数超过 30 行。"}},{"id":"s3","label":"阶段三","name":"高级应用","range":"第 17–24 课","goal":"从「会写代码」到「会写工程」——装饰器、并发、网络、数据库、测试","note":"每周 1 课 + 1 次复习，约 6–8 周","accent":"amber","lessons":[{"id":"s3-l17","kind":"lesson","no":17,"title":"闭包与装饰器","time":"4–5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>函数是\"一等公民\"：可以赋值给变量、当参数传、当返回值返回。\u003c/li>\n\u003cli>闭包：内层函数\"记住\"外层函数的变量；\u003ccode>nonlocal\u003c/code> 声明\"我要修改外层变量\"。\u003c/li>\n\u003cli>装饰器 = 接收函数、返回新函数的高阶函数；\u003ccode>@deco\u003c/code> 只是 \u003ccode>f = deco(f)\u003c/code> 的语法糖。\u003c/li>\n\u003cli>\u003ccode>functools.wraps\u003c/code>：让被装饰的函数保留原来的名字和文档（不加会变成 \u003ccode>wrapper\u003c/code>）。\u003c/li>\n\u003cli>带参数的装饰器 = 再包一层（三层函数）。\u003c/li>\n\u003cli>典型用途：计时、日志、缓存、重试、权限校验——把与业务无关的\"横切逻辑\"从业务代码里剥离出来。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">functools\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">timer\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"nd\">@functools\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">wraps\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">wrapper\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"n\">start\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span>\n        \u003cspan class=\"n\">result\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">)\u003c/span>          \u003cspan class=\"c1\"># 调用原函数\u003c/span>\n        \u003cspan class=\"n\">cost\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">perf_counter\u003c/span>\u003cspan class=\"p\">()\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"n\">start\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"vm\">__name__\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 耗时 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">cost\u003c/span>\u003cspan class=\"si\">:\u003c/span>\u003cspan class=\"s2\">.4f\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">s\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">result\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">wrapper\u003c/span>\n\n\u003cspan class=\"nd\">@timer\u003c/span>                       \u003cspan class=\"c1\"># 等价于 slow_add = timer(slow_add)\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">slow_add\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">a\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">b\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">a\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"n\">b\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">slow_add\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">))\u003c/span>        \u003cspan class=\"c1\"># slow_add 耗时 1.0xxs → 3\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">counter\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">calls\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mi\">0\u003c/span>                \u003cspan class=\"c1\"># 闭包变量：wrapper 一直\"记得\"它\u003c/span>\n    \u003cspan class=\"nd\">@functools\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">wraps\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">wrapper\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">nonlocal\u003c/span> \u003cspan class=\"n\">calls\u003c/span>       \u003cspan class=\"c1\"># 声明：我要修改外层变量\u003c/span>\n        \u003cspan class=\"n\">calls\u003c/span> \u003cspan class=\"o\">+=\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n        \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"第 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">calls\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 次调用 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"vm\">__name__\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">wrapper\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：缓存装饰器（解开第 10 课的悬念）\u003c/h4>\n\u003cp>写 \u003ccode>memoize\u003c/code> 装饰器把返回值按参数缓存起来，用它装饰第 10 课的递归 \u003ccode>fib\u003c/code>，看 \u003ccode>fib(100)\u003c/code> 是否秒出。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">memoize\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"n\">cache\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{}\u003c/span>\n    \u003cspan class=\"nd\">@functools\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">wraps\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">wrapper\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">args\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">cache\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n            \u003cspan class=\"n\">cache\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">cache\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">wrapper\u003c/span>\n\n\u003cspan class=\"nd\">@memoize\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">fib\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">&lt;=\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">fib\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"n\">fib\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">n\u003c/span> \u003cspan class=\"o\">-\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">fib\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">100\u003c/span>\u003cspan class=\"p\">))\u003c/span>    \u003cspan class=\"c1\"># 瞬间出结果——第 10 课 fib(35) 卡死的问题解决了\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>{参数元组: 结果}\u003c/code> 字典当缓存。这就是标准库 \u003ccode>functools.lru_cache\u003c/code> 的原理，实际项目直接 \u003ccode>@functools.lru_cache(maxsize=None)\u003c/code> 即可。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：带参数的重试装饰器\u003c/h4>\n\u003cp>写 \u003ccode>retry(times, delay=1)\u003c/code>：失败就重试，间隔 delay 秒，重试用尽抛 \u003ccode>RuntimeError\u003c/code>。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">random\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">time\u003c/span>\u003cspan class=\"o\">,\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">functools\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">retry\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">times\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">delay\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n    \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">deco\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">):\u003c/span>                        \u003cspan class=\"c1\"># 真正的装饰器\u003c/span>\n        \u003cspan class=\"nd\">@functools\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">wraps\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">wrapper\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n            \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"nb\">range\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">times\u003c/span> \u003cspan class=\"o\">+\u003c/span> \u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n                \u003cspan class=\"k\">try\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n                    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"o\">*\u003c/span>\u003cspan class=\"n\">args\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"o\">**\u003c/span>\u003cspan class=\"n\">kwargs\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n                \u003cspan class=\"k\">except\u003c/span> \u003cspan class=\"ne\">Exception\u003c/span> \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"p\">:\u003c/span>     \u003cspan class=\"c1\"># 演示用；真实代码要捕具体异常\u003c/span>\n                    \u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"第 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">i\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 次失败: \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">e\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n                    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">i\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"n\">times\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n                        \u003cspan class=\"n\">time\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sleep\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">delay\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n            \u003cspan class=\"k\">raise\u003c/span> \u003cspan class=\"ne\">RuntimeError\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">f\u003c/span>\u003cspan class=\"s2\">\"重试 \u003c/span>\u003cspan class=\"si\">{\u003c/span>\u003cspan class=\"n\">times\u003c/span>\u003cspan class=\"si\">}\u003c/span>\u003cspan class=\"s2\"> 次仍失败\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">wrapper\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">deco\u003c/span>\n\n\u003cspan class=\"nd\">@retry\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"mi\">3\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">delay\u003c/span>\u003cspan class=\"o\">=\u003c/span>\u003cspan class=\"mf\">0.5\u003c/span>\u003cspan class=\"p\">)\u003c/span>       \u003cspan class=\"c1\"># retry(3) 先执行，返回 deco；再 @deco\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">flaky_api\u003c/span>\u003cspan class=\"p\">():\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">random\u003c/span>\u003cspan class=\"p\">()\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mf\">0.7\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">raise\u003c/span> \u003cspan class=\"ne\">ConnectionError\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"网络抖动\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"s2\">\"ok\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>@retry(3)\u003c/code> 是两步——先调 \u003ccode>retry(3)\u003c/code> 得到装饰器，再装饰函数。带参数的装饰器就是\u003cstrong>多包一层\u003c/strong>。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>写 \u003ccode>log_call\u003c/code> 装饰器：打印函数名、收到的参数、返回值。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>写 \u003ccode>count_calls\u003c/code>：统计被装饰函数的调用次数，把次数存在 \u003ccode>wrapper.calls\u003c/code> 属性上供外部查看。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>写带参数的 \u003ccode>repeat(n)\u003c/code>：被装饰的函数每次调用自动执行 n 次。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>用 \u003ccode>functools.lru_cache\u003c/code> 给 fib 加缓存，配合 timer 对比加缓存前后的耗时（把数字记进笔记）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>写权限校验装饰器：被装饰函数的第一个参数是用户字典（如 \u003ccode>{\"name\": \"小明\", \"role\": \"admin\"}\u003c/code>），无 admin 权限时抛 \u003ccode>PermissionError\u003c/code>。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 函数是\"一等公民\"：可以赋值给变量、当参数传、当返回值返回。 闭包：内层函数\"记住\"外层函数的变量； nonlocal 声明\"我要修改外层变量\"。 装饰器 = 接收函数、返回新函数的高阶函数； @deco 只是 f = deco(f) 的语法糖。 functools.wraps ：让被装饰的函数保留原来的名字和文档（不加会变成 wrapper ）。 带参数的装饰器 = 再包一层（三层函数）。 典型用途：计时、日志、缓存、重试、权限校验——把与业务无关的\"横切逻辑\"从业务代码里剥离出来。 💡 例题 例题 1：缓存装饰器（解开第 10 课的悬念） 写 memoize 装饰器把返回值按参数缓存起来，用它装饰第 10 课的递归 fib ，看 fib(100) 是否秒出。 参考答案 解析 {参数元组: 结果} 字典当缓存。这就是标准库 functools.lru_cache 的原理，实际项目直接 @functools.lru_cache(maxsize=None) 即可。 例题 2：带参数的重试装饰器 写 retry(times, delay=1) ：失败就重试，间隔 delay 秒，重试用尽抛 RuntimeError 。 参考答案 解析 @retry(3) 是两步——先调 retry(3) 得到装饰器，再装饰函数。带参数的装饰器就是 多包一层 。 ✏️ 作业 基础 写 log_call 装饰器：打印函数名、收到的参数、返回值。 基础 写 count_calls ：统计被装饰函数的调用次数，把次数存在 wrapper.calls 属性上供外部查看。 进阶 写带参数的 repeat(n) ：被装饰的函数每次调用自动执行 n 次。 进阶 用 functools.lru_cache 给 fib 加缓存，配合 timer 对比加缓存前后的耗时（把数字记进笔记）。 挑战 写权限校验装饰器：被装饰函数的第一个参数是用户字典（如 {\"name\": \"小明\", \"role\": \"admin\"} ），无 admin 权限时抛 PermissionError 。"},{"id":"s3-l18","kind":"lesson","no":18,"title":"类型注解与代码规范","time":"3–4 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>注解不改变运行行为，是写给\u003cstrong>人和工具\u003c/strong>看的：\u003ccode>def add(a: int, b: int) -&gt; int:\u003c/code>\u003c/li>\n\u003cli>容器类型：\u003ccode>list[int]\u003c/code>、\u003ccode>dict[str, float]\u003c/code>、\u003ccode>tuple[int, int]\u003c/code>（Python 3.9+ 直接用内置类型写）。\u003c/li>\n\u003cli>可能缺失：\u003ccode>str | None\u003c/code>（等价于旧的 \u003ccode>Optional[str]\u003c/code>）；多种可能：\u003ccode>int | str\u003c/code>（等价 \u003ccode>Union\u003c/code>）。\u003c/li>\n\u003cli>\u003ccode>Callable[[int], str]\u003c/code> 表示\"接收 int、返回 str 的函数\"。\u003c/li>\n\u003cli>工具链三件套：\u003ccode>mypy\u003c/code>（静态类型检查）、\u003ccode>ruff\u003c/code>（代码检查，极快）、\u003ccode>black\u003c/code>（自动格式化）。用法：\u003ccode>pip install mypy ruff\u003c/code> → \u003ccode>mypy xxx.py\u003c/code>、\u003ccode>ruff check .\u003c/code>\u003c/li>\n\u003cli>PEP 8 关键点：变量/函数 \u003ccode>snake_case\u003c/code>、类 \u003ccode>PascalCase\u003c/code>、常量 \u003ccode>UPPER_CASE\u003c/code>；和 None 比较用 \u003ccode>is\u003c/code>；import 分三组（标准库/第三方/本地）中间空行。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">average\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"n\">default\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">float\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"mf\">0.0\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">float\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">default\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"nb\">sum\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">/\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">scores\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">find_user\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">uid\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">dict\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">]\u003c/span> \u003cspan class=\"o\">|\u003c/span> \u003cspan class=\"kc\">None\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"n\">users\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"mi\">1\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"p\">{\u003c/span>\u003cspan class=\"s2\">\"name\"\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"s2\">\"小明\"\u003c/span>\u003cspan class=\"p\">}}\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">users\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">get\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">uid\u003c/span>\u003cspan class=\"p\">)\u003c/span>          \u003cspan class=\"c1\"># 查不到返回 None，注解如实反映\u003c/span>\n\n\u003cspan class=\"kn\">from\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">typing\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"kn\">import\u003c/span> \u003cspan class=\"n\">Callable\u003c/span>\n\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">transform\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">data\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"n\">Callable\u003c/span>\u003cspan class=\"p\">[[\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">],\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">])\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"n\">func\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">x\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"k\">for\u003c/span> \u003cspan class=\"n\">x\u003c/span> \u003cspan class=\"ow\">in\u003c/span> \u003cspan class=\"n\">data\u003c/span>\u003cspan class=\"p\">]\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题：让 mypy 替你抓 bug\u003c/h4>\n\u003cp>下面代码里的类型错误运行时不会立刻报错。先自己找，再用 \u003ccode>mypy bugs.py\u003c/code> 让它替你指出来。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"c1\"># ---- bugs.py —— 先自己找错，再让 mypy 找 ----\u003c/span>\n\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">pay\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">price\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">count\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">int\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">price\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"n\">count\u003c/span>\n\n\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">pay\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"10\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"mi\">2\u003c/span>\u003cspan class=\"p\">)\u003c/span>       \u003cspan class=\"c1\"># str 冒充 int 传进去\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">total\u003c/span> \u003cspan class=\"o\">*\u003c/span> \u003cspan class=\"s2\">\"￥\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>        \u003cspan class=\"c1\"># 连锁反应\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cdetails class=\"answer out\" open>\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">运行效果\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"bash\">\u003cpre>\u003ccode>&gt;\u003cspan class=\"w\"> \u003c/span>pip\u003cspan class=\"w\"> \u003c/span>install\u003cspan class=\"w\"> \u003c/span>mypy\n&gt;\u003cspan class=\"w\"> \u003c/span>mypy\u003cspan class=\"w\"> \u003c/span>bugs.py\nbugs.py:5:\u003cspan class=\"w\"> \u003c/span>error:\u003cspan class=\"w\"> \u003c/span>Argument\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"m\">1\u003c/span>\u003cspan class=\"w\"> \u003c/span>to\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"pay\"\u003c/span>\u003cspan class=\"w\"> \u003c/span>has\u003cspan class=\"w\"> \u003c/span>incompatible\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nb\">type\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"str\"\u003c/span>\u003cspan class=\"p\">;\u003c/span>\u003cspan class=\"w\"> \u003c/span>expected\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"s2\">\"int\"\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>\u003ccode>\"10\" * 2\u003c/code> 在运行时居然是 \u003ccode>\"1010\"\u003c/code>，错误会\u003cstrong>潜伏到很远的地方才爆炸\u003c/strong>；静态检查在运行前就把行号指给你。代码量上千、多人协作时，类型注解就是生命线。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>给阶段二项目的全部函数补注解，用 mypy 检查通过。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>用 \u003ccode>ruff check .\u003c/code> 检查你的项目，把所有告警清零。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>写一个 \u003ccode>TypedDict\u003c/code> 描述任务（标题/优先级/完成状态），并用它注解存取函数。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>写泛型函数 \u003ccode>def first(seq: list[T]) -&gt; T\u003c/code>：返回序列第一个元素（提示：\u003ccode>from typing import TypeVar\u003c/code>）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>挑一条 ruff 对你代码的告警，去读它的官方说明，用一句话总结进笔记。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":1,"hw":5,"points":0,"codes":3,"answers":1},"text":"📚 知识点 注解不改变运行行为，是写给 人和工具 看的： def add(a: int, b: int) -&gt; int: 容器类型： list[int] 、 dict[str, float] 、 tuple[int, int] （Python 3.9+ 直接用内置类型写）。 可能缺失： str | None （等价于旧的 Optional[str] ）；多种可能： int | str （等价 Union ）。 Callable[[int], str] 表示\"接收 int、返回 str 的函数\"。 工具链三件套： mypy （静态类型检查）、 ruff （代码检查，极快）、 black （自动格式化）。用法： pip install mypy ruff → mypy xxx.py 、 ruff check . PEP 8 关键点：变量/函数 snake_case 、类 PascalCase 、常量 UPPER_CASE ；和 None 比较用 is ；import 分三组（标准库/第三方/本地）中间空行。 💡 例题 例题：让 mypy 替你抓 bug 下面代码里的类型错误运行时不会立刻报错。先自己找，再用 mypy bugs.py 让它替你指出来。 参考答案 运行效果 解析 \"10\" * 2 在运行时居然是 \"1010\" ，错误会 潜伏到很远的地方才爆炸 ；静态检查在运行前就把行号指给你。代码量上千、多人协作时，类型注解就是生命线。 ✏️ 作业 基础 给阶段二项目的全部函数补注解，用 mypy 检查通过。 基础 用 ruff check . 检查你的项目，把所有告警清零。 进阶 写一个 TypedDict 描述任务（标题/优先级/完成状态），并用它注解存取函数。 进阶 写泛型函数 def first(seq: list[T]) -&gt; T ：返回序列第一个元素（提示： from typing import TypeVar ）。 挑战 挑一条 ruff 对你代码的告警，去读它的官方说明，用一句话总结进笔记。"},{"id":"s3-l19","kind":"lesson","no":19,"title":"正则表达式","time":"4–5 小时","html":"\u003ch3>📚 知识点\u003c/h3>\n\u003col>\n\u003cli>正则 = 描述字符串模式的迷你语言：\u003ccode>import re\u003c/code>。\u003c/li>\n\u003cli>常用元字符：\u003ccode>.\u003c/code> 任意字符、\u003ccode>\\d\u003c/code> 数字、\u003ccode>\\w\u003c/code> 字母数字下划线、\u003ccode>\\s\u003c/code> 空白、\u003ccode>^\u003c/code> 开头、\u003ccode>$\u003c/code> 结尾；量词 \u003ccode>*\u003c/code> ≥0 次、\u003ccode>+\u003c/code> ≥1 次、\u003ccode>?\u003c/code> 0 或 1 次、\u003ccode>{3}\u003c/code> 恰 3 次、\u003ccode>{2,4}\u003c/code> 2 到 4 次。\u003c/li>\n\u003cli>字符组 \u003ccode>[abc]\u003c/code>、\u003ccode>[0-9]\u003c/code>、\u003ccode>[^a]\u003c/code>（非 a）；多选一 \u003ccode>cat|dog\u003c/code>；分组 \u003ccode>(...)\u003c/code>，命名分组 \u003ccode>(?P&lt;名字&gt;...)\u003c/code>。\u003c/li>\n\u003cli>贪婪 vs 非贪婪：\u003ccode>.*\u003c/code> 吃到不能再吃；\u003ccode>.*?\u003c/code> 吃到满足为止（解析 HTML 类文本必用后者）。\u003c/li>\n\u003cli>核心函数：\u003ccode>re.findall\u003c/code>（所有匹配）、\u003ccode>re.search\u003c/code>（第一个匹配）、\u003ccode>re.match\u003c/code>（从头匹配）、\u003ccode>re.sub\u003c/code>（替换）、\u003ccode>re.split\u003c/code>（切分）。\u003c/li>\n\u003cli>实战观：能拆成\"逐条校验 + 汇总\"的别堆一个巨型正则；复杂正则用 \u003ccode>re.VERBOSE\u003c/code> 分行写注释。\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"kn\">import\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nn\">re\u003c/span>\n\n\u003cspan class=\"n\">text\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s2\">\"联系我：13812345678，办公室 010-88886666\"\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">findall\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"1[3-9]\\d\u003c/span>\u003cspan class=\"si\">{9}\u003c/span>\u003cspan class=\"s2\">\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">text\u003c/span>\u003cspan class=\"p\">))\u003c/span>      \u003cspan class=\"c1\"># ['13812345678']\u003c/span>\n\n\u003cspan class=\"n\">masked\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">sub\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"(1[3-9]\\d)\\d\u003c/span>\u003cspan class=\"si\">{4}\u003c/span>\u003cspan class=\"s2\">(\\d\u003c/span>\u003cspan class=\"si\">{4}\u003c/span>\u003cspan class=\"s2\">)\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"\\1****\\2\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">text\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">masked\u003c/span>\u003cspan class=\"p\">)\u003c/span>      \u003cspan class=\"c1\"># 138****5678——保留前 3 后 4，中间打码\u003c/span>\n\n\u003cspan class=\"n\">m\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">search\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"(?P&lt;area&gt;\\d{3,4})-(?P&lt;num&gt;\\d{7,8})\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">text\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">m\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">group\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"area\"\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"n\">m\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">group\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"num\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>       \u003cspan class=\"c1\"># 010 88886666\u003c/span>\n\n\u003cspan class=\"n\">tags\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">findall\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"&lt;h(\\d)&gt;(.*?)&lt;/h\\1&gt;\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"s2\">\"&lt;h1&gt;标题&lt;/h1&gt;&lt;h2&gt;小节&lt;/h2&gt;\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">tags\u003c/span>\u003cspan class=\"p\">)\u003c/span>        \u003cspan class=\"c1\"># [('1', '标题'), ('2', '小节')]——非贪婪 + 反向引用\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\n\n\u003ch3>💡 例题\u003c/h3>\n\u003ch4 class=\"ex-title\">例题 1：解析日志行\u003c/h4>\n\u003cp>用命名分组正则从日志行里取出日期、时间、级别、状态码，打印 level 和 code。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"n\">log\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"s1\">'2026-09-13 10:23:01 ERROR [web] GET /api/user 500'\u003c/span>\n\u003cspan class=\"n\">pattern\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"(?P&lt;date&gt;\\d\u003c/span>\u003cspan class=\"si\">{4}\u003c/span>\u003cspan class=\"s2\">-\\d\u003c/span>\u003cspan class=\"si\">{2}\u003c/span>\u003cspan class=\"s2\">-\\d\u003c/span>\u003cspan class=\"si\">{2}\u003c/span>\u003cspan class=\"s2\">) (?P&lt;time&gt;[\\d:]\u003c/span>\u003cspan class=\"si\">{8}\u003c/span>\u003cspan class=\"s2\">) \"\u003c/span>\n           \u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"(?P&lt;level&gt;ERROR|WARN|INFO) .*? (?P&lt;code&gt;\\d\u003c/span>\u003cspan class=\"si\">{3}\u003c/span>\u003cspan class=\"s2\">)$\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"n\">m\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">search\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">pattern\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">log\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">m\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">group\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"level\"\u003c/span>\u003cspan class=\"p\">),\u003c/span> \u003cspan class=\"n\">m\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">group\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"code\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>     \u003cspan class=\"c1\"># ERROR 500\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>命名分组让代码可读；\u003ccode>ERROR|WARN|INFO\u003c/code> 多选一；\u003ccode>$\u003c/code> 锚定行尾确保 \u003ccode>\\d{3}\u003c/code> 抓的是最后的状态码。\u003c/p>\n\u003ch4 class=\"ex-title\">例题 2：密码强度校验\u003c/h4>\n\u003cp>写 \u003ccode>check_password(pwd)\u003c/code> 检查长度 ≥8、含大写、含数字三条规则，返回所有不满足的说明。\u003c/p>\n\u003cdetails class=\"answer\" open data-mark=\"0\">\u003csummary>\u003cspan class=\"ans-dot\">\u003c/span>\u003cspan class=\"ans-label\">参考答案\u003c/span>\u003cspan class=\"ans-state\">\u003c/span>\u003cspan class=\"ans-hint\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cdiv class=\"hl\" data-lang=\"python\">\u003cpre>\u003ccode>\u003cspan class=\"k\">def\u003c/span>\u003cspan class=\"w\"> \u003c/span>\u003cspan class=\"nf\">check_password\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">pwd\u003c/span>\u003cspan class=\"p\">:\u003c/span> \u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">-&gt;\u003c/span> \u003cspan class=\"nb\">list\u003c/span>\u003cspan class=\"p\">[\u003c/span>\u003cspan class=\"nb\">str\u003c/span>\u003cspan class=\"p\">]:\u003c/span>\n    \u003cspan class=\"n\">problems\u003c/span> \u003cspan class=\"o\">=\u003c/span> \u003cspan class=\"p\">[]\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"nb\">len\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">pwd\u003c/span>\u003cspan class=\"p\">)\u003c/span> \u003cspan class=\"o\">&lt;\u003c/span> \u003cspan class=\"mi\">8\u003c/span>\u003cspan class=\"p\">:\u003c/span>\n        \u003cspan class=\"n\">problems\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"至少 8 位\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">search\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"[A-Z]\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">pwd\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"n\">problems\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"需要大写字母\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">if\u003c/span> \u003cspan class=\"ow\">not\u003c/span> \u003cspan class=\"n\">re\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">search\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"sa\">r\u003c/span>\u003cspan class=\"s2\">\"\\d\"\u003c/span>\u003cspan class=\"p\">,\u003c/span> \u003cspan class=\"n\">pwd\u003c/span>\u003cspan class=\"p\">):\u003c/span>\n        \u003cspan class=\"n\">problems\u003c/span>\u003cspan class=\"o\">.\u003c/span>\u003cspan class=\"n\">append\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"需要数字\"\u003c/span>\u003cspan class=\"p\">)\u003c/span>\n    \u003cspan class=\"k\">return\u003c/span> \u003cspan class=\"n\">problems\u003c/span>\n\n\u003cspan class=\"nb\">print\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"n\">check_password\u003c/span>\u003cspan class=\"p\">(\u003c/span>\u003cspan class=\"s2\">\"abc123\"\u003c/span>\u003cspan class=\"p\">))\u003c/span>   \u003cspan class=\"c1\"># ['至少 8 位', '需要大写字母']\u003c/span>\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\n\n\u003cp class=\"parse\">\u003cspan class=\"parse-tag\">解析\u003c/span>把每个规则独立成一条 if + 小正则，比一个 50 字符的巨型正则\u003cstrong>好读一百倍\u003c/strong>，报错还能精确到规则。\u003c/p>\n\u003ch3>✏️ 作业\u003c/h3>\n\u003col class=\"hw-list\">\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>校验邮箱：规则自定但要说清（如 \u003ccode>@\u003c/code> 前为字母数字下划线点、域名至少一个点）。够用就行，别追求完美。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>把文本里 \u003ccode>2026/9/3\u003c/code>、\u003ccode>2026-09-3\u003c/code> 等各种写法统一成 \u003ccode>2026-09-03\u003c/code>。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-base\">基础\u003c/span>从 html 片段中提取所有 \u003ccode>&lt;a href=\"...\"&gt;\u003c/code> 里的链接。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-adv\">进阶\u003c/span>findall + Counter 统计英文文章词频（与第 11 课的 split 法对比：标点处理差在哪）。\u003c/li>\n\u003cli>\u003cspan class=\"badge b-chal\">挑战\u003c/span>解析 nginx 日志行 \u003ccode>127.0.0.1 - - [13/Sep/2026:10:00:00] \"GET /a HTTP/1.1\" 200 123\u003c/code>，提取 IP、时间、路径、状态码。\u003c/li>\n\u003c/ol>","counts":{"kp":6,"ex":2,"hw":5,"points":0,"codes":3,"answers":2},"text":"📚 知识点 正则 = 描述字符串模式的迷你语言： import re 。 常用元字符： . 任意字符、 \\d 数字、 \\w 字母数字下划线、 \\s 空白、 ^ 开头、 $ 结尾；量词 * ≥0 次、 + ≥1 次、 ? 0 或 1 次、 {3} 恰 3 次、 {2,4} 2 到 4 次。 字符组 [abc] 、 [0-9] 、 [^a] （非 a）；多选一 cat|dog ；分组 (...) ，命名分组 (?P&lt;名字&gt;...) 。 贪婪 vs 非贪婪： .* 吃到不能再吃； .*? 吃到满足为止（解析 HTML 类文本必用后者）。 核心函数： re.findall （所有匹配）、 re.search （第一个匹配）、 re.match （从头匹配）、 re.sub （替换）、 re.split （切分）。 实战观：能拆成\"逐条校验 + 汇总\"的别堆一个巨型正则；复杂正则用 re.VERBOSE 分行写注释。 💡 例题 例题 1：解析日志行 用命名分组正则从日志行里取出日期、时间、级别、状态码，打印 level 和 code。 参考答案 解析 命名分组让代码可读； ERROR|WARN|INFO 多选一； $ 锚定行尾确保 \\d{3} 抓的是最后的状态码。 例题 2：密码强度校验 写 check_password(pwd) 检查长度 ≥8、含大写、含数字三条规则，返回所有不满足的说明。 参考答案 解析 把每个规则独立成一条 if + 小正则，比一个 50 字符的巨型正则 好读一百倍 ，报错还能精确到规则。 ✏️ 作业 基础 校验邮箱：规则自定但要说清（如 @ 前为字母数字下划线点、域名至少一个点）。够用就行，别追求完美。 基础 把文本里 2026/9/3 、 2026-09-3 等各种写法统一成 2026-09-03 。 基础 从 html 片段中提取所有 &lt;a href=\"...\"&gt; 里的链接。 进阶 findall + Counter 统计英文文章词频（与第 11 课的 split 法对比：标点处理差在哪）。 挑战 解析 nginx 日志行 127.0.0.1 - -
